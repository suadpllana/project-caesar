  { reading = "a digest may sit anywhere inside its span", hand_case = "a heartbeat that could fall before or after an in-span digest if digests floated, and must follow it" },
  { reading = "a hand-off at release is not counted as a grant", hand_case = "a release that passes a lock and brings the grant total to a multiple of the period" },
  { reading = "a waiting session may still send entries", hand_case = "a session queued on one lock that would otherwise heartbeat for another it holds" },
  { reading = "a heartbeat is legal without a held lock", hand_case = "a span whose heartbeat total can only be met by a session that holds nothing" },
  { reading = "the end of a span is never a candidate", hand_case = "a span where one account stops after two entries and another continues with a heartbeat" },
  { reading = "an audit listed inside a span is checked against the table the span ends with", hand_case = "a span whose audit counts one release fewer than the span holds, so the release must follow it" },
  { reading = "a release frees the lock whatever its depth", hand_case = "a reentered lock released once and then requested by another session" },
]
correct_variants = [
