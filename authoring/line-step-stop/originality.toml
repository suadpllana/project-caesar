  "writing a debugger step in step over step out DWARF line table tutorial",
  "benchmark task implement source-level debugger stepping toy virtual machine line table inline",
  "terminal-bench debugger task step next finish breakpoint toy ISA",
  "\"is_stmt\" \"inlined\" stepping \"same line\" debugger stop rule call site line gdb infrun \"stepped into inlined function\"",
]
results = "Returned: Sy Brand's debugger series (naive stepping on real hardware), the gdb manual's inline-functions page (user-level behaviour only), gdb's inline-frame.c and infrun.c sources, an LLVM issue showing that gdb and lldb step into an inlined call differently, the DWARF introduction, general gdb tutorials, and patents on stepping with internal breakpoints. None describes a stepping engine for a target that cannot afford single-stepping, none combines part-way line adoption, hidden call-site depth and recursion-safe planted addresses, and the two real debuggers disagree with each other on the inline rule, so neither can serve as an oracle for this one."
