  { reading = "the victim tie goes to the earlier request", hand_case = "two transactions with one record each in a cycle" },
  { reading = "a cycle through a queued request counts as a deadlock", hand_case = "a shared holder upgrading behind a queued writer" },
  { reading = "settling grants the most recent grantable request first", hand_case = "two waiting readers freed by one commit with a writer between them" },
]
correct_variants = [
