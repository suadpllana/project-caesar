# Difficulty record for lock-upgrade-deadlock, transcribed from the task's own documentation after
# the 2026-09-10 difficulty recovery. Every claim below restates one already made in the files
# listed under task.sources; nothing is added for the score.

[task]
slug = "lock-upgrade-deadlock"
status = "pending"
sources = [
  "tasks/lock-upgrade-deadlock/STATE.md",
  "tasks/lock-upgrade-deadlock/task.toml",
  "tasks/lock-upgrade-deadlock/instruction.md",
  "tasks/lock-upgrade-deadlock/tests/test_outputs.py",
