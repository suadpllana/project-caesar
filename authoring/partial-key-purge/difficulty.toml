[task]
slug = "partial-key-purge"
status = "recovery"
sources = ["tasks/partial-key-purge/STATE.md", "probes/partial-key-purge/notes.md"]
expert_hours = 12
estimated_solves = 2

[plan]
first_plan = """
The plan all three probe agents wrote before running anything: a counter per match set for the
delete's least fixed point, and an audit that folds the cascade structure into one ownership
tree - the removed sets of lone deletes nest, so each is a subtree - with loop members and rows
of two-cascade tables hung from the top, per-row replay for whatever the tree cannot express,
and a brute force written from the brief to check it all on small stores.
"""
first_plan_source = "prior"
breaking_rule = """
Merge revisions: a row with two cascade references goes when it loses either, and later rows are
based on it, so deleting either parent's line takes the merge and everything after it while a
row that matches several revisions still goes only when all of them go. Removed sets overlap
without nesting, so the ownership tree gives wrong counts; reachability from the deleted row
(descendants) gives wrong counts on every row that matches more than one row; and a loop through
a merge row can be broken from outside, so loop members are no longer safe at the top.
"""
second_discovery = """
Once the audit is rebuilt on the sets of rows whose lone delete removes each row - a union over
cascade references of an intersection over matches - the depth limit invalidates that
representation: the real database refuses a cascade that goes past fifteen rounds, a row's round
is a minimum over its lost cascade references of a maximum over their matches, and a deleter
set records only that a row goes, not when. The rounds have to be rebuilt per deleter up to the
limit, and every refusal has to be named - the first declared failing key or reference and its
smallest failing id - which is a minimum, not a sum, so the signed marks that carried the old
audit cannot express it and depth failures have to exclude the deleters that reach the row in
time.
"""
second_discovery_effect = "replan"
first_plan_correct = false
expert_path = [
  "Read the parser, the row store and the shipped referential pass, run the samples and see partial references treated as simple ones and the cascade recursing per row",
  "Rewrite matching per mode, with an index per pattern of non-null reference columns so a partial row finds every row it matches",
  "Rewrite delete as a round-by-round set computation: count each (row, reference) pair's standing matches, remove a row in the round after one of its cascade references runs out, then clear and check",
  "Refuse on restrict losses, on rows removed after round fifteen through every cascade reference they lost, and on the end state after clearing, and name the first declared failure with its smallest id",
  "Write the audit as a per-row replay first, confirm it on small stores, time it on deep.txt and see the quadratic cost",
  "Try the ownership tree and find that merge revisions break nesting and that rows matching several revisions break reachability; reformulate each row's deleters as a union over cascade references of an intersection over their matches, held as bit sets",
  "Settle the deleter sets as least fixed points: components of the cascade-match graph dependencies first, loops grown from each row alone",
  "Add the rounds: the deleters that remove a row within fifteen rounds, built one round at a time or by bounded forward deletes; the depth failures are the deleters outside that set",
  "Read counts off the sets with column sums, clearing and end-state failures off set algebra over which setnull references fire, and name refusals by visiting failures in declaration and id order so each deleter keeps the first",
  "Check the audit against the replay on small and medium stores with merges, loops and cascades near fifteen rounds, then time it on the deep stores",
]

[search]
best_page = """
The SQL standard's MATCH SIMPLE, FULL and PARTIAL rules as summarised in the Foreign key article
and PostgreSQL's constraint documentation; MySQL's InnoDB documentation of the fifteen-level
limit on nested foreign-key cascades; Eclipse MAT's retained sets through a dominator tree; and
the bit-set dynamic programme for counting reachable nodes in a DAG.
"""
helps_plan = false
deviation = """
No engine implements PARTIAL actions and the standard never says how several rows lost in one
statement combine; MySQL's limit counts the recursion depth of a row-by-row cascade, not rounds
of a set-based one in which a row goes at the earliest of its references; retained sets assume
one tree and free loops by reachability; and descendant counting treats every match as enough to
remove a row. None covers deleter sets that are unions of intersections, rounds per deleter, or
refusal names as minima over declaration and id.
"""

[tactics]
A1 = """
The plan every solver brings - nested removed sets in one ownership tree, or descendants in a
DAG - is the textbook answer for exactly half of the rule each time: the tree is right for rows
that match several rows and wrong at merges, reachability is right at merges and wrong for rows
that match several rows, so both familiar plans produce confident wrong counts.
"""
A2 = """
The brief states what a delete removes, clears and refuses, how rounds are counted and what the
audit prints, and never names deleter sets, least fixed points, dominator trees, reachability,
bit sets or column sums, so the structure has to be derived from the stated rules.
"""
A3 = """
No single known technique covers the audit: dominators need every row to hang from one owner,
reachability needs every match to be enough, and the depth limit needs the round at which each
deleter reaches each row; the solver has to combine intersections, unions and rounds itself.
"""
B2 = """
Match rules, the least fixed point, OR across cascade references, rounds and the fifteen-round
refusal, pre-statement matching, column-list clearing, RESTRICT against NO ACTION timing,
end-state checks and refusal naming all hold at once, and each changes what a correct audit line
means, because the audit is defined as the delete itself.
"""
C1 = """
Both sides of every fence are graded: a cascade of exactly fifteen rounds passes and sixteen is
refused, a merge goes with either parent but a row matching several revisions needs all of them,
a loop keeps itself unless a merge member loses its other parent, and plain single-parent chains
must cascade exactly as any engine does.
"""
C3 = """
The deep stores have about thirty-six thousand rows in merge histories; the exactly correct
per-row replay needs about 2,400 seconds against a 180-second limit for the whole graded set, and
the hybrid the probe agents shipped - a tree plus replay of the rows it cannot express - replays
three rows in four, because 74.8% of the rows of a deep store remove a row with two cascade
references when deleted alone (measured on deep-0), and those are the rows with the big sets.
"""
C4 = """
Every graded script must match line for line on statement outcomes, dumps and audit lines with
refusal names, over hand scripts and a population generated inside the verifier after the agent
has finished, shaped around merges, loops through merges, cascades near fifteen rounds, half-null
rows, clearing and refusal order.
"""
guard = """
Five files under /app/db are collected and nothing else; the parser, the row store, the printer
and the driver are the verifier's own pristine copies, so the grammar and the output format
cannot be reshaped and a new module beside the five is never read.
"""

[decisions]
graded = 16
interactions = [
  { a = "a row with two cascade references goes when it loses either", b = "a row matching several rows through one reference goes only when all of them go", why = "the removed set is an AND inside a reference and an OR across references, so neither nested subtrees nor descendants describe it and the audit's structure has to be derived from both at once" },
  { a = "removal runs in rounds and a cascade past fifteen rounds is refused", b = "a merge row goes at the earliest of its references", why = "the round is a minimum over references of a maximum over matches, so a merge can shorten a cascade and a longest-path or tree-height count refuses deletes that pass" },
  { a = "the audit prints the refusal each lone delete would print", b = "the depth failures, restrict losses and end-state failures of every deleter", why = "the name is a minimum over failing rows by declaration then id, which signed sums cannot give, and the depth failures must exclude the deleters that reach the row within fifteen rounds" },
  { a = "rows that match only one another keep each other", b = "a loop member that is a merge can lose its other parent", why = "loops are safe at the top only when every member has no cascade reference leaving the loop, so the fixed point has to be grown rather than assumed" },
  { a = "matches are judged on values from before the statement", b = "SET NULL clears a listed subset of reference columns", why = "clearing must not change what the statement removes, yet the end-state check reads the cleared values, and which setnull references fire depends on the deleter" },
  { a = "RESTRICT refuses on any row that loses it", b = "NO ACTION is checked only on the end state", why = "the two actions need different checks inside one statement, and both feed the same refusal name" },
]
per_decision_feedback = false

[fences]
ordinary_case = """
Plain single-parent revision chains and notes, cascading exactly as any engine does, including a
delete whose cascade runs exactly fifteen rounds and is accepted: a solver that refuses too much
or keeps too much fails here before any merge is involved.
"""
late_case = """
A deep store with merges throughout: the tree plan's counts are wrong at every merge, the hybrid's
replay runs out of time, and a delete that a merge shortens to twelve rounds is accepted where a
longest-path count refuses it; each shows only after the fast audit exists.
"""
oracle_denied = """
No database implements partial-match actions and none counts cascade rounds this way; MySQL's
limit is on recursion depth; the shipped audit replays the shipped delete; so every tool at hand
confirms a different semantics or none, and the agent's own brute force cannot run at the deep
scale where the fast path's structure matters.
"""

[leaks]
candidates = [
  { what = "a remaining-match count, owner, round or deleter field stored on rows", closed_by = "rows carry only an id and column values; nothing derived from references is stored" },
  { what = "a partial-match index already maintained by the frozen row store", closed_by = "the frozen store keeps rows by id only; every index over column values is built in the editable modules" },
  { what = "expected outputs for the sample scripts", closed_by = "no expected output ships; the brief quotes one line of one sample, a plain result without merges" },
  { what = "helper names that name the structure", closed_by = "no owner, dominator, ancestor, deleter, round or bit-set helper exists in the shipped tree" },
  { what = "the shipped audit's per-row replay revealing the method", closed_by = "the replay is the stated definition, not the method; it is slow and built on the wrong delete" },
]
derived_quantities = """
Scripts carry table declarations, keys, references with their mode and action, row values and
statements; match sets, removal sets, rounds, clearing sets, refusals and audit counts are all
derived and none of them ships anywhere in the tree.
"""
oracle_shipped = false

[gate]
present = true
naive_family = """
An exactly correct audit that replays a lone delete of every row with the correct rounds and
refusal naming; its cost is the sum of all removed sets, about four thousand rows per delete on
the deep stores.
"""
invariant = """
A row's deleters are the row plus, for each cascade reference, the deleters common to all its
matches, so the sets compose along the cascade-match graph and are settled once per component;
the deleters within k rounds compose the same way from those within k - 1, so fifteen layers give
the depth limit, and counts and names are read off the sets.
"""
input_scale = "about thirty-six thousand rows, most in four merge histories of six to seven thousand revisions"
limit_seconds = 180
measured = true
why_not = ""

[cheats]
wrong_readings = [
  { reading = "removed sets nest in one ownership tree, as the probe's winning plan had it", hand_case = "merge-either: deleting the branch parent of a merge removes the merge and the revision based on it" },
  { reading = "a row with two cascade references goes only once it has lost both", hand_case = "merge-either: the merge goes when only its branch parent is deleted" },
  { reading = "a reference is lost when any row it matched is removed", hand_case = "merge-wild-side: deleting one revision of a document leaves a merge from the whole document standing" },
  { reading = "rows on a loop keep one another against every delete but their own", hand_case = "or-loop-broken: deleting the outside parent of a merge member unravels its loop" },
  { reading = "a row's round is the longest chain of lost references to it", hand_case = "depth-merge-shortcut: a merge shortens a twenty-revision cascade to twelve rounds and it is accepted" },
  { reading = "the limit bites at round fifteen", hand_case = "depth-limit: a cascade of exactly fifteen rounds is accepted" },
  { reading = "there is no depth limit", hand_case = "depth-limit: a note removed in round sixteen refuses the delete" },
  { reading = "a row removed too deep fails only the reference that removed it", hand_case = "depth-both-refs: a merge removed too deep fails its merged-from reference, declared first, as well" },
  { reading = "a refused delete prints zero counts in the audit", hand_case = "audit-names: refused audit lines still carry the counts of what the delete would remove" },
