# Difficulty record for publish-settle-order, transcribed after the fact from the task's own
# documentation. Every claim below restates one already made in the files listed under
# task.sources; nothing is added. Fields the documentation does not support are left empty.

[task]
slug = "publish-settle-order"
status = "pending"
sources = [
  "tasks/publish-settle-order/STATE.md",
  "tasks/publish-settle-order/task.toml",
  "tasks/publish-settle-order/instruction.md",
  "tasks/publish-settle-order/tests/test_outputs.py",
  "tasks/publish-settle-order/cheat/",
  "authoring/publish-settle-order/readings.py",
  "authoring/publish-settle-order/variants/",
]
expert_hours = 12
estimated_solves = 2

[plan]
first_plan = """
Read the six editable files against the six paragraphs of the brief and rewrite all six in one
pass: an integer serial minted at publication that is both identity and order key, per-name
buckets per scope sorted by that serial, a heap keyed by it for the sweep, one scope attribute
per unit, a retention ledger fed by publication and retirement only, and an in-progress set
local to one activation; then, on a miss, bring the auto unit up with the ordinary activation
and resolve again. This is the plan all three probe agents wrote, before any program was run.
"""
first_plan_source = "instruction"
breaking_rule = """
A call that finds nothing it can see brings up the first unit marked auto, in the order the
marks were made, as if the caller had named it as a dependency: what comes up is published
directly ahead of the caller in the publication order and not at the back, into the scope the
caller reads or public if the caller reads none, it takes no hold, and the caller keeps it up
until the caller goes down. A serial can no longer order anything once a publication can land
ahead of the caller: a bucket sorted by it answers the wrong head, a heap keyed by it retires
the wrong unit first, and promotion inserts in the wrong place.
"""
second_discovery = """
Having replaced the serial with a float midpoint between neighbours, the key is exact for the
first fifty-odd loads in front of one caller and silently wrong after that; the fan-deep
program puts sixty loads in front of one caller and fails a key made of float midpoints and
nothing else, so the order key has to be one that admits insertion at the same spot without
bound - a tuple with a suffix or an exact fraction - and the same key must also be the identity
that separates two lives of one record. The author records finding the first discovery by
thinking about auto-order and this one never without the fan family.
"""
second_discovery_effect = "replan"
first_plan_correct = false
expert_path = [
  "read ops.py to learn the op set and which entry points each op reaches",
  "read reg/tab.py and reg/order.py and notice that records are reused across lives and that the order is a linked list with an insertion primitive",
  "write the activation walk with publication and startup interleaved per unit and the in-progress set on the host",
  "mint a key per publication that is both its identity and its place, admitting insertion directly ahead of a live unit (a tuple with a suffix, or an exact fraction between neighbours)",
  "keep two attributes per unit, what its publication is and what it reads",
  "keep buckets per scope and name sorted by key and answer the earlier of the two heads",
  "on a miss, bring the first auto unit in mark order that is neither up nor part way up up ahead of the caller into the caller's read scope, record the binding on the caller's record, and resolve again",
  "keep the ledger fed by publication, binding and retirement and the cascade queue keyed by the same key",
  "time progs/wide.txt and progs/tear.txt, multiply by three, and check it against the limit",
]

[search]
best_page = """
The neighbouring real machinery: OSGi lazy activation, where wiring is fixed at resolve time and
activation happens on first class load; VS Code activation events; dynamic-linker lazy binding.
"""
helps_plan = false
deviation = """
Those systems carry the principle that resolution order is not activation-time order, but no
public description states this rule set - a lazily loaded unit taking a dependency's place in
the resolution order, kept up by its caller, published into the caller's scope - and the graded
object is this host's exact trace.
"""

[tactics]
A1 = """
The prior for a lazy load is coherent and specifically wrong twice: it appends, and it holds.
The prior for a promoted unit is that it reads what its publication reads. All stated the other
way.
"""
A2 = """
Nothing is named: no lazy binding, no generation, no label, no order maintenance, no index. The
brief says where a unit is published and what keeps it up.
"""
A3 = """
Insertion ahead of a live unit, first-in-order resolution across two buckets, and last-first
retirement, all at scale, have no single structure that gives all three; and the key that admits
insertion must also be the identity that separates two lives of one record.
"""
B2 = """
One event, the load, is an order event, a scope event, a retention event and a resolution event
at once, and the four modules that own those have to agree on it. All six shipped modules are
wrong and the shipped load is wrong in four ways at once.
"""
C1 = """
Both fences on every new axis: auto-bound against auto-plain, auto-scope against
auto-scope-mates, auto-dead against auto-late-mark, cycle-stays against casc-order,
promote-reads-home against scope-no-republish.
"""
C2 = """
No oracle: a spec-derived brute-force model is right for free - a list with insert needs no
key - and transfers nothing about the fast structures.
"""
C3 = """
Six measured boundaries, each with a fast path that follows from an invariant: the order is
spliced into only directly ahead of a live unit, each bucket is a subsequence of one order,
retention changes only at publication, load and retirement.
"""
C4 = """
All-or-nothing over 56 enumerated programs and 456 nonce programs in twelve families, generated
inside the verifier from a seed drawn after the agent's container is gone.
"""
guard = """
Only the six files under /app/link/ are declared artifacts; the verifier overlays them onto its
own pristine copy of the tree, so the op dispatch, the record table, the declaration store, the
order and the program reader cannot be reshaped by the agent.
"""

[decisions]
graded = 16
interactions = [
  { a = "the load is published directly ahead of the caller (rule 15)", b = "which publisher answers a name, first in publication order (rule 6)", why = "a serial orders nothing once a publication can land ahead of the caller, so every structure keyed by it - buckets, heap, promotion insert - has to be rekeyed by something that admits insertion and still identifies a life of a record" },
  { a = "the load goes into the scope the caller reads (rule 15)", b = "act on a unit up in a scope makes it public where it stands and it goes on reading its scope (rule 5)", why = "the load goes into the caller's read scope, which a promoted unit still has, so one scope attribute per unit is one too few" },
  { a = "the caller keeps up what it loaded until it goes down (rule 15)", b = "what keeps a live unit up and the sweep after a release (rules 10 and 11)", why = "the ledger has a third writer and the caller's record has to remember what to give back when it goes down, not when it next comes up" },
  { a = "a load from inside a startup call (rules 15 and 2)", b = "the walk skips a unit that is already up or part way up (rule 1)", why = "a startup call inside the load can miss on a name the unit part way up publishes, so the in-progress set has to be one set on the host shared across nested activations" },
  { a = "the call is answered by rule 6 over the order as it now stands (rule 16)", b = "what comes up ahead of the caller, in the order it comes up (rule 15)", why = "the answer after the load is whatever is first in the order now, which is the loaded unit's own dependency when that publishes the name" },
  { a = "a settled use carries the identity of the publication it settled on (rule 9)", b = "the order key that admits insertion (rule 15)", why = "the key that admits insertion must also be the identity that separates two lives of one record, because reg/tab.py hands the same record back after a retirement" },
  { a = "a call reaches a publication only when it is public or in the scope the caller reads (rule 4)", b = "the first visible publisher in publication order (rule 6)", why = "the answer for a caller is the earlier of two heads, the public list and the caller's own scope, which follows from each bucket being a subsequence of one order" },
]
per_decision_feedback = false

[fences]
ordinary_case = """
Retiring too little fails casc-order, chain, pre-no-keep and auto-next-life; never settling a
use fails stick-dead; refusing to bring an auto unit up for an open use fails auto-late-mark;
and a unit that stops reading its scope once act has made it public fails promote-reads-home.
"""
late_case = """
The fast structures fail on programs an agent does not write unprompted: a competitor opened
privately before the load and promoted after it, sixty loads in front of one caller (fan-deep,
where a float midpoint key is exact for the first fifty-odd and silently wrong after), a load
from a promoted unit, and a load from inside a startup call of a unit part way up.
"""
oracle_denied = """
A brute-force model written from the brief gets every rule right for free - a list with insert
needs no key - and confirms nothing about the structures that have to replace it; all six
shipped modules are wrong, the shipped load is wrong in four ways at once, and the two
execution limits are the only feedback a wrong structure gets.
"""

[leaks]
candidates = [
  { what = "an expected trace beside a shipped program", closed_by = "the tree ships eight programs and no expected trace for any of them; the answer is a sequence of events produced by running a program, and nothing in the tree stores one" },
  { what = "a publication key, generation counter, resolution cache, dependent list or binding list", closed_by = "none ships; each is the agent's to invent, and a serial that nothing reads would be a dead field that deadfieldcheck exists to catch" },
  { what = "the insertion primitive put in reg/order.py", closed_by = "it is on the live path: the shipped walk.py uses it, wrongly, for the loaded unit and not its closure, so it is not an unused affordance" },
  { what = "Host.autos, the list of auto marks", closed_by = "a declaration store, not a derived quantity: the marks in the order the program made them, which is what the rule refers to" },
  { what = "gt.json and the sealed model", closed_by = "baked into the verifier image only, in tests/seal chmod 700 before any agent code runs; the answer-key probe reports PermissionError" },
  { what = "per-axis confirmation before commit", closed_by = "one trace per program, all-or-nothing, and the frozen order offers no comparable position: pos is a walk" },
]
derived_quantities = """
Rec holds what the program declared - needs, pubs, boots, auto - plus live, uses and the order
links that the frozen order module maintains; Host.autos is the list of marks in the order made.
No publication key, generation counter, resolution cache, dependent list or binding list ships.
"""
oracle_shipped = false

[gate]
present = true
naive_family = """
Resolutions that are exactly correct and too slow: comparing candidates by walking the order to
their positions, one list per name filtered by visibility at lookup, rebuilding the index on
every load, scanning the order; and teardowns that answer the retention question by a scan or
find each cascade candidate by rescanning the live set. All six produce exactly the reference's
traces.
"""
invariant = """
The order admits insertion only directly ahead of a live unit, so an order key that admits
insertion is enough and positions are not; each bucket is a subsequence of one order, so the
answer is the earlier of two heads; retention changes only at publication, load and retirement.
"""
input_scale = "three programs of each large size - wide.txt is 52,000 units and 26,000 calls of which 5,000 bring a unit up, tear.txt is 24,000 units a single release brings down - plus about 450 small ones (456 nonce programs in twelve families and 56 hand programs); all of it inside the limit"
limit_seconds = 60
measured = true
# Measured on a quiet machine, one program each against the 60 s limit for the whole set:
# positions 43 s, filtered list 46 s, rebuild per load 202 s, scan 281 s (one wide program);
# retention scan 132 s, rescanning sweep 77 s (one tear program); reference 5.2 s for the set.
why_not = ""

