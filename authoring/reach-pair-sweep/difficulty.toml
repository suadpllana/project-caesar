[plan]
first_plan = """
Reachability plus the pair fixed point plus finalizer retention: walk from the frame slots, the
global table and the handle stack, fold the pair table in as a fixed point, keep the closure of
every unreached finalizable object and queue its finalizer, age and promote what survived, and
clear weak references to whatever was not reached. That is the previous version of this task,
which was rejected twice as not difficult, and the textbook answers to the pair fixed point, the
finalizer reprieve and the generational split do not compose here.
"""
first_plan_source = "prior"
breaking_rule = """
The brief says the remembered set is where a minor collection finds the nursery objects reachable
from old space and that /app/mem/rset.py is where it comes from. That file records a (source,
field, value) triple when a field of an old object is given a nursery value and never revisits
it, so the recorded value is a snapshot: overwrite the field and the triple stays, naming an
object nothing points at. The recorded field has to be read again rather than trusted. Trusting
the record keeps dead objects alive; ignoring the set releases live ones.
"""
second_discovery = """
Which finalizers join the queue is settled from what the walk reached, before any keeping is
granted, and what is kept to run a finalizer is not what survived: those objects do not age and
cannot promote, and a weak reference to one clears while the object is still there. So the walk
cannot produce one reached set; survived and merely kept have to be held apart as two sets and
that split carried into ageing and clearing. Getting ageing right then changes which space an
object is in, which changes what the next collection may trace, which changes the remembered
set - there is no order in which these can be settled one at a time.
"""
second_discovery_effect = "replan"
first_plan_correct = false
expert_path = [
  "read ops.py to find the five entry points and the order they are called in",
  "read mem/rset.py and notice the recorded value is never refreshed",
  "write roots for both collection kinds, re-reading each recorded field for the minor one",
  "write the walk with the pair table indexed by key",
  "settle the finalizer queue against the walk before keeping anything",
  "separate what survived from what is merely kept, as a second walk blocked from anything already reached",
  "carry that split into ageing and clearing",
  "apply the space rules: a minor collection traces, releases and clears only the nursery, but an old pair key is ready throughout",
]

