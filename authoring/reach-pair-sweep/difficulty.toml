[gate]
present = true
naive_family = """
Settling the pair table fixed point by rescanning the table until a sweep adds nothing: exactly
correct, and on a table written back to front it costs the table size times the chain depth.
"""
invariant = """
A pair can only newly fire when its key first enters the reached set, and a key enters once, so
the table indexed by key follows each pair the moment its key arrives and never looks at it
again.
"""
input_scale = "wide.txt is about seven thousand objects with a pair table written back to front; the graded ones run several times larger; 25 hand programs plus 312 nonce programs in six families"
limit_seconds = 60
measured = true
# Measured on the graded set: 0.7 s indexed by key against past 800 s rescanning, same answers.
why_not = ""

