correct_variants = [
  "ok-undo-log: every whole order walks for real inside a frame in both paces, no read-only count",
  "ok-sorted-list: the parked set as sorted trip-price lists with an arrival stamp per order",
  "ok-level-list: the best price found by scanning the live levels instead of a lazy heap",
  "ok-rebuild-level: a disclosure rebuilds the level's queue instead of rotating it",
  "ok-sink-replay: rows held back during a whole order are committed by calling the sink directly",
