# Difficulty record - written 2026-09-22, before any environment or verifier code existed.
# Restated in prose in tasks/replay-match-drift/STATE.md.

[task]
slug = "replay-match-drift"
status = "pending"
sources = ["tasks/replay-match-drift/STATE.md", "authoring/replay-match-drift/trace.md", "authoring/replay-match-drift/timing.py", "authoring/replay-match-drift/cheat_report.py"]
expert_hours = 9
estimated_solves = 2

[plan]
first_plan = """
Parse the recorded history into a list and keep a cursor into it. Walk the workflow body from
the top; each time the body issues a command, look at the line under the cursor, check it is
the command we expected, advance, read the result that follows it, and hand the value back.
When the body forks, keep a list of branches and run each one until it needs something, then
move to the next one that has been waiting longest. Switch to running for real when the cursor
reaches the end. Version markers return whatever the code asks for, and a body that asks for
something the history does not have is a history mismatch.
"""
first_plan_source = "prior"
breaking_rule = """
The order branches run in is the order their lines were recorded. A branch that waits goes down
carrying the position in the history of the line that will release it, and the branch that runs
next is the one able to run without waiting or, failing that, the waiting branch whose mark is
smallest - not the one that has waited longest, not the order they were forked, and not the
order anything was issued. A branch's place in that queue is a recorded position that cannot be
known until the branch has been matched, which cannot happen until the branch runs, so no list
of branches and no cursor over the history holds the schedule; it has to be derived.
"""
second_discovery = """
The live side is not a test any command makes. It opens when the whole run comes to a stop -
nothing able to run and nothing waiting for anything recorded - and from that point no command
is matched at all, which is what leaves recorded commands unmatched. A version marker with no
recorded choice reads that same state, so the arm a branch takes, and therefore which commands
exist, depends on a standstill its own branches have to reach. An implementation that decided
the boundary per command, or from how much history was left, has to be turned around rather
than corrected, and the per-kind counting it was built on is global across branches, so a wrong
schedule gives every later command the wrong recorded slot.
"""
second_discovery_effect = "replan"
first_plan_correct = false
expert_path = [
  "Run the shipped run files and read the one line the brief says is wrong, to find which module decides it",
  "Split the history into tables of commands per kind, results per kind and name and signals per tag, each carrying the position of its own line",
  "Give a waiting branch the position of the line that releases it, claiming a signal as it goes down rather than when it wakes",
  "Build the two queues the scheduling rule describes, one keyed by branch number and one by mark, and keep the branches with no mark apart",
  "Settle the live side as the standstill those set-aside branches make, printed once, after which nothing waits and nothing is matched",
  "Keep the matched positions as a set so the end-of-run check can name the earliest recorded command nobody matched",
  "Time the wide run files and replace the walk over the branches with a heap, which the history being fixed before the body starts makes sound",
]

[search]
best_page = """
The determinism and versioning pages of the published durable-execution runtimes, which is what
a query about replaying a workflow against its recorded history returns first: they explain that
a code change breaks replay, that a version marker returns the recorded branch, and that results
must come from the history rather than from running the work again.
"""
helps_plan = false
deviation = """
Those pages describe a single running position walked beside the code, and they say nothing
about what decides the order a concurrent body's branches run in on replay, on what axis a
command is counted against a result, when a marker with no record yields the legacy value, or
that a recorded command nobody issued is a failure while a recorded signal nobody took is not.
Every one of those is a decision here, and the retrieved page gives a plan that is wrong before
it starts.
"""

[tactics]
A1 = """
The remembered shape of replay is a cursor walking the history beside the code with the answer
next to the question; here the body is concurrent and the order its branches run in is the order
their lines were recorded, so the more faithfully the familiar structure is reproduced the
earlier it is wrong.
"""
A2 = """
The brief states the counting, pairing, boundary and leftover rules as what this runtime
does and never names determinism, versioning, or history matching, so the consequences that
decide the structure have to be derived instead of looked up under a term of art.
"""
B2 = """
Nine rules hold at once - the per-kind command counter, the per-kind-and-name answer
pairing, three different ways of taking a result, one global boundary, the marker default,
the leftover check and its exemption - and each changes what a correct implementation of the
others looks like.
"""
C1 = """
Both sides are graded: a body that matches its log exactly must replay to the end and never
print the boundary line, and a body with an empty log must cross it at the first command, so
a service that goes live early and one that never goes live both fail.
"""
C3 = """
Eight thousand branches over a history of a hundred and twenty-eight thousand lines make the
natural queue - a list of branches walked at each step for the one whose turn is next - take
137.8 seconds against a stated 60, while leaving it exactly correct; the reference takes 2.6 and
two engines written apart from it 3.3 and 2.5.
"""
C4 = """
Every program is compared line for line against a population generated inside the verifier
from a seed drawn after the agent's container is gone, plus enumerated programs aimed at
each rule and at both sides of each fence, all or nothing.
"""
guard = """
Only the seven files under /app/dur that carry the rules are collected; the run file grammar,
the body machine, the trace writer and the driver are the verifier's own clean copies, so an
eighth file beside the seven is never read and the interface between them is frozen.
"""

[decisions]
graded = 11
interactions = [
  { a = "the per-kind counter that matches a command", b = "the per-kind-and-name counter that pairs its answer", why = "getting the command match right on one axis produces the wrong value whenever two commands of a kind completed out of the order they were issued, so each rule decides what correct means for the other" },
  { a = "the marker default while replaying", b = "the boundary that ends replay", why = "the marker's value decides which branch runs and therefore which commands are issued, and the commands are what cross the boundary that the marker reads, so neither can be settled before the other" },
  { a = "the boundary being one global crossing", b = "the leftover check at the end of the body", why = "crossing per kind leaves recorded commands of the other kinds unmatched, which turns an otherwise finished run into a failure, so an implementation that gets the boundary wrong fails on a rule it implemented correctly" },
  { a = "taking the earliest answered outstanding command", b = "the pairing of answers to commands", why = "the answer order is defined by the pairing rule, so a wrong pairing silently reorders the race and the value it returns, with no separate signal that the pairing was the cause" },
  { a = "signals being exempt from the leftover check", b = "the leftover check naming the earliest unmatched command", why = "a reading that counts every unconsumed event reports a failure on the ordinary programs that leave a spare signal, and one that counts none passes the programs the check exists for" },
]
per_decision_feedback = false

[fences]
ordinary_case = """
A body whose log records exactly the commands it issues, in the same shapes, has to replay
to the end and print its result with no boundary line at all; an engine that goes live as
soon as anything looks unfamiliar fails it.
"""
late_case = """
A body that replays thirty commands correctly, crosses the boundary on a kind whose slots
ran out first, and then reaches its end with two recorded commands of another kind never
matched, where the run must report the earliest of them rather than the value it computed.
"""
oracle_denied = """
The shipped programs print traces but the brief gives the correct text of only one line, and
the graded programs are generated after the agent has finished, so running the service tells
the agent what its own code does and never what the answer was; the run files carry no
recorded verdict and no per-kind indices to compare against.
"""

[leaks]
candidates = [
  { what = "per-kind index carried on a recorded command event", closed_by = "the log records kind and name only, so the index a command matches on is implied by order within kind and has to be derived" },
  { what = "an event or field marking where the earlier attempt stopped replaying", closed_by = "nothing in the run file names the boundary; it is a consequence of the slots running out and is recomputed every run" },
  { what = "a recorded answer sitting immediately after the command it answers", closed_by = "the generator deliberately interleaves other kinds and completes commands out of issue order, so adjacency is never a usable rule" },
  { what = "the sample programs shipping with their correct traces", closed_by = "no expected output ships; the brief quotes one line of one program and it is a value, not a rule" },
  { what = "a helper in the tree that counts events by kind", closed_by = "the shipped engine keeps one cursor and counts nothing by kind, so the table has to be built rather than found" },
]
derived_quantities = """
The run file stores primitives only - the body's ops, the recorded events in the order they
happened, and the values live work returns - and never an index, a boundary, a match, a
verdict or any count, all of which are what the task is about deriving.
"""
oracle_shipped = false

[gate]
present = true
naive_family = """
Keeping the branches in a list and walking it at each step for the one whose turn is next, which
settles every rule the way the reference does. Measured on the six scale run files: 137.8
seconds, against 2.6 for the reference and 3.3 and 2.5 for the two correct engines written apart
from it. Walking the history for every lookup does not finish them at all.
"""
invariant = """
The history is fixed before the body starts, so the line that will release a waiting branch is
known at the moment it goes down; the queue of waiting branches is therefore keyed by a value
already in hand and can be a heap rather than a walk.
"""
input_scale = "three run files of eight thousand branches over a history of a hundred and twenty-eight thousand lines, and three of twenty-four thousand commands on one branch against forty-eight thousand"
limit_seconds = 60
measured = true
why_not = ""

