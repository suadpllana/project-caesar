# Difficulty record - written 2026-09-22, before any environment or verifier code existed.
# Restated in prose in tasks/replay-match-drift/STATE.md.

[task]
slug = "replay-match-drift"
status = "pending"
sources = ["tasks/replay-match-drift/STATE.md", "authoring/replay-match-drift/trace.md", "authoring/replay-match-drift/timing.py", "authoring/replay-match-drift/cheat_report.py"]
expert_hours = 9
estimated_solves = 2

[plan]
first_plan = """
Parse the recorded log into a list and keep a cursor into it. Walk the workflow body from
the top; each time the body issues a command, look at the event under the cursor, check it
is the command we expected, advance the cursor, read the result event that follows it, and
hand the value back to the body. Keep going until the cursor reaches the end of the log,
then switch to running for real and record what happens. Version markers return whatever
the code asks for, signals are read off the log in the order they appear, and a body that
asks for something the log does not have is a history mismatch.
"""
first_plan_source = "prior"
breaking_rule = """
A command is matched by its position among the commands of its own kind, not by its
position in the log: the third call matches the third recorded call whatever number of
timers and children sit between them, and a result is paired with its command by the order
of the two of them within kind and name together, which is a different counter from the one
that matched the command. Results also arrive out of the order their commands were issued,
so the answering event is not the event after the command. One cursor over one list cannot
express any of that.
"""
second_discovery = """
A version marker with no recorded choice yields the legacy value while the engine is still
replaying and the body's own value once it has gone live, so the branch the body takes -
and therefore which commands it issues at all - depends on whether the boundary has already
been crossed, while the boundary is crossed by a command running out of recorded slots. The
log cannot be walked ahead of the body or turned into a command plan, because the plan is
produced by the answers the log gives; the direction of the whole pass has to be inverted
from reading the log to asking it.
"""
second_discovery_effect = "replan"
first_plan_correct = false
expert_path = [
  "Run the shipped programs and read the one line the brief says is wrong, to find which module decides it",
  "Split the log into a table of issued commands per kind and a table of results per kind and name, since the brief counts the two on different axes",
  "Drive the pass from the body rather than from the log, so a command asks its kind's table for the slot its own counter names",
  "Hold the outstanding commands in issue order and the log's result order beside it, because taking the earliest issued and taking the earliest answered are different rules",
  "Settle the boundary as one global crossing that prints once, not one per kind, and make the marker read that state rather than the log's length",
  "Keep the matched set so the end-of-body check can name the earliest recorded command the body never issued, and skip that check when the body stopped short",
  "Deliver signals from a per-tag queue that survives the boundary, and leave them out of the unmatched check",
  "Time the wide programs and replace the per-command scans of the log with the tables built once, since the result order and the outstanding set are both read at every step",
]

[search]
best_page = """
The determinism and versioning pages of the published durable-execution runtimes, which is
what a query about replaying a workflow against its recorded history returns first: they
explain that a code change breaks replay, that a version marker returns the recorded branch,
and that activity results must come from history rather than from running the work again.
"""
helps_plan = false
deviation = """
Those pages describe a command sequence matched by a single running position and a result
that follows its command, and they never say on what axis a command is counted, how an
answer is paired with a command that completed out of order, when a marker with no record
yields the legacy value rather than the asked one, or that a recorded command the body never
issued is a failure while a recorded signal it never took is not. Every one of those is a
decision here, and the retrieved page gives a plan that is wrong at the first of them.
"""

[tactics]
A1 = """
The remembered shape of replay is a cursor walking the history beside the code with the
answer sitting next to the question; here the two counters differ and answers arrive out of
order, so the more faithfully the familiar structure is reproduced the earlier it is wrong.
"""
A2 = """
The brief states the counting, pairing, boundary and leftover rules as what this runtime
does and never names determinism, versioning, or history matching, so the consequences that
decide the structure have to be derived instead of looked up under a term of art.
"""
B2 = """
Nine rules hold at once - the per-kind command counter, the per-kind-and-name answer
pairing, three different ways of taking a result, one global boundary, the marker default,
the leftover check and its exemption - and each changes what a correct implementation of the
others looks like.
"""
C1 = """
Both sides are graded: a body that matches its log exactly must replay to the end and never
print the boundary line, and a body with an empty log must cross it at the first command, so
a service that goes live early and one that never goes live both fail.
"""
C3 = """
A wide family with tens of thousands of recorded events makes the per-command scan of the
log infeasible while leaving it exactly correct on everything it finishes, and the tables
that replace it follow from the log being fixed before the body starts.
"""
C4 = """
Every program is compared line for line against a population generated inside the verifier
from a seed drawn after the agent's container is gone, plus enumerated programs aimed at
each rule and at both sides of each fence, all or nothing.
"""
guard = """
Only the six files under /app/dur that carry the matching rules are collected; the run
file grammar, the body machine, the trace writer and the driver are the verifier's own
pristine copies, so a new file beside the six is never read and the interface between them
is frozen.
"""

[decisions]
graded = 11
interactions = [
  { a = "the per-kind counter that matches a command", b = "the per-kind-and-name counter that pairs its answer", why = "getting the command match right on one axis produces the wrong value whenever two commands of a kind completed out of the order they were issued, so each rule decides what correct means for the other" },
  { a = "the marker default while replaying", b = "the boundary that ends replay", why = "the marker's value decides which branch runs and therefore which commands are issued, and the commands are what cross the boundary that the marker reads, so neither can be settled before the other" },
  { a = "the boundary being one global crossing", b = "the leftover check at the end of the body", why = "crossing per kind leaves recorded commands of the other kinds unmatched, which turns an otherwise finished run into a failure, so an implementation that gets the boundary wrong fails on a rule it implemented correctly" },
  { a = "taking the earliest answered outstanding command", b = "the pairing of answers to commands", why = "the answer order is defined by the pairing rule, so a wrong pairing silently reorders the race and the value it returns, with no separate signal that the pairing was the cause" },
  { a = "signals being exempt from the leftover check", b = "the leftover check naming the earliest unmatched command", why = "a reading that counts every unconsumed event reports a failure on the ordinary programs that leave a spare signal, and one that counts none passes the programs the check exists for" },
]
per_decision_feedback = false

[fences]
ordinary_case = """
A body whose log records exactly the commands it issues, in the same shapes, has to replay
to the end and print its result with no boundary line at all; an engine that goes live as
soon as anything looks unfamiliar fails it.
"""
late_case = """
A body that replays thirty commands correctly, crosses the boundary on a kind whose slots
ran out first, and then reaches its end with two recorded commands of another kind never
matched, where the run must report the earliest of them rather than the value it computed.
"""
oracle_denied = """
The shipped programs print traces but the brief gives the correct text of only one line, and
the graded programs are generated after the agent has finished, so running the service tells
the agent what its own code does and never what the answer was; the run files carry no
recorded verdict and no per-kind indices to compare against.
"""

[leaks]
candidates = [
  { what = "per-kind index carried on a recorded command event", closed_by = "the log records kind and name only, so the index a command matches on is implied by order within kind and has to be derived" },
  { what = "an event or field marking where the earlier attempt stopped replaying", closed_by = "nothing in the run file names the boundary; it is a consequence of the slots running out and is recomputed every run" },
  { what = "a recorded answer sitting immediately after the command it answers", closed_by = "the generator deliberately interleaves other kinds and completes commands out of issue order, so adjacency is never a usable rule" },
  { what = "the sample programs shipping with their correct traces", closed_by = "no expected output ships; the brief quotes one line of one program and it is a value, not a rule" },
  { what = "a helper in the tree that counts events by kind", closed_by = "the shipped engine keeps one cursor and counts nothing by kind, so the table has to be built rather than found" },
]
derived_quantities = """
The run file stores primitives only - the body's ops, the recorded events in the order they
happened, and the values live work returns - and never an index, a boundary, a match, a
verdict or any count, all of which are what the task is about deriving.
"""
oracle_shipped = false

[gate]
present = true
naive_family = """
Walking the recorded log for each command the body issues and again for each result taken,
which settles every rule the way the reference does. Measured on the six scale run files:
306.4 seconds with every lookup walked and 153.2 with the commands indexed and only the
answers walked, against 0.9 for the reference and 1.0 for each of the two correct variants.
"""
invariant = """
The log is fixed before the body starts and commands of a kind are matched in order, so the
tables of commands per kind and of answers per kind and name can be built once and read by a
counter, and the answer order is a single index over the log.
"""
input_scale = "three run files of thirty thousand commands against sixty thousand recorded lines, and three of twenty-two thousand against forty-four thousand"
limit_seconds = 60
measured = true
why_not = ""

[cheats]
wrong_readings = [
  { reading = "one cursor over the whole log instead of a counter per kind", hand_case = "a body that issues a call, a timer and a call, whose log records the two calls with the timer between them" },
  { reading = "answers paired with commands by the per-kind index rather than by kind and name together", hand_case = "two calls of different names issued together whose recorded answers arrive in the opposite order" },
  { reading = "a version marker returning the body's own value while still replaying", hand_case = "a body whose marker has no recorded choice and whose branch on zero issues a command the log holds" },
  { reading = "a version marker returning the legacy value after the boundary", hand_case = "a body with an empty log whose branch decides which of two commands is issued live" },
  { reading = "crossing the boundary per kind rather than once for the whole run", hand_case = "a body whose calls run out of recorded slots while a recorded timer is still waiting to be matched" },
  { reading = "the boundary line printed at every live command instead of once", hand_case = "a body with an empty log that issues three commands" },
  { reading = "taking the earliest issued outstanding command where the rule takes the earliest answered", hand_case = "two commands issued in one order and answered in the other, with the body racing them" },
  { reading = "the leftover check counting unconsumed signals as well as commands", hand_case = "a body that finishes with one recorded signal it never waited for" },
  { reading = "the leftover check applied to a body that stopped short", hand_case = "a body that blocks on a missing answer while later recorded commands are still unmatched" },
  { reading = "a missing answer treated as the boundary rather than as a stop", hand_case = "a log that records a command with no answer and nothing after it" },
  { reading = "a name mismatch reported at the end of the body instead of where it happens", hand_case = "a body whose second call is recorded under another name and which would otherwise finish" },
  { reading = "signals delivered in log order regardless of tag", hand_case = "two signals of different tags recorded in one order and waited for in the other" },
