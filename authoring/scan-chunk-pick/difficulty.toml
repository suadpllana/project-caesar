  { reading = "a dictionary charged once per consult rather than once per chunk", hand_case = "two predicates on one column both reaching the same dictionary chunk, the second finding it already charged" },
  { reading = "the predicate order settled once at the start of the query", hand_case = "two predicates whose header estimates rank one way until the first chunk of the leader kills most of its rows" },
  { reading = "a predicate run over its whole column before the next is considered", hand_case = "a segment where the second chunk of the first predicate should be preceded by a chunk of another column" },
  { reading = "an estimate summed without the per-chunk survivor cap", hand_case = "a chunk whose header bound is the whole chunk while two survivors remain in it, which flips the choice" },
  { reading = "a decoded chunk estimated from its header instead of its exact hit count", hand_case = "a decoded chunk whose header allows every row and whose true hits are one, which flips the next choice" },
  { reading = "a decode recording hits only for the predicate it was called for", hand_case = "two predicates on one column where the first decode must settle the second predicate's count on that chunk" },
  { reading = "the highest rather than the lowest undecided chunk taken first", hand_case = "a column of three chunks where the first and third both hold survivors" },
  { reading = "a tie between two estimates broken by column index rather than query position", hand_case = "two predicates with equal estimates whose columns are numbered against their order in the query" },
  { reading = "the projection decoding every chunk of a projected column", hand_case = "a projected column with a chunk that lost all its rows to an earlier predicate" },
  { reading = "the projection decoding a chunk the predicate phase already decoded", hand_case = "a query that projects the column one of its predicates ran over" },
  { reading = "the projection worked in column index order rather than the order listed", hand_case = "a query projecting two columns with the higher index named first" },
  { reading = "state carried from one query into the next", hand_case = "two queries in one file where the second must decode a chunk the first already read" },
