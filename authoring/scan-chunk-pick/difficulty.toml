# Difficulty record for scan-chunk-pick. First written before any environment code existed;
# rewritten for the easiness recovery of 2026-09-22 (the probe solved the first design 3 of 3)
# and again for the second recovery of 2026-09-23 (2 of 3), before the page and memory code was
# written. See STATE.md for both.

[task]
slug = "scan-chunk-pick"
status = "pending"
sources = ["authoring/scan-chunk-pick/difficulty.toml", "tasks/scan-chunk-pick/STATE.md"]
expert_hours = 12
estimated_solves = 2

[plan]
first_plan = """
Take the chunk as the unit, as every scan engine does: merge its pages' headers into chunk
statistics, decide each (condition, chunk) pair from those statistics or the dictionary, read
the chunk whole when neither settles it, lay the updates over the values, keep one state per
query, and pick pairs from a heap of scores. Report by answering each reported chunk from what
was read or from its statistics, and read the rest.
"""
first_plan_source = "prior"
breaking_rule = """
A condition is applied page by page, and each page is asked only for the live rows that still
take their value from it: its own header, then a page already read, then - for a comparison on
an index page only - the chunk's dictionary, then a read of that page alone. So a chunk is read
in part, its count is exact on the pages read and a spread on the rest, the dictionary never
speaks for a page that fell back to plain values, and a verdict that every entry passes still
reads a page holding a null. The report pass answers a page from its header's sum only while
the rows it wants are every row of the page, which a delete, an update or a death anywhere in
the row's other columns takes away.
"""
second_discovery = """
The file is scanned with one memory. A page read or a dictionary consulted by any query is known
to every later query and prints only the first time, and a later query counts a remembered page
exactly from its first step - so a query's state cannot be built fresh from the segment: the
exact counts it starts from, the pages it will not pay for, the dictionaries it will not charge
and the report pages it can answer free all come from what earlier queries and earlier report
passes did. An engine whose per-query state was right for one query is wrong on the second.
"""
second_discovery_effect = "replan"
first_plan_correct = false
expert_path = [
  "Run the shipped engine on the samples and see that it merges page headers into chunk statistics, reads whole chunks, trusts the dictionary for every page of a dictionary chunk and starts every query from nothing",
  "Split what the file owns (pages read, dictionaries charged) from what a query owns (live rows, counts, pairs done), and make the driver's fresh memory the owner of the first",
  "Apply a condition page by page: updated live rows on their own values, then for the other live rows the page header, a page already read, the dictionary for a comparison on an index page, and a read of that page alone",
  "Keep each condition's count on each chunk as the sum over its pages of the exact count where the page is read and the spread where it is not, and compute the exact counts of remembered pages at the start of each query",
  "Work the report pass per page: a page already read, the header when every row is null, when the bounds are one value with no null, or when every row of the page is wanted (its non-null count and sum), a one-entry dictionary on an index page with no null, and a read otherwise",
  "Settle the carried rules: widened bounds, nulls blocking a whole-page pass, the dictionary's verdicts per page, the rounded-up inclusive spread, deleted rows never alive, a read's counts over the page as written",
  "Time the wide shape, replace any rescan loop with a heap keyed by score, condition position and chunk, re-push the pending pairs of every chunk whose live count moved or whose page was read, and trust a popped key only while it equals the current score",
]

[search]
best_page = """
The Parquet and DataFusion write-ups on predicate pushdown and zone maps, plus the papers on
late materialization in column stores, which describe skipping a row group whose min and max
rule the predicate out and decoding the filter column before the payload columns.
"""
helps_plan = false
deviation = """
Those sources order predicates once from statistics, prune row groups and pages but read what
survives in full, and keep no memory between queries; here the choice is remade after every
chunk, a chunk is read in part and counted as a mix of exact and estimated pages, a dictionary
covers only the pages written against it, the report pass takes a page's aggregate from its
header only while every row of it is wanted, and a scan session remembers what it paid for.
"""

[tactics]
A1 = """
The memorised plans are pushdown with a fixed predicate order, row-group pruning on merged
statistics, merge-on-read for a delta store and per-query scan state, and the shipped engine is
exactly those plans, working and coherent, so retrieval confirms the chunk and the query as the
units of every decision; pages and the file's memory replace both.
"""
A2 = """
No sentence names a page index, dictionary fallback, a delta store, delete vectors, aggregate
pushdown, a buffer pool, zone maps or adaptive reordering; the brief states what a header and a
dictionary can prove, what the file remembers and what a consult and a read cost, and never what
the techniques are called or how to sequence them.
"""
A3 = """
An exact consult-and-read trace and a wall-clock limit together forbid both the decode-and-merge
plan and the rescan-the-pairs plan, so no single retrieved implementation satisfies the pair.
"""
B2 = """
Which pages a query reads decides which counts are exact, which decides the order, which decides
which pages the next query finds remembered, which decides that query's counts and reads; the
overlay decides whether a page is asked at all and whether the report can take its sum; the
dictionary's page scope and its null rule decide whether a consult ends in a read. No rule can be
confirmed on its own, and a brute force written from a misreading of any of them agrees with it.
"""
C1 = """
Cases fence both sides: chunks that must be skipped unread, chunks that must pass unread, and
ordinary queries where nothing can be pruned and every chunk is decoded in a particular order;
and for the change overlay, chunks with updated rows that must still be read for the rest.
"""
C2 = """
Running the engine shows a surviving row digest that a decode-everything implementation also
produces, so the natural self-check confirms a plan whose decode events are already wrong.
"""
C3 = """
The wide shape, about two thousand chunks per column in pages of four to twelve rows, three
queries of eight conditions, makes the rescan-every-pair loop infeasible while it stays exactly
correct (142.5 s for one file against 2.1 s for the reference and 60 s for the whole graded set).
"""
C4 = """
Every printed event and digest of every query must match, over hand-written segments aimed at
each rule and a large generated population drawn from a seed the submission never saw.
"""
guard = """
Six files under /app/scn are collected; the parser, the chunk reader, the driver and the trace
writer are replaced from a pristine copy before any segment runs, and a seventh file placed
beside them is never collected, so the engine cannot be restructured around the driver.
"""

[decisions]
graded = 31
interactions = [
  { a = "the predicate chosen next", b = "the exact hit counts of decoded chunks", why = "the choice reads the counts, and which chunks are decoded is decided by the choice, so the two determine each other step by step" },
  { a = "the survivor cap in an estimate", b = "the rows a chunk decision kills", why = "each decision changes the survivor counts that every later estimate is capped by, so the order after a chunk depends on what that chunk removed" },
  { a = "a decode evaluating every predicate of its column", b = "the estimate of the other predicates on that column", why = "if a decode records only the predicate it was called for, the others keep header estimates and the engine picks a different chunk next" },
  { a = "dictionary completeness", b = "the single charge per chunk dictionary", why = "an incomplete dictionary is never consulted, so whether a later predicate finds the dictionary already charged depends on which predicate reached the chunk first" },
  { a = "chunks decoded during the predicate phase", b = "the projection pass", why = "the projection decodes only what is left undecoded, so its events are a function of the order the predicate phase happened to take" },
  { a = "the widened bounds of an inexact header", b = "whether a dictionary is consulted at all", why = "widening stops the header from deciding a chunk, which sends that chunk to the dictionary and changes the event trace" },
  { a = "rows that carry an update", b = "whether a chunk is consulted or read", why = "a chunk is asked only for live rows it still supplies, so an update, or another condition killing the last row the chunk supplied, removes a read and the exact counts it would have settled" },
  { a = "a read raising a score", b = "the incremental structure the loop needs to fit the limit", why = "the fast loop has to accept a key that rises as well as one that falls, or it takes a stale pair several reads before the divergence shows" },
  { a = "what the condition phase read", b = "how the report pass supplies each chunk", why = "a chunk already read costs nothing, otherwise the header, then a one-entry dictionary, then a read, so the report's events depend on every earlier choice" },
  { a = "pages read by one query", b = "the next query's starting counts and reads", why = "remembered pages count exactly from the start and are never paid for again, so the second query's order depends on everything the first one read, including in its report pass" },
  { a = "a partial read of a chunk", b = "the chunk's count and every later score on it", why = "the count becomes exact on the pages read and a spread on the rest, so the next choice depends on which pages the last pair happened to need" },
  { a = "deaths, deletes and updates on a page", b = "whether the report can answer the page from its sum", why = "the sum answers only while every row of the page is wanted, so a death caused by another column's condition turns a free answer into a read" },
]
per_decision_feedback = false

[fences]
ordinary_case = """
A query whose predicates rule nothing out over a segment with exact headers and no dictionaries,
where every chunk must be decoded and only the interleaving of the columns distinguishes plans.
"""
late_case = """
A segment whose first chunks are decided by their headers so an early prefix of the trace agrees,
and whose later chunks carry inexact bounds and incomplete dictionaries that a wrong reading
skips, so the divergence appears only after many correct events and changes every event after it.
"""
oracle_denied = """
The only thing an implementation can check against itself is the surviving row digest, and a
plan that decodes every chunk and filters produces exactly that digest while its decode events,
which are the graded part, are wrong from the first step.
"""

