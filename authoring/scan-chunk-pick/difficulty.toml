  { reading = "recorded bounds treated as exact when the flag says otherwise", hand_case = "a chunk whose recorded max is below the predicate value but whose widened high bound is above it, holding one matching row" },
  { reading = "a chunk passed unread on bounds alone while it holds nulls", hand_case = "a chunk whose whole range satisfies the predicate and that carries two nulls, which must be decoded and lose them" },
