# Difficulty record for scan-chunk-pick. First written before any environment code existed;
# rewritten for the easiness recovery of 2026-09-22 (the probe solved the first design 3 of 3)
# and again for the second recovery of 2026-09-23 (2 of 3), before the page and memory code was
# written, and a third time the same day, after three local agents solved the page design 3 of 3,
# before the chunk-sum and known-facts code was written. See STATE.md for all three.

[task]
slug = "scan-chunk-pick"
status = "pending"
sources = ["authoring/scan-chunk-pick/difficulty.toml", "tasks/scan-chunk-pick/STATE.md"]
expert_hours = 12
estimated_solves = 2

[plan]
first_plan = """
Settle one condition at a time: put each (condition, chunk) pair to its pages' headers, a page
already read or the chunk's dictionary, read what they cannot settle, and let what that pair
learned settle that pair's condition; keep the file's memory across queries and pick pairs from
a heap of scores. Report each reported page on its own: a page read, a page of one value or all
nulls, a one-entry dictionary, and a read otherwise - and since pages carry no sum, read every
page whose rows are all wanted.
"""
first_plan_source = "prior"
breaking_rule = """
What is known acts at once, on every condition. A header, an updated value, a remembered page or
a consulted dictionary kills every row it fails before any pair is applied; a read settles every
condition over its column on that page; a consult settles every index page of its chunk for
every comparison, killing rows in pages no pair has reached. So a pair is pending only while a
live row it supplies is still unsettled for its condition, and many reads the per-condition plan
makes are never paid for, which moves the live counts every later choice is scored on.
"""
second_discovery = """
The report reads a page only when the line could not be worked out without it even if every
other page it could read were read. The chunk carries the sum its pages carry no longer, so the
pages of a chunk whose rows are all live are told together by the chunk's sum less the sums of
its other pages - unless another page has no live row and a sum nobody knows, which can never be
read and so forces every wholly live page to be read instead. Whether a dead page's sum is known
is decided by the filter (killed by its header it stays unknown, read before its rows died it
does not), by the file's memory, by a one-value page's null count not mattering to its sum, and
by a one-entry dictionary, which the report consults only when knowing it spares a read. The
per-page report is replaced by a per-chunk decision that reads the filter's history.
"""
second_discovery_effect = "replan"
first_plan_correct = false
expert_path = [
  "Run the shipped engine on the samples and see that it merges page headers into chunk statistics, reads whole chunks, trusts the dictionary for every page of a dictionary chunk, starts every query from nothing and reads every reported chunk",
  "Split what the file owns (pages read, dictionaries consulted) from what a query owns (live rows, counts, pairs done, pages still open per condition)",
  "At a query's start put every condition to everything already known - updated values, page headers, remembered pages, consulted dictionaries - and kill the rows any of them fail; keep per condition the pages it is still open on",
  "Apply a pair to its open pages that still supply a live row, in order: the dictionary first for a comparison on an index page not yet consulted, then a read; after each consult or read, put what was learned to every condition over the column at once",
  "Keep each condition's count on each chunk as the sum over its pages of the exact count where the page is read and the spread where it is not, including remembered pages from the start",
  "Work the report per chunk: partly live pages need their values; wholly live pages need only their sum, which the chunk's sum gives together unless a dead page has an unknown sum; count a one-value page's sum as known whatever its nulls; consult a one-entry dictionary only when that leaves fewer reads; read in page order",
  "Settle the carried rules: widened bounds, nulls blocking a whole-page pass, the dictionary's verdicts per page, the rounded-up inclusive spread, deleted rows never alive, a read's counts over the page as written",
  "Time the wide shape, replace any rescan loop with a heap keyed by score, condition position and chunk, re-push the pairs of every chunk whose live count moved or whose page was read, and trust a popped key only while it equals the current score",
]

[search]
best_page = """
The Parquet and DataFusion write-ups on predicate pushdown and zone maps, plus the papers on
late materialization in column stores, which describe skipping a row group whose min and max
rule the predicate out and decoding the filter column before the payload columns.
"""
helps_plan = false
deviation = """
Those sources order predicates once from statistics, apply one predicate at a time over what
survives, prune row groups and pages but read what survives in full, answer an aggregate from
statistics only for a row group that qualifies whole, and keep no memory between queries. Here
every fact already known kills at once on every condition, the choice is remade after every
chunk, a chunk is read in part, a dictionary covers only the pages written against it, the
report takes the sum of several wholly live pages from their chunk's sum less the pages it
knows, and a page it can never read decides whether that works.
"""

[tactics]
A1 = """
The memorised plans are pushdown with a fixed predicate order, row-group pruning on merged
statistics, merge-on-read for a delta store and per-query scan state, and the shipped engine is
exactly those plans, working and coherent, so retrieval confirms the chunk and the query as the
units of every decision; pages and the file's memory replace both.
"""
A2 = """
No sentence names a page index, dictionary fallback, a delta store, delete vectors, aggregate
pushdown, constraint propagation, a buffer pool, zone maps or adaptive reordering; the brief
states what is known, when a row dies, when a report read is owed and what the file remembers,
and never what the techniques are called or how the report's reads are to be found.
"""
A3 = """
An exact consult-and-read trace and a wall-clock limit together forbid both the decode-and-merge
plan and the rescan-the-pairs plan, so no single retrieved implementation satisfies the pair.
"""
B2 = """
Which pages a query reads decides which counts are exact and which rows die at once on every
condition, which decides the order, which decides which pages the next query finds remembered;
how a page's rows died - by a header or after a read - decides whether the report knows its sum,
and a dead page with an unknown sum decides whether the chunk's sum can answer every wholly live
page; a one-entry dictionary consulted in the filter, or in the report because it spares a read,
gives page sums that unblock another page. No rule can be confirmed on its own, and a brute force
written from a misreading of any of them agrees with it.
"""
C1 = """
Cases fence both sides: chunks that must be skipped unread, chunks that must pass unread, and
ordinary queries where nothing can be pruned and every chunk is decoded in a particular order;
and for the change overlay, chunks with updated rows that must still be read for the rest.
"""
C2 = """
Running the engine shows a surviving row digest that a decode-everything implementation also
produces, so the natural self-check confirms a plan whose decode events are already wrong.
"""
C3 = """
The wide shape, about two thousand chunks per column in pages of four to twelve rows, three
queries of eight conditions, makes the rescan-every-pair loop infeasible while it stays exactly
correct (139.6 s for one file against 1.6 s for the reference and 60 s for the whole graded set).
"""
C4 = """
Every printed event and digest of every query must match, over hand-written segments aimed at
each rule and a large generated population drawn from a seed the submission never saw.
"""
guard = """
Six files under /app/scn are collected; the parser, the chunk reader, the driver and the trace
writer are replaced from a pristine copy before any segment runs, and a seventh file placed
beside them is never collected, so the engine cannot be restructured around the driver.
"""

[decisions]
graded = 31
interactions = [
  { a = "the predicate chosen next", b = "the exact hit counts of decoded chunks", why = "the choice reads the counts, and which chunks are decoded is decided by the choice, so the two determine each other step by step" },
  { a = "the survivor cap in an estimate", b = "the rows a chunk decision kills", why = "each decision changes the survivor counts that every later estimate is capped by, so the order after a chunk depends on what that chunk removed" },
  { a = "a decode evaluating every predicate of its column", b = "the estimate of the other predicates on that column", why = "if a decode records only the predicate it was called for, the others keep header estimates and the engine picks a different chunk next" },
  { a = "dictionary completeness", b = "the single charge per chunk dictionary", why = "an incomplete dictionary is never consulted, so whether a later predicate finds the dictionary already charged depends on which predicate reached the chunk first" },
  { a = "chunks decoded during the predicate phase", b = "the projection pass", why = "the projection decodes only what is left undecoded, so its events are a function of the order the predicate phase happened to take" },
  { a = "the widened bounds of an inexact header", b = "whether a dictionary is consulted at all", why = "widening stops the header from deciding a chunk, which sends that chunk to the dictionary and changes the event trace" },
  { a = "rows that carry an update", b = "whether a chunk is consulted or read", why = "a chunk is asked only for live rows it still supplies, so an update, or another condition killing the last row the chunk supplied, removes a read and the exact counts it would have settled" },
  { a = "a read raising a score", b = "the incremental structure the loop needs to fit the limit", why = "the fast loop has to accept a key that rises as well as one that falls, or it takes a stale pair several reads before the divergence shows" },
  { a = "what the condition phase read", b = "how the report pass supplies each chunk", why = "a chunk already read costs nothing, otherwise the header, then a one-entry dictionary, then a read, so the report's events depend on every earlier choice" },
  { a = "pages read by one query", b = "the next query's starting counts and reads", why = "remembered pages count exactly from the start and are never paid for again, so the second query's order depends on everything the first one read, including in its report pass" },
  { a = "a partial read of a chunk", b = "the chunk's count and every later score on it", why = "the count becomes exact on the pages read and a spread on the rest, so the next choice depends on which pages the last pair happened to need" },
  { a = "deaths, deletes and updates on a page", b = "whether the report can answer the page from its chunk's sum", why = "a page's sum answers only while every row of the page is wanted, so a death caused by another column's condition turns a free answer into a read" },
  { a = "a fact learned for one condition", b = "rows of other conditions and other pages", why = "what is known acts at once on every condition, so a read or a consult made for one pair kills rows another pair would have paid to settle" },
  { a = "how a page's rows died in the filter", b = "whether the report knows its sum", why = "a page killed by its header was never read and its sum stays unknown, which blocks the chunk's sum for every wholly live page beside it" },
  { a = "a one-entry dictionary consulted in the report", b = "the sums of dead index pages", why = "knowing the entry gives the sum of every index page of the chunk, which can unblock the chunk's sum, so the consult is made exactly when that spares a read" },
]
per_decision_feedback = false

[fences]
ordinary_case = """
A query whose predicates rule nothing out over a segment with exact headers and no dictionaries,
where every chunk must be decoded and only the interleaving of the columns distinguishes plans.
"""
late_case = """
A segment whose first chunks are decided by their headers so an early prefix of the trace agrees,
and whose later chunks carry inexact bounds and incomplete dictionaries that a wrong reading
skips, so the divergence appears only after many correct events and changes every event after it.
"""
oracle_denied = """
The only thing an implementation can check against itself is the surviving row digest, and a
plan that decodes every chunk and filters produces exactly that digest while its decode events,
which are the graded part, are wrong from the first step.
"""

[leaks]
candidates = [
  { what = "the recorded min, max and null count in every chunk header", closed_by = "these are primitives of the stored format and the values themselves ship in the payload, while the derivation the task grades, which chunk is decided next and whether it is read, appears nowhere in the tree" },
  { what = "an expected trace shipped beside the sample segments", closed_by = "no expected output, checksum or per-chunk annotation ships anywhere in the agent tree; the sample segments are inputs only" },
  { what = "a helper that widens a header bound or tests dictionary completeness, sitting unused", closed_by = "the shipped engine calls every function it defines and defines no function the wrong policy does not need, so no affordance points at a rule the agent has to infer" },
  { what = "the exact hit counts the estimate needs, stored in the file as a per-chunk per-value count", closed_by = "the file stores values and a header, never counts against a predicate, so an estimate can only come from reading a header or from having decoded the chunk" },
  { what = "a shipped validator that reports which chunks a query should have read", closed_by = "the driver prints the trace and nothing judges it; there is no checker, no verbose mode and no counter beyond the printed events" },
  { what = "the parsed update map sitting beside the chunk", closed_by = "the parser stores the updates per column keyed by row as the file states them; which chunk a row belongs to, and whether any live row still needs the chunk, is derived nowhere" },
  { what = "a helper that says whether a header fixes a chunk's values", closed_by = "the shipped tree has no such function; the shipped report pass reads every chunk and nothing in the tree mentions a pinned value" },
]
derived_quantities = """
The stored primitives are values, null counts, recorded bounds, an exactness flag and dictionary
entries; no decode order, hit count, estimate or survivor count is stored anywhere in the tree.
"""
oracle_shipped = false

[gate]
present = true
naive_family = """
The loop the brief describes, transcribed: rescan every pending pair after every step for the
smallest score. Measured on the wide shape: 139.6 seconds for one file against 1.6 for the
reference, printing the identical trace.
"""
invariant = """
A pair's score changes only when its chunk's live-row count moves or one of the chunk's pages is
read, and the step that changed it knows which chunks those were, so only their pending pairs
need scoring again; since a score can rise as well as fall, a stored score is valid only while it
equals the current one.
"""
input_scale = """
Three wide files of sixty thousand rows over five columns in chunks of sixteen to forty rows and
pages of four to twelve, three queries of eight conditions, and three deep files of forty
thousand rows in chunks of about two thousand with seven; both shapes, the counts and the limit
are stated in the brief.
"""
limit_seconds = 60
measured = true
why_not = ""

