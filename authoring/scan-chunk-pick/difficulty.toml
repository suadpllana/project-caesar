[task]
slug = "scan-chunk-pick"
status = "pending"
sources = ["authoring/scan-chunk-pick/difficulty.toml", "tasks/scan-chunk-pick/STATE.md"]
expert_hours = 10
estimated_solves = 3

[plan]
first_plan = """
Parse the segment. For each condition and chunk, test the header's bounds and null count, use a
dictionary where the chunk has one, read the chunk otherwise, and filter; merge the updates into
the chunk's values when it is read, and start the survivors without the deleted rows. Loop over
the pending pairs, rescanning them after every step for the smallest score, as the brief says.
Report by reading every chunk of a reported column that still holds a survivor.
"""
first_plan_source = "prior"
breaking_rule = """
Nothing is consulted or read while something cheaper already answers, and a chunk is consulted
or read only for a live row that still takes its value in that column from it. A header or
dictionary verdict therefore settles only the rows the chunk still supplies, a condition whose
remaining live rows all carry updates consults and reads nothing, and the report pass does not
read a chunk whose survivors all carry updates, whose header fixes every value, or whose
one-entry dictionary with no nulls can supply the value for its charge.
"""
second_discovery = """
The rescan loop is exactly correct and does not fit: on the wide shape it takes 506 seconds for
one file against 1.3 for the reference and 60 for the whole graded set. The loop has to become an
incremental priority structure, and a score moves both ways - it falls when rows die in any
column whose partition overlaps the chunk and rises when a read replaces a low interpolation
with a higher exact count - so a structure that only lowers keys, or trusts a key pushed before
the read, takes the wrong pair and the trace diverges several reads later.
"""
second_discovery_effect = "replan"
first_plan_correct = false
expert_path = [
  "Run the shipped engine on the sample segments and see that it merges updates into a chunk when it reads it and lets a header verdict take every row of the chunk",
  "Work the cost rule through the filter step: split a chunk's live rows into those that carry an update in the column and those the chunk still supplies, test the first on their own values, and put only the second to the header, a read already made, the dictionary and a read, so a chunk with none of the second is never consulted",
  "Work the same rule through the report pass: a chunk is wanted only for survivors it supplies, and a wanted chunk is served by a read already made, then by a header that fixes every value (all null, or no nulls and one value after widening), then by a one-entry dictionary with no nulls for its charge, then by a read",
  "Start the survivors without the deleted rows and cap every score by the live rows only; count a read's exact hits over the chunk as written",
  "Settle the carried rules on both sides: widened bounds, a null blocking a whole-chunk pass, dictionary completeness and one charge per chunk, the rounded-up inclusive interpolation, a read settling every condition over its column",
  "Time the wide shape, find the rescan loop is two orders of magnitude over the limit, and replace it with a heap keyed by score, condition position and chunk, re-pushing every pending pair of each chunk whose survivor count moved or that was read",
  "Validate a popped entry against the pair's current score, because a read can raise a score and a stale lower entry would otherwise be taken first",
]

[search]
best_page = """
The Parquet and DataFusion write-ups on predicate pushdown and zone maps, plus the papers on
late materialization in column stores, which describe skipping a row group whose min and max
rule the predicate out and decoding the filter column before the payload columns.
"""
helps_plan = false
deviation = """
Those sources order predicates once from statistics and merge a delta store into the data as it
is read; here the choice is remade after every chunk, a chunk is consulted only for rows it still
supplies, statistics describe the chunk as written while the answer uses the current values, and
the report pass takes values from headers and one-entry dictionaries before it reads.
"""

[tactics]
A1 = """
The memorised plans are pushdown with a fixed predicate order and merge-on-read for a delta
store, and the shipped engine is exactly those plans, working and coherent, so retrieval confirms
a policy in which the chunk is the unit of every decision, which the cost rule replaces.
"""
A2 = """
No sentence names a delta store, delete vectors, late materialization, zone maps, adaptive
reordering or dictionary pruning; the brief states what a header and a dictionary can prove and
what a consult and a read cost, and never what the techniques are called or how to sequence them.
"""
A3 = """
An exact consult-and-read trace and a wall-clock limit together forbid both the decode-and-merge
plan and the rescan-the-pairs plan, so no single retrieved implementation satisfies the pair.
"""
B2 = """
The update overlay decides whether a chunk is asked at all, which decides whether a read happens,
which decides which exact counts exist, which decide the order, which decides what the report
pass still has to supply; header widening, null blocking, dictionary completeness and charging
and the survivor cap all feed the same chain, so no rule can be confirmed on its own.
"""
C1 = """
Cases fence both sides: chunks that must be skipped unread, chunks that must pass unread, and
ordinary queries where nothing can be pruned and every chunk is decoded in a particular order;
and for the change overlay, chunks with updated rows that must still be read for the rest.
"""
C2 = """
Running the engine shows a surviving row digest that a decode-everything implementation also
produces, so the natural self-check confirms a plan whose decode events are already wrong.
"""
C3 = """
The wide shape, about three and a half thousand chunks per column and eight conditions, makes the
rescan-every-pair loop infeasible while it stays exactly correct (506 s for one file, about 100
with the estimates cached, against 1.3 s for the reference and 60 s for the whole graded set).
"""
C4 = """
Every printed event and digest of every query must match, over hand-written segments aimed at
each rule and a large generated population drawn from a seed the submission never saw.
"""
guard = """
Six files under /app/scn are collected; the parser, the chunk reader, the driver and the trace
writer are replaced from a pristine copy before any segment runs, and a seventh file placed
beside them is never collected, so the engine cannot be restructured around the driver.
"""

[decisions]
graded = 25
interactions = [
  { a = "the predicate chosen next", b = "the exact hit counts of decoded chunks", why = "the choice reads the counts, and which chunks are decoded is decided by the choice, so the two determine each other step by step" },
  { a = "the survivor cap in an estimate", b = "the rows a chunk decision kills", why = "each decision changes the survivor counts that every later estimate is capped by, so the order after a chunk depends on what that chunk removed" },
  { a = "a decode evaluating every predicate of its column", b = "the estimate of the other predicates on that column", why = "if a decode records only the predicate it was called for, the others keep header estimates and the engine picks a different chunk next" },
  { a = "dictionary completeness", b = "the single charge per chunk dictionary", why = "an incomplete dictionary is never consulted, so whether a later predicate finds the dictionary already charged depends on which predicate reached the chunk first" },
  { a = "chunks decoded during the predicate phase", b = "the projection pass", why = "the projection decodes only what is left undecoded, so its events are a function of the order the predicate phase happened to take" },
  { a = "the widened bounds of an inexact header", b = "whether a dictionary is consulted at all", why = "widening stops the header from deciding a chunk, which sends that chunk to the dictionary and changes the event trace" },
  { a = "rows that carry an update", b = "whether a chunk is consulted or read", why = "a chunk is asked only for live rows it still supplies, so an update, or another condition killing the last row the chunk supplied, removes a read and the exact counts it would have settled" },
  { a = "a read raising a score", b = "the incremental structure the loop needs to fit the limit", why = "the fast loop has to accept a key that rises as well as one that falls, or it takes a stale pair several reads before the divergence shows" },
  { a = "what the condition phase read", b = "how the report pass supplies each chunk", why = "a chunk already read costs nothing, otherwise the header, then a one-entry dictionary, then a read, so the report's events depend on every earlier choice" },
]
per_decision_feedback = false

[fences]
ordinary_case = """
A query whose predicates rule nothing out over a segment with exact headers and no dictionaries,
where every chunk must be decoded and only the interleaving of the columns distinguishes plans.
"""
late_case = """
A segment whose first chunks are decided by their headers so an early prefix of the trace agrees,
and whose later chunks carry inexact bounds and incomplete dictionaries that a wrong reading
skips, so the divergence appears only after many correct events and changes every event after it.
"""
oracle_denied = """
The only thing an implementation can check against itself is the surviving row digest, and a
plan that decodes every chunk and filters produces exactly that digest while its decode events,
which are the graded part, are wrong from the first step.
"""

[leaks]
candidates = [
  { what = "the recorded min, max and null count in every chunk header", closed_by = "these are primitives of the stored format and the values themselves ship in the payload, while the derivation the task grades, which chunk is decided next and whether it is read, appears nowhere in the tree" },
  { what = "an expected trace shipped beside the sample segments", closed_by = "no expected output, checksum or per-chunk annotation ships anywhere in the agent tree; the sample segments are inputs only" },
  { what = "a helper that widens a header bound or tests dictionary completeness, sitting unused", closed_by = "the shipped engine calls every function it defines and defines no function the wrong policy does not need, so no affordance points at a rule the agent has to infer" },
  { what = "the exact hit counts the estimate needs, stored in the file as a per-chunk per-value count", closed_by = "the file stores values and a header, never counts against a predicate, so an estimate can only come from reading a header or from having decoded the chunk" },
  { what = "a shipped validator that reports which chunks a query should have read", closed_by = "the driver prints the trace and nothing judges it; there is no checker, no verbose mode and no counter beyond the printed events" },
  { what = "the parsed update map sitting beside the chunk", closed_by = "the parser stores the updates per column keyed by row as the file states them; which chunk a row belongs to, and whether any live row still needs the chunk, is derived nowhere" },
  { what = "a helper that says whether a header fixes a chunk's values", closed_by = "the shipped tree has no such function; the shipped report pass reads every chunk and nothing in the tree mentions a pinned value" },
]
derived_quantities = """
The stored primitives are values, null counts, recorded bounds, an exactness flag and dictionary
entries; no decode order, hit count, estimate or survivor count is stored anywhere in the tree.
"""
oracle_shipped = false

[gate]
present = true
naive_family = """
The loop the brief describes, transcribed: rescan every pending pair after every step for the
smallest score. Measured on the wide shape: 506 seconds for one file with the reference's own
estimate function, about 100 with every header estimate cached in a list, against 1.3 for the
reference, printing the identical trace.
"""
invariant = """
A pair's score changes only when its chunk's live-row count moves or its chunk is read, and the
step that changed it knows which chunks those were, so only their pending pairs need scoring
again; since a score can rise as well as fall, a stored score is valid only while it equals the
current one.
"""
input_scale = """
Three wide files of sixty thousand rows over five columns in chunks of ten to thirty-three rows
with eight conditions to a query, and three deep files of forty thousand rows in chunks of about
two thousand with seven; both shapes, the counts and the limit are stated in the brief.
"""
limit_seconds = 60
measured = true
why_not = ""

[cheats]
