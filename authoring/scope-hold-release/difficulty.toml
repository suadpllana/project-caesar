# themselves carry no header comments.
wrong_readings = [
  { reading = "capture-at-invocation: a factory invocation is charged to the active invocation scope instead of the scope stored with the token", hand_case = "held-across-one-scope" },
  { reading = "capture-innermost-live: the factory is charged to the innermost still-live scope (from the file name)", hand_case = "held-across-one-scope" },
  { reading = "chain-under-singleton-ignored: dependencies pulled in under a singleton keep their own ownership instead of the root", hand_case = "chain-under-a-singleton-goes-to-root" },
  { reading = "completion-order: teardown ordered by completion instead of allocation order", hand_case = "scoped-reentry-in-one-scope" },
  { reading = "cycle-blind: cycle detection does not keep going below the requested name", hand_case = "a-cycle-is-refused" },
  { reading = "inherit-marked-home: a marked instance's dependencies inherit its marked owner instead of keeping their own ownership rules", hand_case = "wrapped-and-marked-rollback-keeps-all-three-orders" },
