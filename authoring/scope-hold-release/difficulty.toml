  { reading = "mark-not-required: a marked registration with no matching scope in reach is built instead of refused", hand_case = "a-pinned-name-with-no-mark-in-reach-is-refused" },
  { reading = "mark-taken-from-the-outermost: the outermost matching mark wins instead of the nearest", hand_case = "the-nearest-mark-wins-over-an-outer-one" },
