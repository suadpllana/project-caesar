  { reading = "refusal-direct-only: singleton refusal checks direct dependencies only, not the whole chain", hand_case = "refusal-follows-the-whole-chain" },
  { reading = "rollback-clears-old-cache: cache over-clearing, rollback removes entries from before the attempt", hand_case = "a-borrowed-singleton-survives-a-failed-request" },
