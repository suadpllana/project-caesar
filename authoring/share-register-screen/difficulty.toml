  { reading = "every holder stands alone at the meeting", hand_case = "short by a seat where two holders on the list would have carried one between them" },
  { reading = "the hand is only the parties the programme named", hand_case = "the list stops one step out when a taken company would join the hand" },
  { reading = "a company that falls short is settled and not asked again", hand_case = "the hand grows every time the list grows, so a company carries on the next pass" },
  { reading = "the hand collapsed on the recorded holder rather than the caster", hand_case = "a nominee on the list holding for an outsider, and an outsider holding for the list" },
  { reading = "a company's own stock in somebody else's name votes at its own meeting", hand_case = "the plain half of the treasury rule looks handled while the nominee half is not" },
  { reading = "half the directors is taken as enough", hand_case = "an even board where the list takes exactly half" },
  { reading = "more than half the votes is taken as the test", hand_case = "a register where votes and seats disagree under running averages" },
  { reading = "seats the list took counted by looking for members among the takers", hand_case = "after the collapse no member holds a seat under its own name" },
]
