# Rewritten on 2026-09-23 for easiness recovery 1 (STATE.md): the delivered design was solved 3 of
# 3 by a literal stepper with generic repeat detection. The record below is the rebuilt design.

[plan]
first_plan = "Read the brief as a cycle-stepped simulator, implement every rule literally - including a sum as one line per issue through the cache - and, when the large launches crawl, reach for the classic speed-ups: while every ready block on a multiprocessor spins, detect that its state repeats and jump to the next wake, and advance every stream in bulk between device-wide events, reading the lines from memory as it stands."
first_plan_source = "prior"
breaking_rule = "A sum reads one line per issue through its multiprocessor's cache, so a running sum never repeats a state, and the persistent kind keeps streams running on most multiprocessors for up to 16 million cycles while the rest issue an instruction every few cycles: stepping every line and bulk-advancing only across device-wide quiet stretches are both correct and both far outside the stated limit."
second_discovery = "Carrying each multiprocessor forward on its own is exact only with an observation rule the brief implies but never states: a store reaches a carried stream only if it lands before the stream's issue on that line, cycle first and multiprocessor number second, and only through memory, since a copy cached there hides it; a store to a line already read changes nothing read; and which cached lines survive a stream's fills is first-in-first-out arithmetic that decides stale hits on prefetched lines and releases stale waiters at exact fills. The first fast plan rests on memory being static between events, and that is what has to be taken apart."
second_discovery_effect = "replan"
first_plan_correct = false
expert_path = [
  "Run the sample launches, time the three large ones, and read the engine end to end: parser, dispatcher, issue rotation, memory, clock and hang check",
  "Replace the memory with a line cache per multiprocessor that outlives its blocks: fills with the oldest line dropped, bypassing loads that drop their line, stores that update only the storer's copy, atomics that touch no copy and fences that empty their own",
  "Fix placement to the multiprocessor with the most free slots, ties to the lower number, with a slot free the cycle after its block exits, and the rotation to slot order after the last issuer with spinners and summing blocks taking their turns",
  "Implement sums literally, one line per issue read the way the matching load reads it, and settle hangs: a summing block is not spinning, a frozen all-spinning stretch hangs from its first cycle, an unfrozen one is stepped until it succeeds or repeats",
  "Profile the persistent launch, see that no state repeats and that the device is never quiet, and give each multiprocessor its own stretch of regular issues, carried forward by arithmetic: turns per block, range sums of memory, the cache as surviving old lines plus the last fills",
  "Derive what can end a stretch from outside - a store to a line one of its sums reads from memory, or to a bypassing spinner's line, applied after the stretch is carried up to it in cycle and multiprocessor order - and what ends it from inside: a cached line reached before the fills push it out, a waiter's line evicted or dropped, a sum's last line",
  "Diff the fast clock against a plain stepper on hundreds of small generated launches and on the persistent pattern shrunk until the stepper can run it, then time the whole graded set",
]

[search]
best_page = "Chandy and Misra, distributed simulation (1979), and Bryant's conservative null-message method, with Alglave et al. ASPLOS 2015 on stale reads through GPU first-level caches"
helps_plan = false
deviation = "conservative parallel simulation says to advance components independently up to the next event they could receive, but gives no rule for which writes a component can observe; here that rule has to be derived from a non-coherent cache - a write is invisible behind a cached copy and irrelevant to lines already read - and the GPU papers give no placement, rotation, capacity, replacement, spin or sum rule and compute nothing about a given launch"

[tactics]
A1 = "The priors are a coherent machine, a reduction as one read of memory, and a device whose memory is static between events; each is the shape a first plan takes and each is wrong here - stale lines outlive their blocks, a sum is a stream of loads, and stores land in streams mid-flight."
A2 = "The brief never says coherence, staleness, livelock, lookahead or which stores a stream can see; it states what one issue does to which cache and in what order issues happen, and the observation rule and the fill arithmetic have to be derived."
B2 = "Placement, rotation, fill order, bypass drops, store updates, atomic bypass, fences, spin attempts, sums, work and exit timing land in one trace, and each changes another: a neighbour's sum evicts a waiter's stale flag at an exact fill, a prefetched line survives or not by the neighbours' fill rate, a store is seen or not by one cycle and multiprocessor order."
C1 = "Ordinary launches with no sharing must still come out cycle-exact, and small reduce launches grade every sum rule, so answering loads or sums from memory, never skipping or bulk-advancing without the observation rule all fail somewhere."
C2 = "No expected output ships and the only runner is the model under repair; a stepper written from the brief can check small launches but cannot run the persistent kind, which is where a wrong observation rule shows."
C3 = "Measured on the persistent kind: stepping every sum line takes 306 seconds on one launch and over 450 on another, advancing streams in bulk only while the device is quiet takes 231 and over 450, and the reference runs the whole 411-launch graded set in 15 seconds at one CPU in the verifier image."
C4 = "Exact, all-or-nothing on per-block placement, cycles and printed values, hang cycles and final memory over 42 hand launches and 369 generated from a seed drawn after the agent is gone, shaped so each cache, spin and sum rule changes the output."
guard = "Only the six model files under /app/sim are collected; the parser, reporter and runner are replaced by the verifier's pristine copies and their interfaces are frozen, so the output cannot be produced any other way."

[decisions]
graded = 16
interactions = [
  { a = "caches last for the whole launch per multiprocessor", b = "placement on the multiprocessor with the most free slots", why = "which stale copy a block reads depends on where the dispatcher put the blocks before it, so placement changes values, not only cycles" },
  { a = "a full cache drops the line filled longest ago", b = "a spin attempt is a load", why = "a spinner is released when a neighbour's fill pushes its stale line out, so capacity decides whether a spin succeeds" },
  { a = "a sum reads one line per issue through the cache", b = "a full cache drops the line filled longest ago", why = "a neighbour's sum evicts a waiter's stale flag at an exact fill, and a prefetched stale line survives to be read only where no neighbour streams" },
  { a = "a store is seen in cycle and multiprocessor order", b = "a sum reads its lines one issue at a time", why = "a store lands in a sum only before the sum reaches its line, so the total depends on one cycle and on which multiprocessor issued first" },
  { a = "a bypassing sum drops its line from its own cache", b = "a spin attempt is a load", why = "a stale waiter is let go when a neighbour's bypassing sum passes over its line, with no store anywhere" },
  { a = "a block at a sum is not at a spin", b = "the hang definition", why = "a launch cannot hang while any block is summing, so a hang is dated from the end of the last sum, not from when the others started spinning" },
  { a = "atomics touch no cache", b = "stores update only the storer's cached copy", why = "a counter bumped by atomics reads stale on the multiprocessor that bumped it while a stored word is fresh there and stale everywhere else" },
]
per_decision_feedback = false

[fences]
ordinary_case = "Launches with no shared lines, no spinning and grids that fit the device must come out cycle-exact, and small tiles summed once must add exactly the words the matching loads would read, so a model that answers sums from memory or bulk-reads them at one issue fails ordinary cases."
late_case = "In the persistent kind over a thousand stores per launch land in a tile while it is being summed; a carried stream that reads memory when it is settled, or that sees a same-cycle store from a higher multiprocessor, gets a total wrong millions of cycles into the launch."
oracle_denied = "The agent can only run the model it is repairing and nothing ships the expected lines; a stepper written from the brief can diff small launches but cannot run the persistent kind, so the observation rule it depends on has to be derived, not tested into shape."

[leaks]
candidates = [
  { what = "sample launch files under /app/launches", closed_by = "they carry only device shape, initial words and programs; no expected output, placement or cycle ships beside them, and the persistent and reduce samples show the patterns to time, not how to simulate them" },
  { what = "the worked example in the brief", closed_by = "found by search, not chosen: it decides only conventions the brief states outright - a placed block issues in the placing cycle, a slot is free the cycle after its exit, the loaded value is on the left of a comparison - and the constant, positional and replay strategies" },
  { what = "names in the shipped engine", closed_by = "legacy-register names that say what a structure is, never how it should behave; the shipped sum is one call to a memory range helper, the reduction prior, and no helper exists that only the correct rules would call" },
  { what = "the engine's own trace output", closed_by = "it prints only what the graded format prints, with no per-cycle log that would show a fill, a drop or a carried stretch" },
]
derived_quantities = "launch files ship primitives only - device shape, initial memory, the program - and nothing records where a block will land, which lines a cache holds, which stores a sum saw or when anything ends"
oracle_shipped = false

[gate]
present = true
naive_family = "a stepper that issues every line of every sum (the delivered plan, with spinners still skipped), and an engine that advances every stream in bulk but only while no multiprocessor issues anything else"
invariant = "a multiprocessor whose ready blocks all sit at sums and spins changes only by fills and rotation until one of its own blocks joins, a sum reaches a line it would hit or ends, a waiter's line is evicted, or a store lands in a line it reads from memory or a bypassing spinner watches - stores anywhere else, and to lines already read, cannot reach it"
input_scale = "persistent launches of up to 96 resident blocks on sixteen multiprocessors with caches of up to 48 lines, sums of up to 50000 lines and up to 16 million cycles, three in the graded set beside three of each earlier large kind"
limit_seconds = 60
measured = true
why_not = ""

[cheats]
wrong_readings = [
  { reading = "every load and every sum answers from global memory", hand_case = "block 1 lands on the multiprocessor where block 0 fetched the partials' line and must print the old value" },
  { reading = "a cache per block that is emptied when the block exits", hand_case = "a later block on the same multiprocessor must see the copy its predecessor fetched" },
  { reading = "stores update every cached copy", hand_case = "a store on one multiprocessor followed by a cached load of the same word on another must still read the old value" },
  { reading = "a sum is one read of global memory", hand_case = "a three-line sum shares the rotation with a neighbour and ends two turns later than a one-issue sum would" },
  { reading = "a cached sum reads memory and fills nothing", hand_case = "a sum over a line cached before another multiprocessor rewrote it must add the stale copy" },
  { reading = "a cached sum fills its missed lines only when it finishes", hand_case = "a stale waiter is released at the second fill of a neighbour's five-line sum, not at its end" },
  { reading = "a block in the middle of a sum counts as spinning", hand_case = "the hang is dated from the cycle after the sum's last line, not from when the other block began spinning" },
  { reading = "a carried stream reads each line as memory holds it when the stretch is settled", hand_case = "a store from multiprocessor 0 in the cycle the sum on 1 reads line 1 lands in the total, one from 2 in the next line's cycle does not" },
  { reading = "hits refresh a line's place in the replacement order", hand_case = "a line hit repeatedly is still the one dropped when it is the oldest fill" },
  { reading = "spinners parked outside the rotation", hand_case = "a working block sharing its multiprocessor with a spinner issues every other cycle, and its exit cycle shows it" },
  { reading = "time skipped whenever every ready block is spinning", hand_case = "a spinner whose line is not cached fills during a stretch a skip would jump over, and is released inside it" },
]
correct_variants = [
  "the sealed model's own clock behind the frozen interface: plans with conservative ends, a Fenwick tree over lines for memory sums, and a device loop that visits every multiprocessor each processed cycle",
  "the reference with a different fast path that never works out when a cached line goes: a stretch is refused while any cached line lies in a sum's path or a cached spinner shares a multiprocessor with a cached sum, and those cycles are stepped",
]

