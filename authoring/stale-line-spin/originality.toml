# Originality record for stale-line-spin, written at Stage 1 before any code.
# Scored with: python tools/originalitycheck.py stale-line-spin

[task]
slug = "stale-line-spin"
category = "ML"
label = "Kernels"
tags = ["non-coherent-caches", "thread-block-residency", "spin-wait-liveness", "inter-block-synchronization", "streaming-reductions", "fifo-replacement"]
status = "built"

[mechanism]
# The sentence a reviewer holding two tasks would use for this one.
sentence = "Decide which value every load and every line of a streaming reduction sees, where each block runs and when it ends, when every multiprocessor keeps its own small uncoordinated copy of global memory that outlives the blocks placed on it, a spinning block may never see the store it waits for, and a reduction running for millions of cycles sees only the stores that land ahead of it."
substrate = "a cycle model of one kernel launch across a whole device: multiprocessors that each keep a small line cache over global memory, a block dispatcher bounded by a residency limit, and a per-multiprocessor issue rotation"
graded_output = "for every block the multiprocessor it ran on, the cycles it was placed and exited, and the values it printed, reduction totals included; the cycle a launch hung with each stuck block and the address it spins on; final words of global memory"
failure_mode = "modelling global memory as one coherent array or a reduction as one read of it, then making the clock fast by treating memory as static between device-wide events, as if a stream could not be reached by a store elsewhere or a spinner could never be released by the fills and drops of its own multiprocessor"
interaction = "the line cache decides what each spin attempt and each line of a sum reads while the issue rotation and the multiprocessor order decide when, so whether a store lands in a reduction, whether a stale copy survives a neighbour's stream and when a waiter is let go all hinge on cache residency and issue order together"

[nearest.public]
name = "Alglave et al., GPU concurrency: weak behaviours and programming assumptions (ASPLOS 2015)"
url = "https://johnwickerson.github.io/papers/gpuconcurrency.pdf"
covers = "litmus tests on real GPUs showing message passing reading stale data through the non-coherent per-multiprocessor L1, and which fences and cache operators do or do not restore the expected outcome"
plans_this = false
separation = "it reports which weak outcomes hardware can exhibit; it defines no dispatch policy, issue rotation, line capacity, replacement order or spin semantics, and nothing in it computes where blocks land, when they exit, what each load returns or when a launch hangs, which is the entire graded output here. Sorensen et al. (OOPSLA 2016) explains why a barrier assuming co-residency deadlocks, and GPGPU-Sim models atomics skipping L1, but neither states these rules either."

[nearest.submitted]
name = "guard-mark-unwind"
source = "ledger"
shares = "a turn-taking execution model on a virtual clock whose graded output is an exact trace, in which waiting entities are released by events elsewhere or are never released at all"
same_mechanism = false
separation = "guard-mark-unwind grades how a cancellation mark travels through guards and bands of cooperative fibers; nothing in it has memory, caches, placement or cycles of work. This task grades what a load returns through per-multiprocessor line caches that nobody keeps coherent, where blocks are placed as residency slots free up, and whether a spin can still succeed. A reviewer holding both sees a cancellation runtime and a GPU memory model: different system, different rule family, different output."

[axes]
differentiators = [
  { axis = "mechanism", theirs = "delivery of cancellation marks to the outermost marked guard in view", ours = "visibility of global memory through per-multiprocessor line caches with fills, drops and replacement" },
  { axis = "substrate", theirs = "a cooperative fiber runtime with guards, bands and cleanup blocks", ours = "a device model with multiprocessors, residency slots, a block dispatcher and line caches" },
  { axis = "graded_output", theirs = "an event trace of guards opening, closing and marks delivered, with fiber tokens", ours = "per-block placement, dispatch and exit cycles and printed values, hang cycle with stuck blocks, final memory words" },
  { axis = "failure_mode", theirs = "a one-shot cancellation token stamped with the guard chosen when it was raised", ours = "coherent memory or per-block caches, and treating every spinning block as frozen when skipping time or calling a hang" },
  { axis = "interaction", theirs = "outermost-mark attribution against marks landing while a cut travels", ours = "cache residency deciding what a spin reads against the issue rotation deciding when it reads" },
]

[search]
queries = [
  "GPU L1 cache not coherent across SMs stale read spin wait inter-block flag volatile",
  "simulator GPU thread block dispatch residency deadlock spin-wait occupancy bound execution inter-workgroup barrier",
  "GPU weak memory litmus test message passing L1 cache stale value Nvidia fence Alglave",
  "cycle-level GPU simulator per-SM L1 FIFO eviction write-through atomics L2 CTA scheduler round robin issue",
  "ld.cg ld.ca L1 stale spin loop last block threadfence reduction semaphore partial sums stale",
  "exercise implement GPU memory hierarchy simulator per-SM cache coherence spin wait hang detection block scheduler",
]
results = "Research papers and vendor-adjacent notes explain the phenomena this task is built on: stale reads through the non-coherent L1 (Alglave et al., LightScan's note that ld.cg bypasses and evicts L1 lines, a CUDA visibility cheatsheet), deadlock when a barrier assumes co-residency (Sorensen et al. OOPSLA 2016, Xiao and Feng IPDPS 2010), atomics modelled as skipping L1 (GPGPU-Sim manual), and dispatch by resource availability rather than round robin (a randomized dispatch study). None of them states a complete model a launch can be run against, none computes placements, exit cycles, returned values or hang cycles, and no course exercise, benchmark task or repository implements this combination."
twin_found = false
twin = ""

[collision]
archetype = "occupancy tuning (the Kernels list), nearest because a residency limit decides where blocks land; the cache half sits next to the Algorithms cache-replacement entry"
on_list = true
departure = "the crowded forms compute how many blocks fit or which line an eviction policy picks for its own sake. Here the residency limit is given, not computed, and the replacement order matters only through what it does to visibility: which stale copy a later block inherits, whether a spinning block's line is refetched, and whether a launch can still make progress. Neither an occupancy calculator nor a cache policy exercise produces a load's value, a block's exit cycle or a hang."
substrate_used_before = false
