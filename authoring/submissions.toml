# The submission ledger: every task that has left this checkout, and what it grades.
#
# The pipeline screens each new submission for similarity against public material and
# against tasks already submitted - by anyone, including you. A flag is decided on the
# mechanism, not the prose, so the field that matters here is `mechanism`: one sentence
# saying what the graded work is, with the story stripped out. `tools/originalitycheck.py`
# reads this file and measures a new design's tags, substrate and mechanism sentence
# against every entry before any code is written.
#
# Add an entry the day a task is submitted, not the day a verdict arrives, and update
# `verdict` when the platform answers. A task missing from this file is a task the next
# design is not checked against.
#
# verdict:  ai-passed | human-passed | pending | flagged-similar | rejected
# When a submission is flagged, record what it was flagged against in `similar_to` and
# what the platform said in `note`. Those two fields are the only record this repository
# will have of a screen it cannot run locally, and they are what keeps the next design
# away from the same neighbourhood.

