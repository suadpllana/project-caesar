schema_version = "1.3"

artifacts = ["/app/svc/auth/verify.py"]

[task]
name = "afterquery/signed-callback-hardening"

[metadata]
author_name = "Suad Pllana"
author_email = "suadpllana12@gmail.com"

difficulty_explanation = """
The shipped svc/auth/verify.py already contains the entire textbook plan for a signing
scheme: presence checks, a floor on which headers the signature must cover, the key-state
policy from the live profile, a constant-time comparison, and a body digest taken with the
project's own parser. A frontier agent's memorized answer is therefore already in the file,
and reading it produces no finding. Every remaining gap is in what happens to a request
after verification returns, which means tracing svc/handlers/ingest.py into
svc/pipeline/chain.py and resolving the stage list from svc/conf/profiles/standard.toml.
Three things are wrong there and all three must be fixed. The decode stage parses the body
with jsonx.KEEP_FIRST while canon.document, what the verifier digests, uses the parser's
default KEEP_LAST, so a repeated key at the front of a document leaves the signed digest
byte-identical and changes what the handler receives. The overlay stage merges every
x-doc-* header into the document, and those headers are optional, so the covered-set floor
never reaches them and a relay can write a document field nobody signed. svc/auth/keys.py
records which partners each key is issued to and the audit stage reads it, but verification
does not, so any active key can speak for any partner. An agent that finds the parser
disagreement and stops still fails, which was measured against the previous version of this
task. The instinctive over-corrections fail too, and fail on real traffic: digesting the raw
bytes, refusing annotation headers outright, binding a key to one partner, or demanding
total header coverage each block their forgery family and break requests that work today.
The agent-facing tree carries no comments, docstrings or documentation by design;
identifier names are ordinary production names and are not obfuscated.
"""

solution_explanation = """
The reference solution reads the request path end to end before touching anything, because
the file it is allowed to edit looks finished. It keeps everything the shipped verifier
already did and adds five things. Freshness against max_skew_sec in both directions and a
replay record keyed on key id and nonce, so a redelivery is refused while two partners
sharing a nonce value are not. The body digest is recomputed with
jsonx.parse(..., keep=jsonx.KEEP_FIRST), the exact parse the decode stage performs, so any
rewriting that changes what the handler sees also changes the digest. Every x-doc-* header
present on the request must appear in the partner's cover list, which authenticates the
annotations the overlay stage merges into the document without forbidding the ones partners
legitimately send. And x-partner must be one of the subjects the key store records for the
signing key, which stops a key speaking for a partner it was not issued to while leaving the
key issued to two partners working for both. This is how an application security engineer
fixes a signing scheme in practice: authenticate what the consumer consumes, follow the
request past the point where the signature is checked, and let the data decide the policy.
The script then exercises the result against legitimate traffic and one forgery per gap.
"""

verification_explanation = """
The verifier builds the service from a pristine copy of the application tree baked into the
verifier image and drops in only the agent's /app/svc/auth/verify.py, so edits anywhere else
cannot influence the result and the interface stays fixed. Because the deliverable is code the
verifier has to execute, execution and grading are separated. The grading process imports only
modules the agent cannot supply and never the verifier; the application is driven through a
worker process launched with setpriv as uid 65534 with --no-new-privs, and /logs/verifier and
/tests are root-owned mode 700 before that process starts, so agent code cannot read the suite,
write the reward or plant a report. The reward is not taken from pytest's exit status: after the
run, anything left running as that user is killed and tests/grade.py, a root process that
imports nothing from /app, requires the CTRF report to list exactly the expected test ids, all
passed, with a start timestamp after the run began. A verifier that exits early, is killed, or
executes no tests therefore grades 0. Every case is driven through the
real WSGI application, not through the changed function directly, and the pass condition is
both the HTTP outcome and the effect on the ingest ledger: a forgery counts as rejected only
when verification refuses it and no ledger entry was created, so nothing passes by being let
through and failing later. Two hundred randomized legitimate requests, built with the
partner client library and carrying unicode payloads, nested documents, partner-chosen cover
lists in shuffled order, punctuation-bearing context headers and relay-added headers, must all
be accepted with the recorded document identical to the signed one. Against that, the suite
constructs forgeries per bug class: one uncovered-field mutation for each of the five fields
that change what the service does, repeated-key rewrites at the top level and inside a nested
object, appended document members, relay-injected and relay-rewritten document annotations,
requests attributed to a partner the signing key was not issued to, byte-identical
redelivery, timestamps on both sides of the configured window, keys in every state the
profile excludes, and plain tampering with the signature, the key id, the cover list and the
body. The must-still-work side is fenced just as tightly: partner-signed annotations must
reach the handler intact and a key issued to several partners must work for each of them. Passing therefore requires the signature
to bind every part of the request the pipeline acts on, including the parse the handler
performs, without narrowing what real partners can send.
"""

category = "Security"
subcategory = "AppSec"

tags = [
    "hmac-request-signing",
    "canonicalization",
    "json-parser-differential",
    "webhook-verification",
    "request-pipeline-analysis",
]

expert_time_estimate_hours = 7

relevant_experience = """
I work on application security for payment and partner integration services, where most of
what I review is request authentication: HMAC callback schemes, canonical request formats,
webhook receivers and the middleware in front of them. Signature schemes that cover the wrong
bytes are the recurring finding in that work, and the version of it that bites hardest is the
one in this task, where the component that authenticates a payload and the component that
consumes it disagree about how to read it. I have written both the signing client and the
receiving side of schemes like this one, and I have had to fix a receiver without being able
to change what partners already send.
"""

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[agent]
timeout_sec = 14400.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
