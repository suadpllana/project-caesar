  "stop-sequences",
  "tool-call-dispatch",
  "output-commitment",
  "differential-testing",
]

expert_time_estimate_hours = 8

relevant_experience = """
I run the serving layer for our own models, which means most of my hard bugs are streaming bugs,
and the one this task is built from cost a week. We had started stripping the model's reasoning
out of the client stream, and the stripping was correct: the blocks came out, the text was right
at the end of every response, and every test we had passed. What was wrong was when the bytes
went out. A block that never closed was ordinary text by our own rule, so the server that had
been holding it as hidden had to hand it over late, and a stop string sitting inside a verbatim
block was cutting responses short because the block had not closed yet at the moment the server
looked. Both were invisible in a finished response and both showed up as a stream that stuttered
or ended early, which is the kind of thing a customer reports and a test suite does not. What
made it expensive is that the natural fix, carrying a per-byte flag for whether a byte is going
to be hidden, is right in every situation you would write a test for and wrong exactly when the
liveness of a byte and the bytes after it come from the same unresolved question, which is
common in production and almost never in a test. Tool calls made it worse, because a call
dispatched off a reading that later turned out to be quoted text is a side effect you cannot
take back.
"""

