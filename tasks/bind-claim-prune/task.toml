]

expert_time_estimate_hours = 10

relevant_experience = """
Having worked on the bind stage of a build toolchain: the part that decides which members of an
archive are pulled in, which copy of a duplicated group stands, what a symbol finally binds to
and what is thrown away before the image is written. Familiarity with the fact that link order
is semantics rather than style, that a definition is not settled by the first thing that offers
one, and that what a stage has already done is not the same as what its final state would say it
should have done. Comfort with holding a table that loses entries next to a log that does not,
with the difference between a rule as stated and a structure that can afford it, and with
telling a defect in the resolver from a defect in what the resolver was handed.
"""

