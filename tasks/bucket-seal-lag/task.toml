expert_time_estimate_hours = 8

relevant_experience = """
I build and run the ingestion side of a data platform, which means most of my hard bugs are
completeness bugs: something decided a window was finished while a record for it was still
in the system, and nobody noticed until a downstream total came out short weeks later. The
one this task is built from cost most of a week. We had a re-drive path that sent records
that failed enrichment back to an earlier stage with a delay added, and the aggregation
downstream of it was closing its windows off what its own input queues held. That is right
until the day the re-drive path is not empty, and then a window closes while its own late
records are still going round. The fix that looks obvious is to add the loop's delay to the
window's grace, and that is wrong in both directions at once: too generous where a filter on
the loop means nothing that old can come back at all, and too mean where the record has to
pass through a second aggregation on its way, which does not forward records but emits its
own window edges. What made it expensive is that every one of those readings is right on a
straight pipeline, which is what every test we had was, and the difference only ever showed
up as a handful of records missing from one window in a run of thousands.
"""

