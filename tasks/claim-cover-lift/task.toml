[task]
name = "afterquery/claim-cover-lift"

[metadata]
author_name = "Shiela marie"
author_email = "aurigue.shielamarie20@gmail.com"

difficulty_explanation = """
Ask a strong agent to build this service and it will reach for multiple granularity claiming,
because that is what the problem looks like from the outside. That design brings four things
with it: an intent mode on the box so a claim below it can be seen from above, a queue per node,
an edge drawn from a waiter to whoever holds what it wants, and a counter that swaps a job's
slot claims for the box once there are too many. Each of the four is wrong here, and none of
them is wrong in a way a small program shows.

There are no intent modes in this store. Whether two claims can stand together is settled over
the family - a claim on a box against every slot claim inside it, a claim on a slot against the
box above it - so the bookkeeping an intent mode would have done has to be invented, as counts
kept per box and per job. Nothing else fits the limit: with forty thousand slot claims sitting
in one box, a conflict test that walks them is still exactly right and takes three minutes.

Two more rules cut across the queue. A job that already covers a request is given it at once,
before anything waiting, so the queue is not where admission is decided. And the order grants
come out in is one sequence over the whole store, so a queue drained node by node hands out the
same claims in a different order. That difference hides until one operation frees claims in two
boxes at once, which an end or a stop does, and it does not stay local: a job ignores any line
naming it while its own request is still waiting, so one grant out of order changes which later
lines do anything at all.

The lift is the part that forces the plan to be rebuilt rather than patched. A job asking for a
fifth slot of a box asks for the box instead, and when the box is not free it waits while still
holding the four slot claims it would have given up - so it blocks jobs that those four claims
never touched, and two jobs lifting in one box end up waiting for each other. Which of them is
given up runs through waiting requests as well as granted claims, and the one chosen holds the
fewest acquires counted with repetition, a number a map from node to mode cannot produce,
because a hold here is a list: a drop takes back the most recent acquire and what remains
decides what may now be granted.

Three readings that are exactly right die on the clock instead of on a case. Against the sixty
second limit and measured over the whole graded set: walking a box's slots for each conflict
test costs 179 seconds, reconsidering every waiting request whenever anything changes costs 289
seconds, and looking for a cycle after every operation costs 628 seconds. Each prints what the
reference prints on every program it reaches. The reference finishes all 358 in three seconds.

Names in the tree are short and old-fashioned - hb, book, fit, line, lift, snarl, door, tell,
desk - and there are no comments or docstrings anywhere in it. Both are deliberate, and neither
lies: every name can be recovered from what calls it and what its value feeds. The programs are
synthetic, eleven families of them, weighted towards claims that cross the box and slot
boundary, jobs covering their own requests, lifts that have to queue, cycles that only exist
because somebody is already waiting, repeated acquires on one node, and lines naming jobs that
cannot act on them. A store in production meets these rarely, which is why this class of bug
survives in one.
"""

solution_explanation = """
The six files fall out in dependency order, and the order is forced: what a job holds decides
what covers a request, covering and conflict decide who waits, the waiting order decides what a
lift blocks while it queues, and the lift decides which jobs end up stuck on each other.

book.py is the record of holdings. Each job and node carries a list of acquires, so a drop pops
the last one and the rest still stand. Two indexes hang off that list because the rules ask
questions no walk could answer in time: per job and box, the distinct slots held there and how
many carry a w; per box, one tally per job over its slots. The second is the replacement for the
intent mode, and it is the difference between three seconds and three minutes on the wide
programs.

fit.py answers two questions with one vocabulary. Does the asking job already cover this
request, on the node or on the box above it - asked first, because a covered request neither
queues nor creates a wait. And which jobs stand in its way: the conflicting claims of others in
the family, plus their conflicting requests with smaller numbers. The second answer is returned
as a set of jobs rather than a verdict, because snarl.py walks exactly those sets.

line.py holds the waiting requests, each stamped with the number it took from the store's single
counter, indexed by box so one family's requests can be read in order without touching any
other.

door.py runs take, drop and end, and owns the sweep. The sweep keeps the boxes whose holdings or
queue moved, asks each for its smallest grantable request, grants the smallest of those, and
starts over - which produces one store-wide order without ever looking at families nothing
touched. Each grant feeds back whatever boxes it changed.

lift.py decides when a slot request turns into a request for the box and in which mode, and what
a granted one does: the job's acquires on that box's slots go back in slot order, and the
request that triggered it is then satisfied by coverage.

snarl.py turns fit.py's blocker sets into the waits-for relation and answers which jobs sit on a
cycle through the job that has just queued, by intersecting a walk forward with a walk back.
Only a new wait can create a cycle - a grant adds no edge the granted request was not already
carrying, since a request conflicting with an older waiting one cannot be granted ahead of it -
so nothing looks for cycles anywhere else, which is what keeps the search off the hot path.

Two more services in the authoring set implement the same contract differently, one keeping
holdings job-major as strings of mode letters and finding stuck sets with Tarjan, the other
driving the sweep from a heap of each box's best candidate. Both score 1, which is how the
shape of this one is shown not to be what is graded.
"""

verification_explanation = """
Grading happens in two stages that share nothing. The first runs as an unprivileged user with
the model and the answers unreadable to it: it lays the six submitted files over the verifier's
own copy of the tree, runs every graded program, and writes down what each printed. The second
runs as root, executes none of the submission, and treats that record as hostile - wrong shapes,
missing entries and altered programs each fail rather than throw.

What counts as right is fixed twice. The thirty-two enumerated programs are compared with
answers frozen into gt.json before the grading file existed, one program per graded decision
plus the side of every fence that has to be granted at once. The 326 generated programs are
compared with a second implementation of the rules, written apart from the reference, which the
grader first makes reproduce all thirty-two frozen answers - a twin that had drifted judges
nothing. Their seed is drawn once the agent's container is gone, so a submission has never seen
them; an answer key for the enumerated set therefore passes thirty-two programs and fails 326.

Both directions are fenced. Handing out claims too freely loses fam-box-slot, fam-slot-box,
fair-queue and cover-mode; holding back too much loses fam-sibling, read-share, split-boxes and
cover-ahead. Reading a hold as a single mode loses again-drop and show-format, and taking back
the oldest acquire loses again-lower. Emptying one box's queue before another's loses
seq-across. Giving up on a lift that cannot be granted immediately loses lift-wait; releasing
its slots in the order they were taken loses lift-free-order; lifting a job that already covers
the box loses lift-covered; counting acquires instead of distinct slots loses lift-repeat.
Drawing the waits-for relation through granted claims alone loses ring-fair; stopping whichever
job the search meets first loses ring-two; counting acquires per node loses ring-count; breaking
a tie downwards loses ring-tie. Acting on a line that names a waiting, finished or stopped job
loses busy-line, stop-line and end-line.

All forty-two attempts in cheat/ score 0, and each one is turned down by the part of the
verifier it was written for. Twenty-seven are misreadings of a rule, every one caught by the
program named after that rule. Three are exactly right and too slow, so the clock stops them.
Two are the laziest strategies available - grant everything, and replay the brief's own worked
example. One carries the frozen answers. One puts a working engine in files that are never
collected. The last eight attack the verifier rather than the problem: reading the sealed
directory, writing the reward late from a forked child, planting a record, planting one and
exiting before it can be replaced, returning malformed records, probing privileges, shrinking
the exam it was handed, and rewriting the copy of the tree the verifier is about to stage. The
eight sit on a reference with a single rule broken, so any of them scoring 1 would have earned
it by tampering.

The reward starts at 0 in a root-owned directory closed before the submission runs, is raised
only after both stages return clean, and is written by the privileged stage last. Processes
still holding the sandbox uid when the first stage returns are killed by owner before anything
is graded.
"""

