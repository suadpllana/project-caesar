expert_time_estimate_hours = 10

relevant_experience = """
Work on the admission path of a shared store: deciding which job may touch which box and slot,
what a job is already entitled to by virtue of something larger it holds, and which job to give
up when several of them have come to wait on each other. Knowing from practice that the unit a
conflict is settled over is the family rather than the node, that a re-entrant hold is a count
and not a mode, and that the order claims are handed out belongs to the store rather than to
whichever node happened to free one. Comfortable with the counts that keep an admission test
constant time, and with the kind of deadlock that exists only because somebody is already
queued.
"""

