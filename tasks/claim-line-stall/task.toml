expert_time_estimate_hours = 9

relevant_experience = """
Having worked on the request path of a claim service inside a storage engine: the part that
decides which asks are granted now, which wait, what a coarse claim does to the fine ones
underneath it, and which jobs the service has to give up on. Familiarity with the fact that a
job holding nothing at all can be the only reason another is refused, so the relation deciding
a stall is not the one drawn over the claims being held, and with what a coarse claim that has
been asked for and not yet granted is still holding while it waits. Comfort with deriving the
order of a waiting line from state that keeps moving underneath it rather than stamping it on
each request, and with the difference between a structure that is correct and one that is
affordable at the size the service actually runs at.
"""

