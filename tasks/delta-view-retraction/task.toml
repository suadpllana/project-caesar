]

expert_time_estimate_hours = 8

relevant_experience = """
I work on streaming data pipelines where materialized aggregates are maintained against
change-data-capture feeds, the kind that carry retractions and arrive out of order. The
pain this task is built from is one that costs a lot and shows up late: the obvious rule
for repairing an aggregate after a retraction is the aggregate's algebra, and that rule is
right about correctness and badly wrong about cost, because it ignores what the
accumulator in front of it is actually holding. Bounded top-k state under a min or a max
is where it bites - the state is a faithful witness most of the time and stops being one
without saying so, and a pipeline that rebuilds every group defensively is correct and
burns a machine. Working out that the condition is a property of the cell at that moment
rather than of the aggregate kind is the thing I would want a new engineer on this to get
right, and it is not what the literature hands you.
"""

