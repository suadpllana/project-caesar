[task]
name = "afterquery/delta-view-retraction"

[metadata]
author_name = "Suad Pllana"
author_email = "suadpllana12@gmail.com"

difficulty_explanation = """
The task looks like one question and is two, and the two have different answers. When a
row is retracted from a group, can the aggregate's accumulator absorb the edit, or does
the cell have to be rebuilt from the row store? The retrieved answer is that this is a
property of the aggregate: sums and counts are invertible, minima and maxima are not, so
rebuild the non-invertible ones on every retraction. That plan produces every published
value correctly on all twelve scenarios and is wrong on the work in nine of them, which is
the whole task.

It is wrong because the accumulator in store/agg.py keeps at most three distinct candidate
values per cell and discards the rest with no record that it did. There is no spill
counter, no flag and no predicate that reports it, and no pair of the fields it does keep
witnesses the loss either: the multiplicity it carries is the multiplicity it is still
holding, so it agrees with its own candidate counts whatever went over the side. Two cells
that have accounted for entirely different rows can be byte-identical. That is deliberate
and it has been got wrong twice here - an earlier build exposed a spill counter, and the
build after it kept a total multiplicity that differed from the retained one, which is the
same counter written in two fields. Completeness is therefore not a property the cell can
report; it is a statement about the cell against its group, and reaching it means joining
the candidates the accumulator holds to the rows the cell is accountable for, which live
in a different structure.

Completeness is only the easy half, and a submission that stops there is correct on every
value and over the budget on six of the twelve scenarios, which is the second trap and the
one that decides the task. A cell that has lost values can still absorb a retraction
whenever the retraction leaves its candidates standing: retracting a value the cell never
held cannot move an answer drawn from the values it does hold, and retracting one copy of
a value another live row still carries leaves the same candidates behind. What forces a
reread is the narrow case where a retraction empties a candidate slot in a cell that is
not holding everything, because the value that should move up is exactly the one that was
discarded. Both halves are shipped as cheats: the reading that rebuilds on any incomplete
cell, and the reading that takes the slot test alone and rereads groups that had lost
nothing.

The fence closes on both sides. Rebuilding a cell that could have absorbed the edit is
correct on values and over the budget; absorbing an edit the cell could not answer for
corrupts the value. Neither half of the condition can be read off a field, and the second
half is invisible to anyone who has already found a rule that publishes every number
correctly.

Three edges each kill an otherwise correct implementation. An update is two edits rather
than one, and when it carries a new group the retracting half and the joining half land on
different cells that are judged independently, so one side can absorb what the other must
rebuild for. A delete for a key never inserted, or a second delete for a key already
retracted, is not an edit and must not touch a cell at all. And a retraction of a value
the cell never held cannot move the answer, so treating every retraction as dangerous is
the same overcaution again, priced in scans.

There is no oracle for the graded quantity, and no target to fit either: the brief states
that the work is graded against a budget and does not say what the budget is. The agent
can check its values against a cold rebuild it writes itself, and it will find them
correct under every one of the wrong plans above, because all of them publish the right
numbers. Nothing it can run tells it the work is wrong, and nothing tells it when it has
done enough. The engine ships with no comments anywhere in it and its identifiers are in the
register of ordinary internal code rather than self-describing ones, which is a design
choice: the cap semantics, the dependency map and the two halves of an update have to be
recovered by reading behaviour instead of by reading names.
"""

solution_explanation = """
The reference does what someone who has debugged a materialized view under a retracting
stream does: it separates the two questions before writing anything.

It reads fold in store/agg.py and works out what the accumulator actually retains. For a
running total the state is a scalar and every edit is reversible, so sums and counts
absorb a negative edit exactly as they absorb a positive one, always, with no history. For
the order-sensitive kinds the state is a bounded candidate map, and the cap silently drops
whatever falls outside it, so the accumulator is a partial view of the group whose
partiality is not recorded anywhere.

From that the predicate falls out in two parts rather than one. A positive edit is always
absorbable, because folding a value in either lands it inside the candidate set or gets it
discarded by the same rule a full rebuild would have applied to it, and the two agree. A
negative edit is absorbable while the cell is still holding everything its group holds,
which the accumulator cannot say on its own: the count of distinct live values the cell is
accountable for comes from the cell's dependency map, which already holds one entry per
live row, so the test costs no extra pass over the store. Seeding the retracted values
into that set is what makes the membership case fall out for free rather than needing its
own branch.

That is where a careful solution stops, and it is over the budget. The second half is that
a cell which has lost values can still take a retraction that leaves its candidates
standing - a value the cell is not holding, or a value another live row still carries -
and only a retraction that empties a candidate slot in an incomplete cell has to fall back
to the row store. Five alternative correct implementations of the pair are kept in the
authoring directory, deriving completeness from the dependency map, from the row store and
from retained multiplicity, and testing the two halves in either order; all five reach the
same counters on all twelve scenarios, which is the evidence that this is one condition
rather than one author's taste.

The driver hands the router the edits a delta produced rather than the delta, so the
retracting half and the joining half are already separated and an update that moves a row
between groups is two independent decisions on two cells. Everything else - which cells
publish at a watermark advance, how the row store lands a delta, what counts as late -
was already right and is left alone.

The whole reference is about fifty lines in one file and runs in well under a second.
"""

verification_explanation = """
The rebuilt engine is driven through twelve scenarios, each aimed at one reading of the
rule, and every scenario is checked on three independent axes with no partial credit.

The published values have to match exactly, and the ground truth is re-proved inside the
verifier by a sealed oracle that shares no code with the engine tree: it keeps the full
surviving multiset for every group and folds each aggregate over all of it, with no cap,
no accumulator and no incremental repair. That is the definition the bounded accumulator
is an optimisation of, so a submission whose accumulator drifted under retraction cannot
match it. Both the final view and every value published at a watermark advance are
compared, in order, which catches a submission that repairs lazily and settles up at the
end.

The work is graded as a budget rather than as an equality. folds and scans are counted
inside view/core.py, which is not an editable artifact, so they measure real work whatever
the submitted implementation looks like: a fold is one value actually folded into an
accumulator and a scan is one group actually re-read from the row store. Both have to come
in at or under what the cheapest correct maintenance this environment allows spends. The
direction is deliberate. An earlier version graded equality against a reference that a
submitted solution beat on six of the twelve scenarios while publishing every value
correctly, and the brief published the reference's figures, so the solution was reverted
to match them - a verifier that makes a better answer worse is the run-audit failure this
repo has already had once. A ceiling cannot do that, and it cannot be bought from below,
because every counter is tied to evidence described next.

This is the axis that fails an engine that is merely safe, and it is where the interesting
cheats land. Rebuilding every order-sensitive cell on any retraction, using multiplicity
against candidate count as the loss test, keeping only the sum path incremental, rebuilding
whenever the cell has lost anything, and taking the slot test without asking about
completeness all return every value correctly on every scenario and go over the budget.

None of those numbers is believed on its own. Every one of them is produced inside the
process that executed the submitted file, so the report is a claim, and the evidence for
it is the work journal view/core.py records: one entry for every value folded, every
group reread from the row store, and every publication. The counters are required to
equal what that journal contains, so a counter cannot be assigned; the journal folded
back through a second implementation of the bounded accumulator, written independently
inside the verifier, must reproduce the view and the values the submission published, so
an answer cannot be pasted in; and every record has to be one the scenario allowed, which
the sealed model decides - a reread folds exactly the rows the row store held at that
delta, an incremental fold matches an edit that delta produced and is charged once, and
neither may be charged to a group the delta never touched. Forging a report that survives
all of this means performing the maintenance, which is the task.

Three further checks close the gap between work declared and work done, because a
submission that leaves the counted path correct can still do the real work somewhere the
counters cannot see it and report an incremental cost for an engine that rebuilds every
group. store/agg.py records each fold where it happens, and that record has to be the same
list, in the same order, as the folds the core charged for. The interpreter itself tallies
entries into the accumulator and into the two core operations through sys.monitoring, from
a runner that the submission cannot edit and into a closure rather than into the tree, and
that tally has to equal the ground truth as well; the run is required not to have disturbed
the instrumentation. And the engine functions are fingerprinted as they actually executed,
at import and again when the scenario ends, against digests the grader derives by compiling
the pristine sources, so replacing a counting function is caught the way rewriting its file
already was. The tree itself is hashed against the pristine copy after the run.

Two things are deliberately outside the graded set, because grading them would measure a
choice the task never asked the solver to make. One is any count of reads or writes
against the row store, since a submission may legitimately batch or reorder its own reads.
The other is the order in which a submission visits the cells one delta affects; only the
publication order, which the non-editable driver produces, is compared as a sequence. Five
alternative correct implementations are kept in the authoring directory and all five are
required to score 1: one that derives the accountable set from the row store instead of
the dependency map, one that restructures the predicate as a single pass with no set
comprehension, one that decides completeness by retained multiplicity rather than by
distinct values, one that tests the two halves of the condition in the opposite order, and
one that omits the group filter that the dependency map already implies. All five reach
identical counters on all twelve scenarios. An earlier version of the
environment failed exactly this guard - two correct readings disagreed on the counters
because the row store was mutated before the router ran - and the environment was changed
so the two agree, rather than the verifier being loosened.

The lifecycle is checked as well: the driver's own trace of watermark advances, late
arrivals and publications, in order.

Twenty-four cheats were run against it and all scored 0, in both containers. Eight are the
reference with exactly one decision made the way a solver who missed one piece would make
it, and their failure signatures are distinct and match the design: three fail on the work
counters alone with every value correct, and three corrupt the values. Nine are
reward-tamper probes, since the verifier executes the agent's code: a double-forked
process writing the reward after the run, a planted run output, a planted output followed
by a hard exit of the runner, wrong-typed junk returned from the report, forged counters,
a privilege probe, an attempt to read the ground truth from inside the run, a rewrite of
the non-editable engine in the tree being run, and a sweep of everything the run's uid can
reach. The last three are generated from the ground truth itself and are therefore handed
every answer: they hijack the driver's report and return the correct view, the correct
emitted values, the correct trace and both correct counters. One offers no work journal,
one pads a journal to the counts it claims, and one does the shipped tree's work and then
deletes records from its journal until the counts match. All three fail, and they are the
reason the evidence axis exists. The last four are the reference solution with a second,
uncounted repair bolted on: each one keeps the counted path exactly right and then folds
whole groups back together behind it, so the engine reports an incremental cost and pays a
full rebuild on every delta. They differ in how hard they hide that work - one does not
hide it, one truncates the accumulator's own record of it, one tries to switch off the
verifier's instrumentation first, and one rebinds the fold itself.

The run happens as an unprivileged uid in its own session under a wall clock timeout,
against a tree it cannot write; the reward channel is root-owned and locked before it
starts; the ground truth, the sealed oracle and the grader are root-only files; and the
file the run reports into is opened by root before privilege is dropped and handed over as
a descriptor, so the uid that runs the agent's code does not own the output it is graded
on. Grading runs afterwards as root and never executes anything the agent wrote.
"""

category = "Software"
