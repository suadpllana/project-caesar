difficulty_explanation = """
Two sequences usually admit several scripts of the same shortest length, and \
they disagree about which lines survive. Every tool that exists resolves that \
disagreement its own way, and none of them resolves it the way this task \
specifies. The rule here has three tiers -- fewest moves, then fewest hunks, \
then a reading order -- and the second tier is the one that separates a \
correct submission from an expert one, because it is a different quantity \
from the one every fast diff technique computes. Measured against the graded \
distribution: handing the work to the standard library's sequence matcher \
gets 10130 of the 12000 random pairs wrong and 20243 of the 40804 enumerated \
ones. A submission that solves the first and third tiers exactly -- three \
exact engines, correct crossovers, every tie inside them derived rather than \
recalled, which is what the previous version of this task graded and what \
three probe agents built in three hours -- is wrong on 8601 of the 12000 \
random pairs and 9885 of the 40804 enumerated ones, and on every large pair, \
because putting each drop as early as it will go is exactly what splits one \
hunk into two. The repair that follows from noticing this is the one every \
diff tool carries: keep the fast engines and slide each run of changes \
through the equal lines around it until it meets the next run. That moves \
13547 of the enumerated answers and is still wrong on 6352 of them, because \
sliding never changes which lines survive and the fewest-hunk script often \
keeps a different set, and where it does reach the right count it leaves the \
runs at the far end of their slack, which is where the reading order says not \
to put them. Reading a hunk the way a diff prints one, with the minus lines \
and the plus lines as two blocks, is wrong on 10436 of the enumerated pairs. \
What makes this hold up rather than being noticed in the first ten minutes is \
the other half of the measurement: on sequences of distinct lines with a few \
edits, which is what a person writes out by hand to check themselves, all of \
those approaches agree with the rule on 100 percent of cases. The \
disagreement lives where lines repeat, and the graded distribution is built \
from two to six distinct lines for exactly that reason, with a further block \
that crosses every short shape against every other short shape because a \
random draw of short sequences almost never lands on the pair where two \
shortest scripts differ.

The second hill is cost. The implementation the specification invites is a \
table of the best (moves, hunks) pair reachable from every position in each \
of two states, walked from the start; it is completely correct, it passes all \
52865 short cases, and it is dead everywhere else. It is the definitional \
model that grades those short cases, and it cannot finish the four hundred \
medium pairs inside their budget, let alone one of the eighteen timed pairs. \
The number of moves that remain from a position is what a frontier, a \
bit-parallel row or a threshold array delivers, and it is not enough on its \
own: the hunk count needs its own recurrence, and that recurrence is only \
affordable because it need only be evaluated on cells that lie on some \
shortest path, which the frontier can name. Finding that restriction is the \
first derivation, and it answers two of the three timed families: six pairs \
of four hundred thousand to a million lines that differ in a few hundred \
places, where the shortest-path cells are about one per line, and six of \
forty to sixty thousand lines over two to six distinct ones that differ in a \
few thousand places, where the moves run to four thousand and the frontier is \
millions of entries deep. A submission carrying that, and nothing else, \
passes every correctness block and twelve of the eighteen timed pairs, and \
scores zero.

The six it cannot answer are a quarter to a third of a million lines drawn \
from a pool of sixty-five to a hundred and twenty thousand, put back in a \
different order, where the answer runs past four hundred thousand moves. The \
frontier is out by orders of magnitude on them. So is every way of listing \
the shortest-path cells: between one kept line and the next, every monotone \
path through the rectangle between them is a shortest path, so the cells to \
visit are the areas of those rectangles rather than anything proportional to \
the input. The one cheap thing about such a pair is that almost nothing in it \
matches anything, half a million to one and a half million positions against \
the ninety billion the length implies. Thresholds over suffixes give every \
match the number of keeps a shortest script can still make from it; the \
matches sharing that number form a staircase; and the hunk recurrence has to \
be restated over the staircases alone, with the walk never leaving them. \
That second derivation is only visible once the first is already built, and \
no pair small enough to check against the table looks anything like the \
pairs that need it. Each engine alone passes every correctness block in the \
task, and each alone scores zero.
"""
solution_explanation = """
The awkward part is that the choice at each position depends on two things \
that are still reachable from the position you would land on: how many moves, \
and in how few hunks. The first is a property of the rest of the input and \
every fast diff computes it. The second has its own recurrence -- a run of \
moves that is already open extends for nothing, a keep closes it, and a move \
after a keep opens a new one -- so a cell carries two counts, one for arriving \
inside a run and one for arriving after a keep. A table of both over every \
cell answers everything and costs the product of the two lengths, which is \
what has to be avoided.

So compute the frontier instead, and run it from the far end. Layer d records, \
for each difference between the two indices, the earliest position from which \
both sequences can be finished off in d moves; each layer comes from the one \
below it by stepping to a neighbouring difference and then sliding back over \
equal lines. Keep every layer, which costs the square of the number of moves. \
Now a neighbour is still on a shortest path exactly when its recorded position \
is at or before where the walk stands, and along a diagonal that answer turns \
from no to yes at one row and stays yes. So from any position the next cell \
where a drop or an add becomes possible is one lookup, every cell before it can \
only be kept through, and the hunk counts need computing only at those \
decision cells, children before parents, reached from the start along \
shortest paths. The walk then asks about the drop first, the add second, and \
takes the keep otherwise, comparing the count a move would leave against the \
count the cell carries for the state the walk arrived in. That is the whole \
answer for the long pairs and the crowded ones, and no answer at all for the \
reordered ones, where the number of moves is past the length of the file.

Those need the other shape of algorithm. Almost nothing in such a pair matches \
anything, so hold thresholds over suffixes: for each k, the largest j from \
which the tail of the other side still shares k lines. One pass from the far \
end maintains that array, it only changes where the two sides match, and the \
slot a match lands in is its rank, the number of keeps a shortest script can \
still make from it. The matches of one rank form a staircase, later in one \
side meaning earlier in the other, so the matches of the next rank that a \
given one can still reach are one contiguous stretch of the next staircase, \
and the hunk count of every match falls out of a single sliding window over \
that stretch, plus a check for the match diagonally adjacent, which continues \
a run of keeps and opens nothing. The walk never leaves the staircases: each \
drop or add it considers narrows the stretch it can still land in, and the \
question at every step is whether a keep carrying the required count is still \
inside, which is two bisections. The whole thing costs the number of matching \
positions.

So run the frontier and abandon it, layers and all, once the pair turns out to \
need more moves than the thresholds would have cost from the start. That \
figure has to be counted, and the pass that counts it pays for itself; the \
wasted work is bounded by the cost of the engine that then runs.

Two details are load-bearing. The usual first optimisation, cutting the shared \
head and tail off before starting, changes the answer here, because a drop is \
preferred over a keep whenever both leave the script shortest and as cheap in \
hunks -- so the first move is not always a keep even when the two sequences \
begin with the same line. And a single hunk count per cell is not enough: the \
count a cell can promise depends on whether the walk arrives inside a run or \
after a keep, and it is the pair of them that makes the walk's choice at every \
decision cell a comparison rather than a search.
"""
verification_explanation = """
Three processes, laid out so that whatever the submitted code can touch has no \
bearing at all on the verdict. A child process is the only thing anywhere \
that imports the module: it is handed cases on a pipe, hands answers back on \
another, and holds no expected value, no clock and no verdict. A parent \
harness, which never imports the module, takes every measurement that counts, \
namely the wall clock around each child and whether the child came back at \
all, and gives every one of the eighteen large cases its own process under its \
own budget, enforced from outside the process being timed. The report is \
written into a file root created before privileges were dropped, in a \
directory the sandbox account cannot create, replace or unlink in. A third \
account then grades that report with pytest and never imports the module; the \
grader asserts that no submitted module appears in its own loaded modules, and \
takes the number of cases and the identity of every case from the test package \
and the run seed rather than from the report, so a figure the child could have \
influenced is never treated as evidence. Answers for the short blocks are \
computed from a definitional model that builds the whole table of (moves, \
hunks) pairs and walks it, so the truth comes from the rule rather than from a \
second attempt at the efficient algorithm; and that model is itself held to \
the rule by exhaustion, on 15252 pairs short enough to enumerate every script \
they admit, before anything is graded against it. The model cannot run on a \
fifty thousand line pair, so the larger blocks are graded against the fast \
implementation instead, and a test asserts the two agree on all 40865 fixed \
and enumerated cases before any of those answers count. The fast \
implementation carries two engines and the agreement test covers both: each \
is forced on in turn and held to the definitional model on all 40865 cases by \
itself, because a hybrid that is only ever exercised on one side of its own \
crossover is a hybrid whose other side is untested, and one of the two is \
never reached by any pair small enough for the model to run on.

Part of the distribution moves each run: the twelve thousand random pairs, the \
four hundred medium ones and all eighteen large ones come from a seed drawn by \
root at the start of the run and handed to both accounts separately, so a \
table of answers built during one run is worth nothing on the next. The \
definitional model, the fast implementation and the answers all live in \
/tests, owned by root and unreadable to the sandbox account -- checked from \
inside that account, where the directory cannot even be listed.

Attacked with a module that stops every clock in the time module, overwrites \
/logs/verifier/reward.txt and the report, reaches into pytest to turn test \
bodies into no-ops, lists /tests looking for the answer key, and returns a \
list subclass whose equality always agrees. It scored zero. The reward file \
stayed at zero because the account cannot write it, the report could not be \
replaced, /tests could not be listed, the pytest import was refused by a hook \
and recorded, and a test asserts that record is empty and failed the run on \
it. The always-equal return died at the pipe: the child flattens whatever came \
back to plain strings and integers and serialises it, so a comparison that \
always agrees never reaches the comparison. Also measured, each one run \
through the whole verifier as a submission: delegating to the standard \
library's sequence matcher scores zero, wrong on 10130 of 12000 random pairs \
and 20243 of 40804 enumerated ones; the correct table implementation scores \
zero on time while passing every short case; and doing nothing at all scores \
zero.

Four more submissions were built against the shape of the task rather than \
against the verifier, because a stopping point that passes everything a person \
would think to test is worth more than another attack on the reward file. The \
first is the complete answer to the previous version of this task, three \
exact engines with every tie inside them derived, which solves the first and \
third tiers of the rule and is wrong on the second: 8601 of 12000 random pairs \
and 9885 of 40804 enumerated ones, inside every budget. The second is that \
submission with the hunk-sliding pass every diff tool carries bolted on \
afterwards, wrong on 7263 and 6352. The third reads a hunk the way a diff \
prints one, minus lines and plus lines as two blocks, wrong on 4696 and 10436. \
The fourth finds the shortest-path restriction and evaluates the hunk \
recurrence at every such cell: it passes every correctness block and twelve of \
the eighteen timed pairs, and never answers the six reordered ones, because \
the cells between one match and the next are whole rectangles there. An \
alternative correct implementation is kept beside them and must score 1: the \
same per-cell recurrence with the thresholds engine behind it, which is what a \
solver who has found the restriction writes first, and it clears every budget, \
which is what makes the budgets fair.

Budgets were measured in the real two-image trial at the declared two cores \
and four gigabytes, on a sandbox whose speed was seen to drift by a factor of \
three to four within one session, so they are set from the slowest state \
observed rather than the fastest: the reference spends between six and \
twenty-one seconds on the dearest pair depending on that state, against \
sixty, and the medium block between three and fourteen against forty. \
Nothing the timings separate is near either line: the table and the per-cell \
submission are out by orders of magnitude, and the alternative correct \
implementation kept beside the cheats clears both with room to spare.
"""
relevant_experience = """
Front-end is what I get paid for, about three years of it, React and Vue on \
top, TypeScript through all of it, plus whatever Python a project's tooling \
ends up needing. Diffs are \
one of the few pieces of algorithmic machinery a front-end developer actually \
has to stare at, because rendering one is my job and anchoring anything to it \
is where it goes wrong. Line numbers are not stable identity. Two backends \
that both produce a shortest script can hand you different surviving lines for \
the same pair of files, and anything pinned to a position moves when the \
backend does. That is why this task pins a single answer and grades the moves \
and their order exactly, rather than grading a diff by how it looks. The hunk \
tier is the other half of the same scar: a review tool that shows one change \
as three little runs is a tool people stop trusting, and every diff library I \
have used papers over that with a sliding pass after the fact rather than \
asking for the fewest hunks in the first place.

The performance half comes from a scar I have written about before. \
Virtualised lists: I had a version that recomputed row positions by walking \
the collection from the top on every change. Correct, obviously correct, fine \
for months, and hopeless on a customer's data two orders of magnitude larger \
than anything I had tested on. The fix was not a faster walk, it was keeping \
enough summary information to answer the question without the walk. That is \
the same shape as the trap here, which is why I trust it: the quadratic \
version of this is what a competent person ships, it passes every test they \
would think to write, and nothing about the small inputs tells them it is the \
wrong structure.

I am not a diff specialist and I would not claim to be. What I checked \
carefully, because I would have got it wrong myself, is the case where a line \
that matches gets dropped anyway -- it looks like a bug until you follow the \
rule through, and it is the single place where every existing implementation \
and this specification part company.
"""

