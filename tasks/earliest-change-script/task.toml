expert_time_estimate_hours = 24
difficulty_explanation = """
In the real world this is the job of whoever owns the diff backend of a code \
review tool, where comments hang off the moves of a script and a script that \
changes with the backend moves the comments with it. Two sequences usually \
admit several scripts of the same shortest length, and they disagree about \
which lines survive. The rule here has three tiers -- fewest moves, then \
fewest comments, then a reading order -- and the second tier is the one that \
separates a correct submission from an expert one, because it is a different \
quantity from the one every fast diff technique computes, and it is not the \
quantity the word invites either. A comment does not hang off a run of moves. \
Two runs with fewer than three kept lines between them are one comment, so \
what a position has to carry is not whether a run is open but how many keeps \
have gone by since the last move, and no flag holds that. Measured against \
the graded distribution: handing the work to the standard library's sequence \
matcher gets 11085 of the 12000 random pairs wrong and 26916 of the 40804 \
enumerated ones. Counting runs of moves instead of comments -- the whole task \
built properly, three exact engines with correct crossovers and every tie \
inside them derived, which is what a careful reading that misses one sentence \
produces -- is wrong on 9160 of the random pairs and 10657 of the enumerated \
ones, because merging changes which script is cheapest and so changes which \
lines survive. The repair that follows from noticing the merge is the one \
every diff tool already carries: slide each run of changes through the equal \
lines around it until it meets the next run. Sliding is exactly the operation \
that brings two runs close enough to share a comment, and it is still wrong \
on 9082 and 13615, because sliding never changes which lines survive and it \
lands the runs at the far end of their slack, which is where the reading \
order says not to put them. Reading a change the way a diff prints one, with \
the minus lines and the plus lines as two blocks, is wrong on 9111 and 8821. \
On sequences of distinct lines with a few edits, which is what a person \
writes out by hand to check themselves, all of those approaches agree with \
the rule on every case; the disagreement lives where lines repeat, and the \
graded distribution is built from two to six distinct lines for that reason.

The second hill is cost. The implementation the specification invites is a \
table of the best (moves, comments) pair reachable from every position and \
every distance from the last move, walked from the start; it is completely \
correct, it passes all 52875 short cases, and it cannot finish the four \
hundred medium pairs inside their budget, let alone one of the eighteen timed \
pairs. Every fast technique -- a frontier of furthest-reaching positions, a \
bit-parallel row, a threshold array -- delivers how many moves remain and \
nothing else, and the comment count needs its own recurrence, which is only \
affordable on the cells that lie on some shortest path. The eighteen timed \
pairs come from three families whose costs are independent of one another, \
and each is hopeless for whatever answers the other two. Six pairs run from \
four hundred thousand to a million lines a side and differ in a few hundred \
places: the frontier names their shortest-path cells at the square of the \
number of moves, and the keeps it skips over between two decision cells have \
to be counted rather than skipped, because they are exactly what carries a \
position away from the last move. Six are a quarter to a third of a million \
nearly distinct lines put back in a different order, where the answer runs \
past four hundred thousand moves: thresholds over suffixes give every match \
the number of keeps a shortest script can still make from it, the matches \
sharing that number form a staircase, and the recurrence restated over the \
staircases costs the number of matching positions. That restatement is where \
the merge bites hardest. Under a rule that counted runs, the matches of the \
next rank that a given one can reach are one contiguous stretch and one \
sliding minimum over it answers the question. Here the keep straight down the \
diagonal carries the keep count forward while every other keep in the stretch \
resets it, so that one has to be held out of the minimum rather than compared \
against it, and holding it out splits the stretch into two -- one more row \
down, or one more column across -- each of which is contiguous in a staircase \
and needs a sliding minimum of its own. Six are forty to sixty thousand lines \
over two to twelve distinct lines, sharing no order, with fifteen to \
sixty-one thousand moves: the frontier is out by orders of magnitude, the \
staircases hold a billion matches, and there is no long common run anywhere \
to cut at. The one cheap thing about such a pair is that rows of the prefix \
table fit in machine words, and rows give the number of moves alone. Reading \
the shortest-path cells off them is the derivation the family is built on: a \
cell is on a shortest path when a drop, an add or a keep from it lands on \
one; the add and the keep are single bits; and the drop asks whether the \
table is equal in two consecutive rows at that column, which fails exactly on \
the stretches between a column where a step appears in the lower row and a \
column where one disappears, and those alternate, so one subtraction fills \
every stretch at once. Those cells number three to ten per row on every \
crowded pair measured, so the recurrence over them is cheap, and listing them \
any other way is a popcount per cell, which is the table again. A submission \
carrying the other two engines and nothing for this family passes every \
correctness block and twelve of the eighteen timed pairs, and scores zero. \
None of the three can be skipped, and there is no credit for any two.
"""
solution_explanation = """
The choice at each position depends on two things still reachable from the \
position you would land on: how many moves, and in how few comments. Every \
fast diff computes the first. The second has its own recurrence -- a run of \
moves that is already open extends for nothing, and a later run opens a \
comment of its own only once three keeps have gone by -- so a cell carries one \
count for every number of keeps the walk can arrive with, held at three, and \
the counts only need to exist on cells that lie on some shortest path. Three engines find those cells three \
different ways, and each is the cheap one for one family of pairs.

The frontier, run from the far end, records for each diagonal the earliest \
position from which the end is reachable in d moves, layer by layer. A \
neighbour is still on a shortest path exactly when its recorded position is at \
or before where the walk stands, and along a diagonal that answer turns from no \
to yes at one row and stays yes, so from any position the next cell where a \
drop or an add becomes possible is one lookup and everything before it can only \
be kept through. The comment counts are computed on those decision cells \
alone, and the keeps skipped on the way to each one are counted rather than \
skipped, because they are what carries a position away from the last move. \
This costs the square of the number of moves and does not care how long the \
pair is: a million lines that differ in three hundred places take a fifth of a \
second, and a pair that shares no order is finished by nobody.

The row engine holds rows of the prefix table one to a machine integer, \
advanced by the five-operation bit-parallel step, which gives how many moves \
remain from every position. It then sweeps back up the rows and derives each \
row's shortest-path cells from the row below with a handful of integer \
operations: a cell is on a shortest path when a drop, an add or a keep from it \
lands on one; the add is a bit of the row, the keep a bit of the line's \
occurrence mask, and the drop needs the table to be equal in the two rows at \
that column, which fails on the stretches between a column where a step appears \
below and a column where one disappears -- those alternate, so one subtraction \
of the two mark sets fills every stretch. Tight adds fill leftward through the \
row from each seed. The cells that come out are a few per row, the recurrence \
runs on those, and the whole thing costs the length of the pair times its width \
in machine words: sixty thousand crowded lines are a few seconds, a million \
lines would be hours, which is why the frontier exists.

The staircase engine holds thresholds over suffixes: for each k, the largest \
position from which the tail of the other side still shares k lines. One pass \
from the far end maintains that array, it changes only where the two sides \
match, and the slot a match lands in is its rank, the number of keeps a \
shortest script can still make from it. The matches of one rank form a \
staircase, later in one side meaning earlier in the other, so the matches of \
the next rank that a given one can still reach are one contiguous stretch of \
the next staircase. A rule that counted runs would take one sliding minimum \
over that stretch. This one cannot: the keep straight down the diagonal \
carries the keep count forward where every other keep in the stretch resets \
it, so it has to be held out of the minimum, and holding it out splits the \
stretch into two contiguous pieces that each need a sliding minimum of their \
own. The walk never leaves the staircases: each move it considers narrows the stretch it \
can still land in, and the question at every step is whether a keep carrying \
the required count is still inside, which is two bisections. This costs the \
number of matching positions, which on a third of a million nearly distinct \
lines is half a million, against ninety billion cells.

Dispatch is by cost: two of the three are read off the two lengths, the third \
has to be counted, and the frontier runs first and is abandoned once the pair \
needs more moves than the cheaper of the other two would have cost from the \
start. Two details are load-bearing. Cutting the shared head and tail off \
before starting changes the answer, because a drop is preferred over a keep \
whenever both leave the script shortest and as cheap in comments. And a pair \
of counts per cell is not enough: what a cell can promise depends on how far \
the walk arrives from the last move, not merely on whether a run was open, and \
it is the whole set of them that makes the walk's choice a comparison rather \
than a search.
"""
verification_explanation = """
Three processes, laid out so that whatever the submitted code can touch has no \
bearing at all on the verdict. A child process is the only thing anywhere \
that imports the module: it is handed cases on a pipe, hands answers back on \
another, and holds no expected value, no clock and no verdict. A parent \
harness, which never imports the module, takes every measurement that counts, \
namely the wall clock around each child and whether the child came back at \
all, and gives every one of the eighteen large cases its own process under its \
own budget, enforced from outside the process being timed. The report is \
written into a file root created before privileges were dropped, in a \
directory the sandbox account cannot create, replace or unlink in. A third \
account then grades that report with pytest and never imports the module; the \
grader asserts that no submitted module appears in its own loaded modules, and \
takes the number of cases and the identity of every case from the test package \
and the run seed rather than from the report, so a figure the child could have \
influenced is never treated as evidence. Answers for the short blocks are \
computed from a definitional model that builds the whole table of (moves, \
comments) pairs and walks it, so the truth comes from the rule rather than from a \
second attempt at the efficient algorithm; and that model is itself held to \
the rule by exhaustion, on 15256 pairs short enough to enumerate every script \
they admit, before anything is graded against it. The model cannot run on a \
fifty thousand line pair, so the larger blocks are graded against the fast \
implementation instead, and a test asserts the two agree on all 40875 fixed \
and enumerated cases before any of those answers count. The fast \
implementation carries three engines and the agreement test covers all of \
them: each is forced on in turn and held to the definitional model on all \
40875 cases by itself, because a hybrid that is only ever exercised on one \
side of its own crossover is a hybrid whose other sides are untested, and two \
of the three are never reached by any pair small enough for the model to run \
on.

Part of the distribution moves each run: the twelve thousand random pairs, the \
four hundred medium ones and all eighteen large ones come from a seed drawn by \
root at the start of the run and handed to both accounts separately, so a \
table of answers built during one run is worth nothing on the next. The \
definitional model, the fast implementation and the answers all live in \
/tests, owned by root and unreadable to the sandbox account -- checked from \
inside that account, where the directory cannot even be listed.

Attacked with a module that stops every clock in the time module, overwrites \
/logs/verifier/reward.txt and the report, reaches into pytest to turn test \
bodies into no-ops, lists /tests looking for the answer key, and returns a \
list subclass whose equality always agrees. It scored zero. The reward file \
stayed at zero because the account cannot write it, the report could not be \
replaced, /tests could not be listed, the pytest import was refused by a hook \
and recorded, and a test asserts that record is empty and failed the run on \
it. The always-equal return died at the pipe: the child flattens whatever came \
back to plain strings and integers and serialises it, so a comparison that \
always agrees never reaches the comparison. Also measured, each one run \
through the whole verifier as a submission: delegating to the standard \
library's sequence matcher scores zero, wrong on 11085 of 12000 random pairs \
and 26916 of 40804 enumerated ones; the correct table implementation scores \
zero on time while passing every short case; and doing nothing at all scores \
zero.

Five more submissions were built against the shape of the task rather than \
against the verifier, because a stopping point that passes everything a person \
would think to test is worth more than another attack on the reward file. The \
first counts runs of moves rather than comments -- the whole task built \
properly, three exact engines with every tie inside them derived, which is \
what a careful reading that misses one sentence produces: 9160 of 12000 \
random pairs and 10657 of 40804 enumerated ones, inside every budget. The \
second is that submission with the run-sliding pass every diff tool carries \
bolted on afterwards, wrong on 9082 and 13615. The third reads a change the \
way a diff prints one, minus lines and plus lines as two blocks, wrong on \
9111 and 8821. The fourth finds the shortest-path restriction and evaluates \
the comment recurrence at every such cell: it passes every correctness block and the six \
long pairs, and never answers the twelve that share no order. The fifth is \
the frontier and the staircases with nothing for the crowded family, which is \
the natural place to stop once the other two families are answered: every \
correctness block, twelve of the eighteen timed pairs, and zero. An alternative correct \
implementation is kept with the authoring tooling outside the bundle and must \
score 1: the per-cell recurrence on the frontier's side with the row and \
staircase engines behind it, which clears every budget, and that is what makes \
the budgets fair.

Budgets were measured in the real two-image trial at the declared two cores \
and four gigabytes, on a sandbox whose speed was seen to drift by a factor of \
three to four within one session, so they are set from the slowest state \
observed rather than the fastest: the reference spends between six and \
fifteen seconds on the dearest pair depending on that state, against \
sixty, and the medium block between five and fifteen against forty. \
Nothing the timings separate is near either line: the table and the per-cell \
submission are out by orders of magnitude, and the alternative correct \
implementation kept beside the cheats clears both with room to spare.
"""
relevant_experience = """
Front-end is what I get paid for, about three years of it, React and Vue on \
top, TypeScript through all of it, plus whatever Python a project's tooling \
ends up needing. Diffs are \
one of the few pieces of algorithmic machinery a front-end developer actually \
has to stare at, because rendering one is my job and anchoring anything to it \
is where it goes wrong. Line numbers are not stable identity. Two backends \
that both produce a shortest script can hand you different surviving lines for \
the same pair of files, and anything pinned to a position moves when the \
backend does. That is why this task pins a single answer and grades the moves \
and their order exactly, rather than grading a diff by how it looks. The \
comment tier is the other half of the same scar: a review tool that shows one \
change as three little runs is a tool people stop trusting, and a reviewer \
with a line or two of untouched code in front of them does not read a second \
change either. Every diff library I have used papers over that with a sliding \
pass after the fact rather than counting what a reader would count in the \
first place.

The performance half comes from a scar I have written about before. \
Virtualised lists: I had a version that recomputed row positions by walking \
the collection from the top on every change. Correct, obviously correct, fine \
for months, and hopeless on a customer's data two orders of magnitude larger \
than anything I had tested on. The fix was not a faster walk, it was keeping \
enough summary information to answer the question without the walk. That is \
the same shape as the trap here, which is why I trust it: the quadratic \
version of this is what a competent person ships, it passes every test they \
would think to write, and nothing about the small inputs tells them it is the \
wrong structure.

I am not a diff specialist and I would not claim to be. What I checked \
carefully, because I would have got it wrong myself, is the case where a line \
that matches gets dropped anyway -- it looks like a bug until you follow the \
rule through, and it is the single place where every existing implementation \
and this specification part company.
"""

