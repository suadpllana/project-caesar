  "ordered-change-journal",
  "conditional-activation",
  "differential-testing",
]

expert_time_estimate_hours = 9

relevant_experience = """
Having built and carried the pager for the resolver of a settings service: the part that turns
a journal of operator changes into the effective board, answers reads by section and name, and
has to say what the board is after an operator withdraws a change they made an hour ago.
Familiarity with the fact that withdrawing a change is not undoing it, that a section which
inherits from another is not the same thing as a section holding the same value, and that a
slot emptied and a slot masked look identical in a table of values and behave nothing alike.
Comfort with the accounting a conditional change needs when whether it applies depends on the
board its own neighbours produce, with keeping a derivation correct while it is worked out
again only where the journal moved, and with the difference between a resolver that is correct
and one that is affordable at the journal lengths a real estate runs at.
"""

