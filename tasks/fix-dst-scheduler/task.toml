schema_version = "1.3"

artifacts = [
  "/app/sked/zt.py",
  "/app/sked/due.py",
  "/app/sked/gate.py",
  "/app/sked/lane.py",
]

[task]
name = "afterquery/fix-dst-scheduler"

[metadata]
author_name = "Shiela marie"
author_email = "aurigue.shielamarie20@gmail.com"

difficulty_explanation = """
Who does this for a living: an engineer who owns the periodic-job runner inside a platform,
the component that decides which recurring job gets the serial worker next, in site-local
time, under maintenance windows and per-site run caps. The two nights a year when a site's
clock moves are the nights that component pages someone.

The graded data is synthetic. Zones, offsets and transition instants are invented rather
than taken from any published table, so nothing about the answers can be looked up, and the
six generated families are deliberately concentrated: one puts every job's due time near a
transition, one loads the worker so runs queue behind each other, one squeezes the pool cap,
one gives a pool a zone its jobs do not share, one lets follow-mode jobs drift out of their
windows. Ordinary uncontended plans are generated too, and they have to come out unchanged;
a planner that turns cautious under pressure fails those.

The first plan is the shape every cron-like scheduler has: expand each job's occurrences
over the horizon, convert the local times to instants, merge, and walk forward pushing
whatever overlaps. Two things kill it. The worker is never interrupted, so a run's start is
not a function of its own job - a high-priority occurrence sits behind a low-priority run
that already started, and the arbitration is re-made every time the worker frees rather than
following nominal order. Then the expansion phase itself turns out to be unwritable: a
follow-mode job takes its next occurrence from the instant the previous one was actually
attempted, and the worker decides that, so the calendar and the arbitration are the same
loop. The wrong version is right whenever nothing contends, which is most of an ordinary
plan, so the mistake surfaces only where the families put pressure on it.

Around that sit rules that each look independently implementable and are not: whether a
missed occurrence counts as an attempt changes every later due time of its job, the minute a
window closes moves when a transition falls inside it, and the cap ledger counts days in the
pool's zone while the window is bounded in the job's, so the same instant can be inside the
window and past the reset.

The environment uses short legacy-register identifiers and ships no comments or docstrings on
purpose: the agent has to recover what a module does from what calls it and what its value
flows into, which is the model-building the task is about. The runner prints what the shipped
planner believes and supplies no correctness oracle for any of it.
"""

solution_explanation = """
The reference keeps the four planner modules the tree already has and changes what each
decides. The zone module resolves a local minute by trying it against every offset segment
the shift table defines, keeping the latest instant that lands inside its own segment and,
when none does, the first instant whose local minute is past the one wanted. The cadence
module separates the two modes by time base: wall-clock minutes for one, elapsed minutes from
the previous attempt for the other. The window module walks the admission predicate forward
one boundary at a time - the next time-of-day edge inside the current offset segment, or the
start of the next segment, whichever is nearer - instead of computing a closing minute by
arithmetic that a transition invalidates, and it keys the cap ledger by the pool's own local
day and charges it at the start.

The lane module is where the shape changes. The shipped one expands every job's occurrences
up front and then simulates over that list; the reference deletes that phase, because a
follow-mode job's later occurrences do not exist until the earlier ones have been placed. It
advances each job lazily from its own attempt history and drives the loop from the set of
instants at which the worker's choice can change: a run ending, an occurrence coming due, a
deadline falling, and a pool day rolling over. That last one is easy to leave out and shows
up only when a run is waiting on a cap with nothing else happening.

That is how an engineer would do it, because the three outcomes an occurrence can have, and
which of them move the attempt anchor, cannot be settled anywhere except in the loop that
also decides who gets the worker.

The independent model used for the expected output is built the other way round: a heap of
wake-ups pushed as they become relevant rather than a candidate set recomputed each
iteration, offsets bisected out of a segment table rather than scanned, and its own parser.
The two agree line for line over 1800 generated plans across five nonces.
"""

verification_explanation = """
Passing means the planner reproduced, exactly, the trace of plans it never saw. The verifier
runs the submitted modules over 21 enumerated plans whose answers are frozen, and over 300
plans generated inside the run from a nonce drawn after the agent has finished, answered by
the sealed model. Every line of every plan must match: kind, job, occurrence number and
instant. One wrong line anywhere scores zero, and each enumerated plan is named for the rule
it pins, so a failure says which decision was read wrongly rather than which line differed.

The enumerated set fences both sides. Contention-free plans with no transition must still
produce every ordinary run, so a planner that drops or defers defensively fails them, and the
adversarial ones put a transition inside a window, a repeated local hour under a waiting run,
a pool spanning two zones, and a cap that resets while a run waits.

Nothing the run can reach yields an answer. The frozen answers, the grader and the sealed
model are root-only inside the verifier image, and `tests/seal` is mode 700, so the
unprivileged uid that executes the submitted code gets PermissionError rather than a zero it
could mistake for an empty file. The worker runs in its own session under a hard wall clock,
writes into a descriptor root opened for it, and computes no verdict; survivors owned by that
uid are killed and both exit statuses are checked before the grader, which runs as root and
imports nothing the agent wrote, treats the worker's report as hostile input. Everything
outside the four declared paths is restored from a pristine copy and hashed against it.

The frozen record type counts how many records were made, and the grader requires at least as
many as there are printed lines, so a planner that hands back ready-made strings is visible
even when the strings would have matched. Thirty-two adversarial attempts were run in the
containers and scored zero, and the report names the test that caught each one: the wrong
readings by the enumerated plan that pins their rule, the constant and positional strategies
by the ordinary plans, the reward-tamper and answer-reading probes by having nothing of their
own to fall back on once the tamper failed.
"""

category = "Software"
subcategory = "Algorithms"

tags = [
  "local-time-arithmetic",
  "offset-transitions",
  "priority-arbitration",
  "discrete-event-simulation",
  "differential-testing",
]

expert_time_estimate_hours = 8

relevant_experience = """
I look after the periodic-job side of a data platform: the part that decides which recurring
job gets the serial worker, inside which maintenance window, against a per-site cap. Almost
all of it is boring until the clocks move. The first time a site went onto a different offset
from the scheduler we had every failure in this task's brief within a fortnight - a nightly
job that ran an hour late for half the year because the cadence was being advanced in elapsed
time, a job that fired twice on the night the hour repeated, and a nightly cap that let two
runs through because the day boundary was being counted where the job lived rather than where
the cap was defined.

The one that took longest to see was not a clock bug at all. Jobs that repeat a fixed
interval after they last ran drift, and when the worker is busy they drift further, so a job
that was displaced once by something more important lands a little later every day until it
falls outside its window and starts being dropped. Our scheduler computed the whole calendar
ahead of the run, which is right until a job's calendar depends on when the worker got round
to it, and no amount of testing on an idle worker shows that.
"""

