difficulty_explanation = """
A configuration-language engineer would repair this layered settings service while adding a
live source with a retained fallback to a deployment tool. Such an engineer maintains the
store, the historical evaluator and the count operation as one implementation. The plans
and traces are synthetic; they exercise template copies, guarded rollout views, live links,
and fallback definitions rather than customer data.

An immutable tree with lazy copy and live-link wrappers is a reasonable starting design for
put, mix, map and tie. A veil cannot use its single inherited subtree: the visible definition
may come from a local write, a live source at the current view, or a frozen destination at
the entry view, in that order and separately at every path. The source side moves operands;
the fallback side does not. A circular definition on the source side still takes priority.
A cut masks both inherited sides, whereas a put shadows one path. Those choices change
identity, historical reads and the set of paths counted by tot simultaneously.

The full-sized plans rule out listing every visible path. A veiled root can put a live source
above a frozen copy of a deep shared tree with millions of logical paths and sparse edits.
Counting both subtrees separately double-counts overlap, and walking all paths cannot meet
the batch limit. The repair requires a structural count that reuses shared parts and checks
only the branches where the two sources differ, while retaining the ordinary one-source
behaviour. The short legacy names are consistent with a compact interpreter; the difficulty
comes from these coupled semantics and the scale of the logical view.
"""

solution_explanation = """
The reference stores physical edits in an immutable tree and reads a logical node at each
path. A tie contributes one live inherited node, and a copy contributes one frozen inherited
node. A veil contributes both: the matching source in the current view and the saved
destination in the pre-entry view. Local definitions take precedence, then the source, then
the fallback. Only the source's definitions pass through a path move; the fallback retains
its original definition identity and predecessor view. Cuts remove or mask inherited sides,
and copying a veiled region captures its current visible definitions.

Counts combine the inherited path sets by addition minus their intersection, then replace
inherited counts at locally written children with the child's own count. The intersection
walk is memoized by logical-node pair and remaining path budget. A pure copy alias is reduced
to its inherited node, so overlapping millions of shared paths collapse to a common node
rather than being listed. Where a live lookup returns to a path on its current chain, the
reference counts that small cyclic region literally. Expression values and circularity are
keyed by definition identity and view; transformed definitions keep their originating layer.
"""

verification_explanation = """
The separate verifier overlays only the six declared Python modules on its pristine driver,
parser and output writer. It compares complete output lines exactly. The retained 85 frozen
hand answers cover put, cut, mix, map, tie, guards, historical reads, value order, path
bounds and circularity; their expected lines remain unchanged. Twelve added hand plans
cover live source precedence, empty-source fallback, value-independent selection, local
shadowing and masking, moved versus unchanged operands, frozen copies, historical reads,
source ties, unchanged fallback operands and a small live ring that reaches fallback. The sealed independent model must
reproduce every frozen answer before grading the submission.

Seeded generated plans combine these behaviours with changed paths and values in twenty-
three shaped families. Five scale families include wide repeated counts, deep copied trees,
map chains, a tie copied back under its source, and a veil above a frozen deep copy with
sparse overlap. The submitted worker must finish its entire batch inside 60 seconds. It
runs unprivileged and produces only an untrusted record; a privileged grader owns the
expected answers, the sealed model and a binary reward initialized to zero. Worker and
grader success are both required for reward one, and surviving worker processes are reaped.
"""

category = "Software"

