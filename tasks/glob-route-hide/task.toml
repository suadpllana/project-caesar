]

expert_time_estimate_hours = 9

relevant_experience = """
Familiarity with how module systems resolve names - explicit imports, glob imports and
re-exports, visibility restricted to a module and the modules nested inside it, and conditional
compilation - and with the ways real resolvers get it wrong: a private helper import silently
removing a name from a public API, a re-export narrowing visibility nobody meant to narrow, and
answers that change with the order a cycle of re-exports is visited. Comfort writing fixed-point
computations over a module graph that stay exact and affordable when the whole graph is one
cycle, and building the independent checkers and shaped populations that show a resolver is right
rather than merely plausible.
"""

