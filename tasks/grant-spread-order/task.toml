expert_time_estimate_hours = 7

relevant_experience = """
I look after the authorization layer for a document store, which means most of my hard bugs
are inheritance bugs. The one this task is built from took most of a week. A team moved a
folder between two parts of the tree and a handful of people kept access they should have
lost, while a handful lost access they should have kept, and nothing in any log said
anything was wrong because every individual decision was consistent with the rules the
service had written down. What it came down to is that we materialise inherited rules
rather than evaluating the chain at read time, so the state depends on the order the
administrative acts happened in, and our re-inheritance pass stamped the rules it rewrote
with the time of the move. That is invisible until two rules tie, at which point the
tie-break silently changes meaning. The interaction with folders that block inheritance is
the same bug wearing a different hat: a blocked folder carries a snapshot around with it,
and the moment it ends up above something it used to sit under, the assumptions everyone
makes about what "inherited from" means stop holding.
"""

