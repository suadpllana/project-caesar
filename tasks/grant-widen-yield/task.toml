]

expert_time_estimate_hours = 9

relevant_experience = """
Having worked on the lock manager of a storage engine: the part that turns a request for a row
into grants on the row, the page it sits on and the table above that, decides what happens when
two transactions want the same thing, and keeps a request costing the same when four hundred
transactions are open as when four are. Familiarity with the fact that an intention lock is
bookkeeping about what a transaction holds below rather than a lock it wanted, that what a
service does to the loser of a conflict is a policy rather than a law, and that escalating a
transaction to a coarser grain widens what it conflicts with and can cost it far more than it
saves. Comfort with mode lattices, with the difference between the mode a transaction asked for
and the mode it currently has, and with the difference between a structure that is correct and
one that is affordable at the transaction counts a real workload runs at.
"""

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[agent]
timeout_sec = 14400.0

