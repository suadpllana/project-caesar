expert_time_estimate_hours = 9

relevant_experience = """
Having built or maintained the announcement side of assistive technology: the part of a screen
reader, a browser's accessibility bridge or a virtual screen reader for UI tests that turns live
region changes into speech. Familiarity with what aria-live, aria-atomic, aria-relevant and
aria-busy each ask of that layer, and with how much the specification leaves queueing,
interruption and repetition to the implementation. Comfort with keeping a model of what the
listener has actually heard rather than what the page emitted, with speech that can be cut off
halfway and has to give back what it had not finished saying, and with making the cost of a tick
proportional to what the tick touched on pages of tens of thousands of nodes.
"""

