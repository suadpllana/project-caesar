expert_time_estimate_hours = 9

relevant_experience = """
Having worked on the recovery side of a lock service: the tooling that replays a journal of
acquisitions, releases and heartbeats against a table of reentrant locks with first-come queues,
checks it against the service's own digests and an operator's audits, and after a loss has to
say which entries the evidence proves and where it stops proving anything. Familiarity with the
difference between a history that fits the evidence and one the evidence forces, with state a
fingerprint does not cover deciding what can come later, and with evidence that arrives well
after the gap it constrains. Comfort with exact search over histories, with settling a layered
graph forward and pruning it backward, and with bounding a search by what the evidence leaves
room for rather than by the first cap in sight.
"""

