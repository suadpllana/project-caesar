]

expert_time_estimate_hours = 10

relevant_experience = """
Having worked on the settings service of a fleet deployment tool: the part that composes the
layers a rollout applies, answers what a service would read at any point in that rollout, and
has to keep the answer defensible when somebody asks what a layer was deciding against.
Familiarity with the fact that copying a subtree of settings copies definitions rather than
values, so the copy goes on tracking what it names; that a definition's references have to stay
dated to where it was written or an audit of a half-applied rollout stops meaning anything; and
that the same definition can be circular seen from one point in a rollout and perfectly
ordinary seen from another. Comfort with demand-driven evaluation, with keeping every earlier
state of a tree readable without storing each of them whole, and with the difference between a
structure that is correct and one that is affordable at the size a real fleet's plan reaches.
"""

