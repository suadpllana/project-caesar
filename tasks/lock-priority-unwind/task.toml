relevant_experience = """
I work on embedded and real-time code where a handful of tasks share a processor and a few
mutexes, and where the thing that bites is never the algorithm but the lifecycle around it. The
pain this task is built from is one I would not have believed until I watched it: the standard
description of priority inheritance is correct, it is what the datasheet for a widely used
kernel describes, and it quietly assumes a task only ever holds one mutex at a time. The moment
a task holds two, restoring its priority on the first release hands the processor to whatever is
in between and the second waiter sits there. It does not deadlock, nothing is corrupted and
every task eventually finishes, so it does not look like a bug; it looks like a task being
slower than expected, and it is usually found by somebody staring at a trace wondering why a
deadline moved. The timeout case is worse, because the boost outlives the reason for it and
nothing in the system records why the holder is urgent. Knowing that all three of those are the
same question asked at four different moments is what I would want a new engineer on this to get
right, and it is not what the literature hands you.
"""

