[task]
name = "afterquery/lock-priority-unwind"

[metadata]
author_name = "Suad Pllana"
author_email = "suadpllana12@gmail.com"

difficulty_explanation = """
The memorised answer to this is one paragraph long, it is correct, and it is not enough.

Ask a strong engineer to fix priority inversion and they write transitive priority inheritance
without looking anything up: a task is worth its own priority or the most urgent task queued on
a mutex it holds, whichever is greater, iterated to a fixed point so the urgency travels a chain,
recomputed at every event so a boost dies with the reason for it. That is the right answer to the
question the literature asks. It handles the three shapes the shipped policy gets wrong - a
holder of two mutexes that releases one, a waiter blocking on a holder that is itself blocked, a
wait that times out - and a solver who writes it has done real work and is still wrong here,
because of something that is in rt/core.py and in no write-up.

This kernel does not hand a mutex over. Releasing one leaves it free. The task at the head of its
queue is woken and is the only task permitted to take it, and it takes it later, when the
scheduler next picks it. The engine spends real ticks in that state - `["rel", 10, 4, 1]` and
`["acq", 11, 1, 1]` on the shipped case file are a tick apart, and on a wrong policy they are
twenty apart. For as long as it lasts, the tasks queued behind the head are waiting for a task
that holds nothing at all, and a policy that reads holders finds nobody there. It gives that task
its own priority, the task does not get the processor, and the queue behind it sits - which is
the same inversion the boost exists to prevent, now caused by aiming the boost at nobody.

The same fact takes the chain apart. What a waiter is waiting for is the holder of the mutex it
is queued on, and while that mutex is between owners it is the task at the head of the queue
instead, so a walk that follows holders stops dead there. And it is why a release moves two tasks
rather than one: the task letting go falls to whatever is still waiting on what it still holds,
and the task at the head of the queue rises to whatever is queued behind it. One moment, two
answers, opposite directions.

Three things make that hard to find rather than merely additional. The policy is told about three
moments and none of them is named for the state that matters. The argument the engine passes for
"the task being waited on" is zero while a mutex is between owners, so the natural implementation
does nothing and raises nothing. And the check a solver builds for themselves is the definition
they already believe, so it agrees with their code and passes.

That last one is the load-bearing part and it is measured rather than argued. This task was put
in front of three frontier agents on 2026-09-04 under an earlier design in which the mutex was
handed straight over, and three of three solved it in four or five tool calls, writing the fixed
point in their first message and confirming it with a fuzz harness whose oracle was the same rule
their policy implemented. That policy ships verbatim as cheat-the-policy-the-probe-wrote. Against
the engine as it now stands it fails six of the twenty-one written scenarios and 16.7% of drawn
ones, and its self-check still passes, because a holder-shaped oracle cannot see a mutex that has
no holder.

The fence closes on both sides, which is what stops the defensive rewrite. What a task is worth
is graded at every tick, so lifting a task higher than the rule allows fails exactly as leaving
it too low does. Four scenarios exist for that alone: a task blocking on a holder that already
outranks it, a task blocking at exactly the holder's priority, a policy that lifts anything with
a queue behind it to the highest priority in the system, and a policy that counts the task at the
head of a queue among the tasks waiting on it and therefore never comes down. All four ship as
cheats.

There is no oracle for any of it. The scheduler is deterministic and a solver can run it as often
as they like, but nothing in the environment says what the schedule should have been, and the
schedule a wrong policy produces looks entirely ordinary: every task finishes, no mutex is lost,
nothing deadlocks, and the only symptom is that one task waited longer than it should have behind
a task it outranks. The engine ships with no comments anywhere in it and its identifiers are in
the register of ordinary kernel code, which is deliberate: the queue discipline, what happens at
a release and what the three hooks are called at have to be recovered by reading behaviour rather
than by reading names.

Half the graded run is task sets drawn when the verifier starts, from a seed that does not exist
until then, so a policy that is right about the shapes somebody thought to write down and wrong
in general passes the written half and fails the drawn one.
"""

solution_explanation = """
The reference does what somebody who has debugged a real inversion does: it stops treating the
hooks as separate rules, and it reads the engine before it writes the policy.

Reading rt/core.py gives three facts. The scheduler picks the highest effective priority and
breaks ties by who became runnable first, so the only lever the policy has is that number. A
mutex goes to the waiter that has been queued longest rather than to the most urgent one, so the
task that gets it can be less urgent than one still queued behind it. And the release path does
not call acquire: it wakes the task at the head of the queue and leaves it queued, and the lock
path lets a task take a free mutex only when the queue is empty or that task is at the front of
it. Those two together are the whole of the second half.

From there the rule is one quantity rather than three. A task is worth its own priority, or the
most urgent task waiting for it, whichever is greater - where the tasks waiting for it are those
queued on a mutex it holds together with those queued behind it on a mutex that is free and its
to take. Every one of the three moments changes that same set, so the reference has one function
that recomputes a task's worth and all three hooks call it.

The chain is the second half and it is why the function does not simply return. Whenever a task's
worth changes it may change for whoever that task is itself waiting for, so the recomputation
walks and stops when it stops making a difference. Which task that is takes the same reading as
above: the holder of the mutex it is queued on, or the task at the head of that queue while the
mutex has no holder. Walking handles the rise and the fall with the same code, which is the
point: a release lowers a task, that lower value propagates, and the chain unwinds by the path it
was built.

A release is the one place two tasks move, and the reference settles both: the task letting go,
and whatever the queue on that mutex is now waiting for. The timeout needs no special case once
the rule is stated that way, and that is the argument that it was stated correctly.

Four alternative correct policies are kept in the authoring directory: one that solves the whole
assignment to a fixed point on every event the way the sealed model does, one that expresses the
same walk recursively, one that relaxes only the tasks with a queue behind them until nothing
moves, and one that walks the mutexes and pushes each queue's urgency onto whatever that queue is
waiting for, which is the same least fixed point computed in the opposite direction. All four
produce identical schedules and identical priority tables on all twenty-one written scenarios and
on two hundred drawn ones, which is the evidence that the schedule is a property of the rule and
not of how the rule is applied.

The whole reference is about ninety lines in one file and runs in well under a second.
"""

verification_explanation = """
The rebuilt policy is driven through twenty-one written scenarios, each aimed at one reading of
the rule, and through a batch of task sets drawn at verification time. Everything is checked with
no partial credit.

Four things are compared, all of them produced by rt/core.py, which is not an editable artifact.
The schedule: which task held the processor at every tick. What every task was worth at every
tick. The lifecycle log: acquisitions, blocks, releases, abandoned waits, sleeps and completions,
in order. And the tick each task finished on. A wrong priority is not graded as a wrong number in
isolation; it is graded through the schedule it produced, which is what makes the consequence
rather than the intent the thing being measured.

Ground truth is re-proved on every run by a sealed model that shares no code with the engine. The
model is a second scheduler written to the same published semantics, and it differs in the one
place that matters: where the engine's policy patches priorities incrementally as events arrive,
the model solves the whole assignment as a fixed point over every task after anything moves. A
submission that patches the wrong task, stops at the first link of a chain, reads holders where a
mutex is between owners, or leaves a boost standing after the waiter that caused it has gone
cannot agree with a fixed point of the definition.

Every wrong reading shipped as a cheat is required to be separated by a written scenario rather
than only by drawn ones, and that is checked mechanically rather than asserted: per-rule coverage
on paper is not coverage, and a misreading that survives the whole written set and dies on a
handful of drawn ones is indistinguishable from bad luck under all-or-nothing grading. Two of the
twenty-one scenarios exist because a reading survived the other nineteen and a search over drawn
shapes found the case that separates it.

Deliberately outside the graded set: the sequence of priority changes a policy makes, and how it
is structured. Two correct policies may reach the same value by different routes and at different
moments inside a tick, so grading the route would grade an implementation choice rather than
behaviour, which is the run-audit failure this repo has already had once. The engine records
priority changes in a separate list that is reported for the solver's benefit and is never
compared. What is compared is the state at each tick, which the rule pins exactly and which every
correct policy agrees on. The four alternative correct implementations are required to score 1
and all four do, on identical schedules.

The anti-cheat design is the drawn half and it replaces a work journal entirely. A submission
runs inside the same process as the scheduler that measures it, so a policy that recognises a
scenario and hands back a remembered answer is the attack to beat. Here there is nothing to
remember: half the graded task sets are generated from a seed minted by the verifier at the
moment it starts, and their expected schedules are computed by the sealed model right then rather
than read from a file. Two such cheats ship, because they test different layers. One replays the
recorded priority tables straight onto the tasks, rebinding nothing and rewriting nothing, so no
attestation sees it at all; it fails on eight drawn task sets it has no numbers for, and on one
written scenario as well, because holding the numbers is not the same as reaching them at the
moment each one was reached. The other is the reference itself with the report substituted, and
it is caught by the fingerprint and by nothing else, which is the only way to know that layer
fires: a probe built on the shipped policy would fail on its answers and prove nothing about the
attestation it was aimed at.

The rest of the attestation is ordinary and necessary because the policy runs in the same
interpreter as the scheduler. The scheduler functions are fingerprinted as they actually
executed, once as loaded and once when the scenario ends, against digests the grader derives by
compiling the pristine sources without executing any of them, so rebinding a function is caught
the way rewriting its file already was. The executed tree is hashed against the untouched copy
afterwards, so every file outside the one declared artifact is proved byte identical. The run
reports through a descriptor root opened before privilege was dropped, and it carries a per-run
nonce.

Twenty-five cheats were run against it and all scored 0, each failing on the axis it was aimed at
rather than incidentally. Thirteen are the reference with exactly one decision changed:
restoring to the task's own priority on release, stopping at the first link of a chain, ignoring
an abandoned wait, letting priorities rise and never fall, valuing a waiter at what it started as
rather than what it is worth, lifting anything with a queue behind it to the top of the system,
recomputing the task that blocked instead of the one it is waiting for, aiming every
recomputation at the holder of a mutex, counting only the tasks queued on what a task holds,
walking the chain by holders alone, treating a task at the head of a queue and a task holding a
mutex as two rules instead of one quantity, counting the task at the head of a queue among the
tasks waiting on it, and moving only the releasing task at a release. Two are policies frontier
agents actually wrote against this task, kept verbatim rather than reconstructed: the transitive
inheritance keyed on holders that three of three wrote against an earlier design, and the reading
that lends to every task queued ahead of you, which two of three wrote against this one and both
named as the single thing they had to guess. That second one is why the brief settles it: it
produces the identical schedule, the identical event log and the identical finish times, so it is
the same policy with different bookkeeping, and a graded number that two behaviourally identical
implementations may disagree on is a coin flip rather than a test of anything. One is the memorisation attack
described above. The remaining eight are reward-tamper and isolation probes built on the shipped
policy rather than on the reference, because a probe built on the reference does the real work
and would score 1 legitimately: a double-forked process writing the reward after the run, a
planted report, a planted report followed by a hard exit, a privilege probe, an attempt to read
the recorded schedules from inside the run, a rewrite of the scheduler in the tree being run, a
sweep of everything the run's uid can reach, and a read of the scenario set, which the run is
allowed to do and which produces nothing because half the graded set does not exist yet.

The run happens as an unprivileged uid in its own session under a wall clock timeout, against a
tree it cannot write; the reward channel is root-owned and locked to 0 before it starts; the
recorded schedules, the sealed model and the grader are root-only; and survivors are swept
between the run and the grading. Grading runs afterwards as root and never executes anything the
agent wrote.
"""

category = "Software"
subcategory = "Systems"

tags = [
  "priority-inversion",
  "priority-inheritance",
  "mutex-contention",
  "preemptive-scheduling",
  "real-time-kernels",
]

expert_time_estimate_hours = 7

relevant_experience = """
I work on embedded and real-time code where a handful of tasks share a processor and a few
mutexes, and where the thing that bites is never the algorithm but the lifecycle around it. Two
pains this task is built from, and only one of them is in the literature. The first is that the
standard description of priority inheritance quietly assumes a task only ever holds one mutex at
a time; the moment it holds two, restoring its priority on the first release hands the processor
to whatever is in between and the second waiter sits there. The second is the one I would not
have believed until I watched it. A queued lock does not hand ownership over at the release - it
marks the next owner and lets it take the lock when it is scheduled, and in between there are
real ticks where a queue is waiting on a task that owns nothing. Every piece of inheritance
bookkeeping I have seen written from first principles keys on the owner field, so in that window
it lends urgency to nobody, and the task that was supposed to be rescued sits behind a
mid-priority job with the lock sitting free in front of it. It does not deadlock, nothing is
corrupted and every task eventually finishes, so it does not look like a bug; it looks like a
task being slower than expected, and it is found by somebody staring at a trace wondering why a
deadline moved. Knowing that a release is two events, and that "who is this queue waiting for" is
not the same question as "who owns this lock", is what I would want a new engineer on this to get
right, and it is not what the literature hands you.
"""

