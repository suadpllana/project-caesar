expert_time_estimate_hours = 10

relevant_experience = """
Having worked on the data path of a pretraining stack: the loader that blends several corpora to
fixed proportions, the token cap that quietly drops the long tail of a source, and the checkpoint
seam where a loader run ahead of the trainer disagrees with it about what was consumed.
Familiarity with the fact that a resumed run owes the samples the optimizer never saw and not the
ones the loader had already drawn, that a per-source epoch is not a run epoch, and that a mixture
whose sources carry epoch limits stops being one mixture part way through a run. Comfort with
deriving a loader position arithmetically instead of replaying it, with per-epoch shuffles that
have to be reproducible from a seed alone, and with the difference between a sampler that is
correct and one that can still be resumed at the size the run actually reaches.
"""

