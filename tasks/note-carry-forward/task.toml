schema_version = "1.3"

artifacts = [
    "/app/note/board.py",
    "/app/note/rule.py",
]

[task]
name = "afterquery/note-carry-forward"

[metadata]
author_name = "Suad Pllana"
author_email = "suadpllana12@gmail.com"

difficulty_explanation = """
Who does this for a living: an engineer on a code review tool, keeping comment
anchoring correct as revisions land on a branch. It is the part of a review
product that quietly breaks and that nobody notices until a reviewer is asked
about a line they never wrote about.

The graded streams are synthetic. Each revision is a list of short opaque
tokens rather than real source, generated from a seed with a small pool so
lines repeat heavily, and the hand-written ones use a few lines of Python-like
text only where the brief quotes them. That is not a fair sample of production
files, and it is deliberate: repetition is the condition under which the
question this task asks has more than one defensible answer, and a realistic
corpus of mostly-distinct lines would make almost every stream trivial. The
mechanism it exercises is real; the distribution is chosen to reach it.

The tree ships the engine that pins a change script, so nobody writes a diff
and there is no pure function to reimplement. Two properties of that engine
carry the weight and neither is stated anywhere.

The first is that the pinned script does not compose. The script from r0 to r2
is not the script from r0 to r1 followed by the script from r1 to r2, because
the tie-break that picks one shortest script out of the many a repetitive file
admits is settled against the pair in front of it and nothing else.

The second is what the engine calls one change. Runs of moves standing fewer
than three kept lines apart are one change and swallow the kept lines between
them, which is the grouping `scr/grp.py` uses and which its only public
function throws away: `spans` reports the lines a change came to rest on and
drops the moves that say where each of them came from. A board that has to
know which line replaced which cannot use it and has to take the grouping off
the walk again, off-by-one and all.

Both editable files ship wrong and the decisions behind them are independent.
`note/board.py` rebuilds each note by asking for the script from the revision
the note was opened at straight to the head. It is stateless in exactly the
way the brief demands, it is one call per note instead of one per revision,
and it looks like the careful answer. It moves 81 per cent of graded streams,
and its failure looks like success: a note whose line was deleted two
revisions ago and whose text was later typed again comes back to life on the
new line. That is `/app/streams/guard.txt`, observed.

`note/rule.py` is wrong three times. It rebuilds the surviving-line mapping
from its own longest-common-subsequence walk, which is the same length as the
tool's script and disagrees with it about which copy of a repeated line
survived (76 per cent of streams; the standard library's matcher is 74 per
cent). It treats a change as the lines the script added, where a change
reaches across the kept lines between its runs, so a line can come through a
revision untouched and still be inside the change a reviewer has to read
(75 per cent). And it retires every line the script dropped, where a line the
change replaced is not gone at all but standing where the change put it
(50 per cent).

That last one is where the task turns, because it invalidates the natural
implementation of the first. Reading the mapping off the walk's kept steps is
the obvious answer and it is the answer to a narrower question. Pairing a
change's drops with its adds means deciding what one change is, and the two
readings a solver reaches for first - cut at every kept line, or close a
change one kept line later than the tool does - are wrong on 39 per cent and
on a small but enumerated share of streams. Nothing in the tree answers that
question; `grp.spans` looks as though it does and reports a different shape.

The shipped tree already matches the rule on 40 of 319 streams, so the chain
is four decisions rather than the three a reading of the two files suggests.
None of them is visible from a stream a person writes out by hand to check
themselves, because each needs a line to repeat, a revision to sit between two
others, or a drop and an add to stand a particular distance apart. The brief
says all three situations happen and says nothing about what any of them
costs. A solver who fixes the board and leaves the mapping alone gets every
count right and the wrong lines.
"""

solution_explanation = """
Two files change and neither is long.

`note/rule.py` takes both answers off the script the tool itself settled:
the surviving-line mapping is read from that walk rather than rebuilt, and a
line counts as inside a change when it falls in one of that script's spans
rather than when the script added it.

`note/board.py` walks the store. From the first revision to the head it
settles one script per step, carries every live note through it, retires the
notes whose line the script dropped, raises the notes that came to rest inside
a change, admits the notes opened at that revision, and lets the older note
absorb the newer where two came to rest on one line. Event order inside a
revision is fixed by the brief so that two correct boards cannot disagree
about the log.

About sixty lines across the two files. It is not clever; the whole of it is
knowing that the walk cannot be skipped and that the mapping cannot be
rebuilt.
"""

verification_explanation = """
Graded, all or nothing: the live note table at the head of every stream, and
the ordered log of retirements, raises and absorptions on the way there.

Thirteen streams are written out by hand, one per rule and one per corner where two
of them meet. Three hundred more are generated from a seed the run is handed,
so the streams a submission is graded on are not the streams it was written
against, and those are settled at grading time by `tests/oracle.py` -- a
second model of the rule, written forwards where the environment's engine
works backwards, sharing no code with either the environment or the reference.
A test holds that sealed model to the recorded ground truth on every
hand-written stream before any generated answer counts.

Not graded: how the board stores anything, what it computes first, how many
times it walks the store. There is no work counter anywhere in this task.

The run is unprivileged. `tests/test.sh` locks the reward channel before
anything else happens, assembles a work tree from a pristine copy baked into
the verifier image, overlays only the two declared artifacts, and runs the
board as uid 1002 under `setsid --wait` with the output handed down as an
inherited descriptor opened by root. `tests/reap.py` kills whatever that
account left behind by walking /proc, because pkill is not in the image.
pytest then grades as root and never imports anything the submission wrote. A
test compares every frozen file in the executed tree against the pristine copy
byte for byte, counting what it compared first, so that a comparison against a
directory that is not there cannot pass by looking at nothing.
"""

category = "Software"
subcategory = "Algorithms"

tags = [
    "diff-alignment",
    "revision-history",
    "state-reconstruction",
    "differential-testing",
]

expert_time_estimate_hours = 8

relevant_experience = """
Comfort with edit scripts and longest common subsequences, and specifically
with the fact that a shortest script is not unique and that a tie-break has to
be settled somewhere. Experience maintaining state across a history rather
than recomputing it from the endpoints. The task is ordinary Python and needs
no library beyond the standard one.
"""

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[agent]
