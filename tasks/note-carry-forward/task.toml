schema_version = "1.3"

artifacts = [
    "/app/note/board.py",
    "/app/note/rule.py",
]

[task]
name = "afterquery/note-carry-forward"

[metadata]
author_name = "Suad Pllana"
author_email = "suadpllana12@gmail.com"

difficulty_explanation = """
Who does this for a living: an engineer on a code review product, keeping
comment threads attached to the right code as revisions land on a branch. It
is the part of a review tool that quietly rots, and every team that has shipped
one has an issue tracker full of threads that drifted, vanished or came back.

The graded streams are synthetic. Each revision is a list of short opaque
tokens rather than real source, drawn from a pool of two to four so lines
repeat heavily, and the hand-written streams use a few lines of Python-like
text only where the brief quotes them. That is not a fair sample of production
files, and it is deliberate: repetition is the condition under which the
alignment question has more than one defensible answer, and a realistic corpus
of mostly-distinct lines would make most streams trivial. The mechanism is
real; the distribution is chosen to reach it.

The tree ships the engine that pins a change script, so nobody writes a diff.
What the agent writes is the board: a state machine over threads that have
spans, states and a history, driven by a walk over the store. Twelve distinct
decisions are graded, and every one of them has a natural reading that is
wrong. Measured against the reference over 300 generated streams, by
`authoring/readings.py`:

  the mapping rebuilt from an ordinary LCS walk          91%
  the mapping taken from the standard library's matcher  93%
  a change read as the lines the script added            91%
  merging on equal spans instead of on overlap           82%
  an outdated thread dropped off the board               68%
  the older thread keeping its own span, not the union   66%
  the whole span required to be inside the change        51%
  raising every revision the thread stays caught         49%
  merging in one pass instead of to a fixed point        47%
  the merged thread not dragged open by an open half     43%
  a resolved thread raised along with the rest           27%
  an answered thread not reopened when it is raised      24%

Four of those need something a board cannot get from the revision in front of
it. Raising is edge triggered, so it needs the previous revision's verdict for
that thread. Reopening needs the state a reply left behind. Merging needs a
fixed point, because a union reaches threads neither half reached. And the
mapping has to come off the script the tool settled rather than any equally
short one, which is only visible on files that repeat themselves.

The two that are hardest to see are the last two. A one-pass merge is right on
every stream where no union reaches a third thread, which is most of the ones a
person writes out by hand; and a rebuilt mapping agrees with the tool about how
many lines survived and disagrees about which, so every count a solver checks
comes out right.
"""

solution_explanation = """
Two files, about a hundred and forty lines together.

`note/rule.py` answers three questions off the script the tool settled: which
lines a revision keeps, whether a change reaches any line of a span, and
whether two spans overlap.

`note/board.py` walks the store from the first revision to the head, carrying
three things a board that recomputed from the endpoints could not: the span
each thread has been squeezed down to, the state its replies and resolutions
left it in, and whether the revision before had already caught it. At each
revision it carries the spans, outdates the ones that emptied and leaves them
on the board, raises the threads the change has newly reached and reopens the
answered ones among them, admits the threads opened there, applies the replies
and resolutions, and merges overlapping spans to a fixed point with the older
thread taking the union.

The merge outcome does not depend on the order the pairs are found in - the
spans settle into the connected groups of the overlap graph - and the log names
the thread that ends up holding each span, so a board that merges by components
writes the same log. `authoring/variants/ok-merge-by-components` is that board
and it scores 1.
"""

verification_explanation = """
Graded, all or nothing: the live note table at the head of every stream, and
the ordered log of retirements, raises and absorptions on the way there.

Seventeen streams are written out by hand, one per rule and one per corner where two
of them meet. Three hundred more are generated from a seed the run is handed,
so the streams a submission is graded on are not the streams it was written
against, and those are settled at grading time by `tests/oracle.py` -- a
second model of the rule, written forwards where the environment's engine
works backwards, sharing no code with either the environment or the reference.
A test holds that sealed model to the recorded ground truth on every
hand-written stream before any generated answer counts.

Not graded: how the board stores anything, what it computes first, how many
times it walks the store. There is no work counter anywhere in this task.

The run is unprivileged. `tests/test.sh` locks the reward channel before
anything else happens, assembles a work tree from a pristine copy baked into
the verifier image, overlays only the two declared artifacts, and runs the
board as uid 1002 under `setsid --wait` with the output handed down as an
inherited descriptor opened by root. `tests/reap.py` kills whatever that
account left behind by walking /proc, because pkill is not in the image.
pytest then grades as root and never imports anything the submission wrote. A
test compares every frozen file in the executed tree against the pristine copy
byte for byte, counting what it compared first, so that a comparison against a
directory that is not there cannot pass by looking at nothing.
"""

category = "Software"
subcategory = "Algorithms"

tags = [
    "diff-alignment",
    "revision-history",
    "state-reconstruction",
    "differential-testing",
]

expert_time_estimate_hours = 8

relevant_experience = """
Having built or maintained the anchoring half of a code review product, or
anything else that has to keep annotations attached to text across revisions.
Comfort with edit scripts and longest common subsequences, and specifically
with the fact that a shortest script is not unique, so a tie-break has to be
settled somewhere and two settlements disagree about which copy of a repeated
line survived. Experience carrying state across a history rather than
recomputing it from the endpoints, and the habit of asking whether a merge rule
needs a second pass.
"""

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[agent]
timeout_sec = 14400.0

[environment]
build_timeout_sec = 900.0

cpus = 2
memory_mb = 4096
storage_mb = 10240

gpus = 0
