  "page-allocator",
]

expert_time_estimate_hours = 10

relevant_experience = """
Having worked on the memory manager of a token-generation service: the part that decides which
request is resident, which pages of its cache stay in the pool while it runs, how much of a new
prompt is already there, and which page the pool takes back when it has none free. Familiarity
with the fact that a request whose residency is narrower than its history leaves the oldest
pages in the pool in the middle of its own chain, that taking one of those back costs every
page below it and not just that page, and that what a preemption gives back is reusable rather
than free. Comfort with fixed-page allocators, with reference counts over shared prefixes, and
with the difference between a structure that is correct and one that is affordable at the size
the service actually runs at.
"""

