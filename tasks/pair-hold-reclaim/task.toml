  "dependent-cleanup",
  "least-fixed-point",
  "object-lifetime",
  "differential-testing",
]

expert_time_estimate_hours = 8

relevant_experience = """
I work on runtimes and storage engines, and the lifetime bugs are the ones that cost me
weeks rather than hours. This task is built from one of them. We had a cache whose entries
were held only while the thing they were derived from was still held, which is an ordinary
enough arrangement until you notice that the condition is answered by the same computation
that is trying to use it, and our sweep answered it with one pass over the table. It was
right for two years because nothing chained. When something finally did, the symptom was
not a crash: it was a handful of entries disappearing a cycle early, under load, with no
error anywhere.

The part I would want a new engineer to get right is the second half, because it is the one
the textbooks skip. Cleanup hooks run inside the sweep and they change the answer the sweep
started with - they hand things back, and they also let things go, and a hook that releases
the last reference to something else with a hook of its own means the sweep is not finished
when it thinks it is. The fix that feels obvious is to recompute once at the end. That is
correct for every test anyone writes and wrong the first time two hooks are chained in
production. Ordering them is the same bug wearing a different hat, and the case that gets
you is the one where a dependency runs through a conditional entry whose other key is held
from somewhere outside the group being torn down, so the thing you are about to clean up
can still reach something you already cleaned.
"""

