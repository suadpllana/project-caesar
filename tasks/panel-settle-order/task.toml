expert_time_estimate_hours = 8

relevant_experience = """
I build and maintain the incremental recomputation layer behind an internal dashboard
product, which means most of my hard bugs are ordering bugs in a dependency graph that
changes while it is being walked. The one this task is built from cost most of a week. A
derived value read one of two upstream series depending on a mode flag, and when the flag
and the newly selected series changed in the same update, the value was recomputed from the
old series and published before the series it had just switched to had been recomputed. It
was right again a moment later, so nothing was ever visibly broken; what shipped downstream
was one extra revision carrying a number that had never been correct, and an alert fired on
it about once a fortnight. What made it expensive is that the obvious fix - compute the
dependency levels once and walk the graph in level order - is right in every situation you
would write a test for, and wrong exactly when a conditional changes which side it reads in
the same pass that updates that side. The interaction with a watcher that writes back into
the graph is the same bug wearing a different hat, and it is the piece the frameworks
themselves keep getting wrong.
"""

