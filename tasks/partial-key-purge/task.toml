relevant_experience = """
This task is database-internals work: referential actions for composite foreign keys under MATCH
SIMPLE, FULL and PARTIAL, constraint timing that tells RESTRICT from NO ACTION within one
statement, a cascade depth limit counted in rounds, and a delete-impact audit that has to agree
with the delete exactly. Building it meant writing the engine several times - a brute-force
transcription of the rules, a sealed model on Kosaraju components with bounded forward deletes,
and a reference on Tarjan components with layered rounds - plus two more correct variants, and
making all of them agree on generated stores with merges, loops and cascades near the limit, then
measuring a per-row replay against the deleter-set audit at thirty-six thousand rows. Comfortable
with least fixed points over sets of rows rather than per-row walks, with why dominator trees and
reachability each fail when a row can go with either of two parents, and with keeping a verifier
sound when the code it grades runs inside it.
"""

