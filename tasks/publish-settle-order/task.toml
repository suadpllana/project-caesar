  "/app/link/walk.py",
  "/app/link/view.py",
  "/app/link/pick.py",
  "/app/link/site.py",
  "/app/link/want.py",
  "/app/link/drop.py",
]

[task]
name = "afterquery/publish-settle-order"

[metadata]
author_name = "Suad Pllana"
author_email = "suadpllana12@gmail.com"

difficulty_explanation = """
The host is small and every rule is in the brief. What is not in the brief is how to satisfy two
of them at once, and that is where the work is.

Resolution is not a property of the publication order alone. A call reaches the first publisher
in that order which the caller can see, and what a caller can see is the public publications plus
the ones in its own scope, so the answer depends on who is asking. A table from name to publisher
answers the wrong question. Filtering one per-name list by visibility answers the right one and
walks past every publication the caller cannot see, which on the graded set is thousands of them
per call. What makes it cheap is a property of the order rather than a data structure: the
publications a caller may read are two subsequences of one order, so the answer is whichever of
the two heads was published first, and the buckets have to be kept per scope and per name for
that to be true. Kept that way the whole graded set settles in 1.9 seconds; one of its three
wide programs alone takes 47 seconds filtered from a single per-name list and 126 seconds
scanned from the order, against a 60 second limit for all 366 programs. Promotion is the same property from the other side - `act` on a unit that is up
in a scope moves it to the public bucket at the place its serial gives it, not at the back, and a
list that appends is wrong for every caller whose other candidate came up in between.

The teardown is the second. The rule is ordinary - a unit stays while it holds a hold or a live
unit needs it as a dependency - and read literally it is a scan of the live set per retirement,
which a forest of eighteen thousand units turns into a quadratic walk. The ledger that replaces it is
easy to write and easy to get subtly wrong: it has to count units rather than edges, it has to
give the count back when a unit goes down and not before, and the queue of candidates it feeds
has to be ordered by the publication serial rather than by position, because positions shift as
units are spliced out. The tempting simplification is that a cascade only ever frees units
earlier in the order. That is true of every ordinary teardown and false when an ordering edge
runs backwards through a dependency cycle, where the unit freed by a retirement was published
after it. One teardown program takes 46 seconds when the retention question is answered by a
scan and 52 seconds when the candidates are found by rescanning the live set; the ledger and the
queue answer the same programs in under a second.

Both structures are maintained by the same two events, publication and retirement, and both need
the same serial - which is also the only thing that separates a publication from the one the same
record carried before it, because `reg/tab.py` keeps one record per name for the whole run and
hands the same object back after a retirement. A submission that stores the record, or the
record's `live` flag, revives a use that has to stay dead.

Around those sit the ordinary decisions: publication and startup interleaved per unit, so a
startup call inside a dependency cycle resolves against a partial order; what a unit names walked
in declaration order whether it is a dependency or an ordering edge; a call that finds nothing
settling nothing; a unit that comes up having settled nothing. All six editable modules ship
wrong, so running the host confirms nothing about any one of them, and the two limits are the
only feedback a wrong structure gets.

Identifiers are in a legacy register - `seq`, `pubs`, `boots`, `needs`, `uses`, `link/`, `reg/` -
short but never misleading, and no name misdescribes what it holds. That is a choice about the
register of real runtime code rather than an obstacle: each is recoverable from what calls it.

The programs are synthetic, in ten families, with dependency cycles, fallback publications,
ordering edges, private scopes, promotion, retire-and-return and cascading releases concentrated
far above their natural rate. In a working host they are rare, and they are exactly where this
class of bug lives.
"""

solution_explanation = """
Six modules, settled in the order the rules force rather than one that is tidy.

`walk.py` brings a unit up. What it names comes first, in declaration order and without regard to
which kind of edge it is, skipping any that is already up or is itself part way up, which is what
makes a cycle terminate. The unit is then published at the back of the order and its startup
calls run after that, so a startup call sees the order as far as it has been built. Publication
mints a serial, which is doing three jobs: it separates this publication from the one the record
carried before, it orders the buckets `pick.py` keeps, and it is the key the cascade takes
candidates by. `act` publishes public, `open` publishes the whole closure into one fresh scope,
and `act` on a unit that is up in a scope moves that publication to the public side where it
stands.

`view.py` owns the scope model and answers one question for `pick.py`: which buckets this caller
may read. `pick.py` keeps one list per scope and name in publication order, and takes the earlier
of the two heads. Appending is safe because the order only grows at the back; promotion inserts
by serial, because the promoted publication keeps the place it already had.

`site.py` runs a call: an open use resolves once and settles on the publication it found, serial
and all; a settled use is never resolved again and answers dead as soon as the serial it carries
is not the serial on the record; a call that found nothing settles nothing.

`want.py` keeps the retention ledger - a count per name of the live units that need it as a
dependency, counted once per unit however many times that unit names it - and `drop.py` gives a
hold back and runs the cascade over a queue ordered by serial, which a unit joins when it is
published with nothing wanting it, when the last live unit that needed it goes down, or when its
hold is given back. A candidate found still wanted when its turn comes is dropped; whatever makes
it unwanted later puts it back.

An expert works in that order because each module consumes the one before it: the walk decides
the order and the scopes, those decide the answer, and the answer decides what a retirement
breaks. The same contract is implemented three further ways in the authoring set - the whole host
in one module, a walk from an explicit stack with the buckets keyed by serial, and a ledger built
from sets with the candidate queue kept by bisect - so the shape is visibly not what is graded.
"""

verification_explanation = """
Only the six files under `/app/link/` are taken from the agent. The verifier lays them over its
own pristine copy of the tree, so nothing else the agent may have touched can change what a
program prints, and every trace is compared line for line.

Correct is defined twice over. Thirty-six hand programs, one per graded decision plus the
must-still-work side of each fence, are checked against `gt.json`, frozen before the grading file
was written; the grader first asserts that the sealed model still reproduces `gt.json` exactly,
so a model that had drifted could not quietly redefine correct. Three hundred and sixty-six
further programs are generated inside the verifier from a seed drawn after the agent's container
is gone, across ten families that concentrate cycles, fallback publications, ordering edges,
scopes and promotion, retire-and-return and cascading releases. A submission cannot have seen
them, so fitting the shipped examples fails, and so does carrying an answer key.

The fences run both ways. Settling too eagerly fails `miss-open` and `miss-boot`; never settling
fails `stick-dead`. Treating a returning name as the unit that left fails `same-name` and
`fresh-instance`. Reading every scope fails `scope-no-republish`; reading only your own fails
`scope-public-first`. Retiring too much fails `dep-holds` and `rel-early`; retiring too little
fails `casc-order`, `chain` and `pre-no-keep`; freeing a candidate and not looking at it again
fails `cycle-soft`.

Forty-three cheats score 0. Thirty-two are wrong readings, twenty-eight of them caught by the
enumerated case named for that reading and four by the execution limit alone - two resolutions
and two teardowns that are exactly correct and too slow. One is a forgery carrying the frozen
answer for every enumerated program, which passes all thirty-six and fails on the programs it
could not have seen. The other ten are probes: the answer key, a hijacked dispatcher, a planted
report, a report forged after the worker exits, a grader crash, malformed records, privilege, a
shrunken population, and a rewrite of the parts of the tree the verifier does not take. Three
independently written correct hosts score 1.

The submitted host runs unprivileged, in its own session, under the wall clock that is also the
task's execution limit. The model and the frozen answers sit in a directory that uid cannot read,
so code running inside the verifier cannot compute its answers from them. The reward defaults to
0, is written last by the privileged stage into a root-owned directory locked before any agent
code runs, and anything the run left behind is reaped by owner first.
"""

category = "Software"

subcategory = "Systems"

tags = [
  "extension-host",
  "name-resolution",
  "visibility-scopes",
  "instance-identity",
  "reference-counted-teardown",
  "incremental-index",
]

expert_time_estimate_hours = 10

relevant_experience = """
Having built or maintained the loading half of an extension host: something that brings units of
code up in dependency order, lets them publish names that other units call, keeps one unit's
publications out of another's way, and has to take them down again without breaking whatever is
still running. Familiarity with the fact that a resolution is not a function of the current state
but of the moment it was made and of who made it. Comfort with reference-counted teardown and the
cascade one release sets off, with the difference between an edge that orders a load and an edge
that keeps a unit alive, and the habit of asking whether the thing that came back is the thing
that left.
"""

