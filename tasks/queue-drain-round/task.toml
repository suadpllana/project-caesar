relevant_experience = """
I have spent years on payment and settlement plumbing, and the rounds are where the money
actually gets stuck. The bug this task is built from cost us a fortnight. Our house paid
what each member could afford out of its own balance and gave up on the rest at the cut-off,
which is correct and which quietly strands every position where two members are waiting on
each other - and members do wait on each other constantly, because the same trade that owes
one way this morning owes the other way this afternoon. The symptom was not an error. It was
a queue that emptied more slowly than anybody could explain, and a handful of instructions a
day going unsettled with the money sitting right there on the other side of the ring.

The half I would want a new engineer to get right is the second one, because it is the half
that survives the first fix. Once you see that a ring has to move as one, the natural thing
is to net the fronts of the queues, put that through, and go round again. That clears every
ring anybody draws on a whiteboard, and it does nothing at all for the member who has to
make two payments before its own money comes back, which is the ordinary case for anybody
with more than one counterparty. And the cut-off is the same trap wearing a different hat:
cancelling everything that missed the round is one line of code and it throws away
instructions that were only stuck behind the one that could not be funded.
"""

