]

expert_time_estimate_hours = 10

relevant_experience = """
Having worked on the write path of an offline-capable client for a shared store: the queue of
changes a user makes while the connection is down, the order they can be sent in once records
depend on ids the server has not handed out yet, and what has to be thrown away when the server
refuses one of them. Familiarity with the fact that the queue stops being first in, first out the
moment anything is held back, that a change made against what the user could see has to be
re-settled against what the server has since said, and that the answer to what a removal takes is a
question about the tree at the moment the change is replayed rather than a set recorded when it was
made. Comfort with deriving a view from a base and a log, with keeping that derivation affordable
when the log is long and the questions are frequent, and with the difference between a structure
that is correct and one that is correct at the size a real client reaches after a day offline.
"""

