]

[task]
name = "afterquery/reach-pair-sweep"

[metadata]
author_name = "Suad Pllana"
author_email = "suadpllana14@gmail.com"

difficulty_explanation = """
The collector is a generational one, and the work is distributed through a runtime the agent has
to read before the plan exists. Five files under `/app/col` decide roots, reachability, finalizer
retention, ageing and clearing; four ship wrong. What makes them hard is not their length but
that each consumes the previous one's answer, and several facts they depend on are behaviours of
the surrounding tree rather than statements in the brief.

The sharpest is the remembered set. `/app/mem/rset.py` records a (source, field, value) triple
when a field of an old object is given a nursery value, and never revisits it. A minor collection
cannot trace old space, so those entries are its only route to nursery objects held from outside -
but the recorded value is a snapshot. Overwrite the field and the triple stays, naming an object
nothing points at. The brief says the remembered set is where a minor collection finds those
roots; it does not say the record goes stale, because that is readable in eleven lines of
`rset.py` and nowhere else. Trusting the record keeps dead objects alive; ignoring the set
releases live ones. Both ship as cheats and both fail.

Then the couplings. The finalizer queue is settled against what the walk reached, before any
keeping is granted, so an object reachable only from another finalizable object is still
finalized this cycle. What is kept to run a finalizer is not what survived, so those objects do
not age and cannot promote, and a weak reference to one clears while the object is still there. A
minor collection may say nothing about old space, so it neither releases old objects nor clears
references into it - yet an old pair key is reached for the whole of that collection, because
nothing it did could show otherwise. Get ageing right and promotion changes which space an object
is in, which changes what the next collection may trace, which changes the remembered set. There
is no order in which these can be settled one at a time.

The pair table adds a measured resource boundary on top. Its fixed point is exactly correct when
settled by rescanning the table until a sweep adds nothing, and on a table written back to front
that costs the table size times the chain depth. On the graded set, indexed by key: 0.7 seconds.
By rescanning: past 800 seconds, against a stated 60 second limit. Same answers.

The data is synthetic: heap programs over integer ids, six families, with pair and finalizer
configurations concentrated far above their natural rate because in the wild they are rare and
are exactly where this class of bug lives. Real heaps are millions of objects where ours are
thousands. The shape is faithful; the density is deliberately adversarial.

Identifiers are in a legacy register - `objs`, `flds`, `fin`, `rset`, `pins` - short but never
misleading, and no name misdescribes what it holds. That is a choice about the register of real
runtime code, not an obstacle: each is recoverable from what calls it.

This is what runtime engineers on a language implementation do. Generational collectors, write
barriers, weak maps and finalizer queues are where collector bugs concentrate, and the symptom is
an object freed while something still points at it, surfacing far away as corruption.
"""

solution_explanation = """
Five modules, settled in a fixed order because each changes what the next may look at.

`plan.py` chooses the roots. For a full collection that is everything named by the frame slots,
the global table and the handle stack. For a minor one it is the nursery objects among those,
plus the nursery objects reachable from old space - and it finds the second kind by walking the
remembered set and re-reading each recorded field, because the value in the record is a snapshot
that nothing keeps current.

`scan.py` walks reachability with the pair table folded in, indexed by key so each pair is
followed the moment its key arrives and never looked at again. During a minor collection only
nursery objects join the set, but an old key is ready before the walk starts and stays ready.

`keep.py` settles the finalizer queue against that walk alone, before any keeping is granted,
then computes what those finalizers keep as a second walk blocked from anything already reached,
so the two sets stay apart. `age.py` ages what the walk reached and promotes at two, skipping
anything merely kept and anything pinned. `wipe.py` clears weak references against the walk and
leaves old referents alone on a minor collection.

An expert works in that order because the rules force it, not because it is elegant: the queue
needs the walk, the keeping needs the queue, ageing needs both, and clearing needs to know which
of the two sets an object landed in. The same contract is implemented two further ways in the
authoring set - one breadth-first over a colour map, one the reference with every identifier
mechanically renamed - to show the shape is not what is graded.
"""

verification_explanation = """
Only the five files under `/app/col/` are taken from the agent. The verifier overlays them onto
its own pristine copy of the runtime, so nothing else the agent may have touched can change what
a program prints, and the record is compared line for line.

Correct is defined twice over. Twenty-five hand programs, one per graded decision plus the
must-still-work side of each fence, are checked against `gt.json`, frozen before the verifier was
written; the grader first asserts the sealed model still reproduces `gt.json` exactly, so a
drifted model cannot quietly redefine correct. Three hundred and twelve further programs are
generated inside the verifier from a nonce drawn after the agent has finished, across six
families that seed the pair cascade, the finalizer closure, the resurrection, the stale
remembered-set entry and the wide pair table. A submission cannot have seen them, so memorising
the shipped examples or forging records from an answer key both fail; both are cheats and score 0.

The fences run both ways. Releasing too much fails the ordinary cases and `old-safe`; releasing
too little fails `plain-drop`. Trusting the remembered set fails `rset-stale`; ignoring it fails
`rset-root`. Ageing what is merely kept fails `held-no-age`. Sixteen cheats score 0 and each is
caught by the layer that should catch it, the rescanning one by the execution limit itself. Two
independently written correct collectors score 1, including the reference with every identifier
renamed, so implementation and naming are not graded.
"""

