schema_version = "1.3"

artifacts = ["/app/network.json"]

[task]
name = "afterquery/reaction-network-reconstruction"

[metadata]
author_name = "Suad Pllana"
author_email = "suadpllana12@gmail.com"

difficulty_explanation = """
The agent must run six coupled inferences and get all of them right at once; each one has a
plausible shortcut that is specifically wrong.

The step that breaks most attempts is the free energies. The candidate file quotes them at a
reference temperature that the conditions file does not share, and nothing points that out.
Using the tabulated numbers as they stand still produces a self-consistent-looking network,
but it flips two equilibrium verdicts and, at the reference temperature, drags one cleavage
inside the 0.5 kJ/mol equilibrium band so that a tenth reaction joins the network. The error
does not surface until the very end, because every earlier stage still succeeds.

The other five each have their own trap. Two species carry a mistyped formula string, so
balancing from the formulas rather than from the drawn structures silently removes three
reactions that are really running. Candidates are given without coefficients, and two of them
only balance at ratios like 5:6 to 6:3:4, so eyeballing does not work and a candidate whose
species admit two independent balances has to be recognised as ambiguous rather than
arbitrarily balanced. The unassigned C5H7O4- channel has three isomers, and the carbon signal
count alone leaves two of them standing. One reaction runs backwards relative to how the
candidate file writes it, and one is equilibrated with exactly zero net flux, so it belongs
to the network even though a nonzero-flux membership rule would drop it. Label propagation
has to follow the direction each reaction actually runs, and has to run both ways across
equilibrated steps, which is what exposes the reversed one.

Individually each clue admits several readings. Only the whole set narrows the answer: the
tracer vetoes remove four otherwise flawless candidates, and the rate data then admit exactly
one flux vector.

The agent-facing tree carries no comments or documentation by design, and the data files use
neutral channel and species identifiers rather than compound names, so the chemistry has to
be read off the structures rather than recognised by name.
"""

solution_explanation = """
The reference works the way a kineticist would take it: fix the bookkeeping, then the
identities, then what the reactor can do, then what the tracers forbid, and only then let the
numbers size everything.

Element and charge counts come from the drawn structures, and the species whose typed formula
disagrees are recorded. Each candidate is balanced by an exact rational nullspace over the
element and charge rows, which classifies it as uniquely balanced, unbalanced, or admitting
more than one independent balance. The C5H7O4- channel is assigned by colour refinement on
each isomer's bond graph: the number of topologically distinct carbons and the attached
proton count of each is what separates the true isomer from the one with an equivalent methyl
pair and from the straight-chain one. Class gating is a table lookup against the reactor
conditions.

Free energies are corrected from the tabulated reference temperature to the reactor
temperature with the enthalpy and entropy held constant, then combined with the measured
concentrations, solvent at unit activity. That fixes the equilibrium flags and the sign each
flux is allowed to take. Atom maps are found by maximising conserved bonds over
element-preserving pairings, brute-forced since no reaction has more than nine heavy atoms a
side, with the lexicographic tie-break settling the symmetric cases such as the gem-diol
oxygens and the two oxygens of carbon dioxide. Each surviving candidate is then pushed
against the tracer data along its permitted directions, which vetoes four of them. The
remaining stoichiometric matrix against the measured net rates is solved in exact rational
arithmetic; it has full column rank, so the flux vector is unique, and the one candidate that
comes out at zero flux without being equilibrated is dropped. Labels are propagated to a fixed
point along the directions the fluxes imply.

Exact arithmetic throughout is not fastidiousness: the flux system is overdetermined, and
floating point makes the difference between a consistent system and an inconsistent one
impossible to call.
"""

verification_explanation = """
The verifier compares the agent's network against a ground truth that was derived twice
independently: once forward from the true network that generated the data, and once by
running the reference solver on the shipped data files alone. The two agree exactly, field
for field.

It checks the network membership exactly, and then, for every reaction in it, the balanced
coefficients, the free energy under reactor conditions to 0.05 kJ/mol, the equilibrium flag,
the direction, the net flux to 0.005, and the full atom map. It checks that every excluded
candidate carries the correct reason under the stated rule precedence, which is what proves
the pipeline was actually run rather than the answer guessed: several candidates would be
caught by more than one rule and only the earliest counts. It checks the identified isomer,
the formula conflicts, the inferred intermediates, and the predicted enrichment for all three
tracer runs, which can only come out right if the reaction set, the atom maps and the flow
directions are all correct together.

Twelve cheat scripts were run against it. The eight built by taking the reference solver and
doing exactly one step the naive way all score 0, including the two temperature shortcuts,
balancing from the typed formulas, ignoring charge, keeping the written directions, requiring
nonzero flux for membership, assigning the isomer on signal count alone, taking the first
valid atom map, and propagating label only forwards. The four crude fakes, an empty network,
every candidate declared active, and a sweep of the agent image for answer material, also
score 0.
"""

category = "Science"
subcategory = "Chemistry"

tags = [
  "reaction-network-inference",
  "atom-mapping",
  "isotope-tracing",
  "flux-balance-analysis",
  "exact-linear-algebra",
]

expert_time_estimate_hours = 8

relevant_experience = """
I work on mechanism reconstruction for small aqueous organic systems: steady-state flow
reactor runs, LC-MS and NMR channel assignment, 13C and 18O tracer design, and the
stoichiometric bookkeeping that turns a pile of channels into a network. The specific pain
this task is built from is real and recurring: thermodynamic estimates arrive tabulated at
298.15 K, reactors do not run there, and the correction is small enough to be skipped and
large enough to move a reaction in or out of the equilibrated band. The mistyped formula
string beside a correct structure is the other one, and the reason our internal tooling
always balances off the connection table.
"""

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[agent]
timeout_sec = 10800.0

[environment]
build_timeout_sec = 900.0

cpus = 2
memory_mb = 4096
storage_mb = 10240

gpus = 0
