difficulty_explanation = """
A matching-engine engineer would perform this repair while comparing execution and
failure-isolation policies in an exchange simulator. The session
data is synthetic and constructed to exercise interacting matching rules and workload
shapes; it is not a recording of customer orders or production trading activity.

The matching rules interact through the last fill price, price queues and parked orders.
A same-participant cancellation removes liquidity without moving the last price; an empty
level left behind by a user cancellation is not a live barrier. A whole-order admission
check must agree with the actual walk on both situations and leave every effect untouched
when admission fails. Hidden remainder can become available through repeated disclosure,
but each disclosure changes queue priority.

Two execution policies make the admission decision depend on different facts. In order
pace, fired orders wait until the current order finishes. In fill pace, they run before
the parent continues and can remove liquidity it needed or add liquidity that was absent
at entry. Their own firings run before later siblings. A whole order must undo its entire
descendant execution if it fails, including a successful child's fills and a failed
child's cancellation. A fired child's own failure must not undo its prior firing. These
are simulator rules, not a claim that a live venue can reverse published trades.

The original large session families put pressure on different straightforward implementations.
One combines many parked orders with many small fills. The other combines a large remote
book with repeated whole orders near the touch. Scanning every parked order on every fill
and copying the entire book for every admission both repeat work on irrelevant state.
The instruction exposes the workloads and the existing 300-second execution cutoff,
without prescribing the admission method or parked-order data structure.

The Python tree is compact. Its sparse documentation and short internal identifiers are
deliberate, but are not a substitute for the interaction between the rules. Exact event
and final-book comparisons reject an implementation that repairs each sample while
losing queue order, cancellation atomicity, or deferred activation on other sessions.
"""

solution_explanation = """
The reference restores the four incorrect decision modules and keeps the same-participant
predicate. The walk takes only the resting order's shown quantity and measures the price
band from the current last fill. A depleted slice is replenished and moved to the back of
its price queue. Trigger notifications precede a disclosure caused by the same fill;
order pace leaves fired orders on the driver's waiting queue. Fill pace executes the
new batch after resting-order cleanup, including a batch from the parent's final fill,
and completes each child's descendants before advancing to the next sibling.

Order-pace whole admission uses a read-only capacity check. It skips levels with no live
orders, excludes the incoming participant's remainder, and advances a shadow last price
only where a fill is possible. Available remainder at a reachable price can be counted
across slices because the parked orders do not execute during the current walk. The
real walk runs only after capacity covers the incoming size. The shipped room function
and its arguments are retained. Fill-pace whole orders instead execute with nested
frames: queue references and trigger state are saved at entry, changed order values are
recorded in every active frame, and output stays buffered until success. Restoration
keeps the original order objects so later user cancellations still reach them. A failed
child restores its own entry state; a failed ancestor restores the larger subtree.

Two heaps hold parked buys and sells, with an ID map for cancellation and a separate
arrival sequence for simultaneous firings. Eligible records are removed once, ordered
by that sequence, and appended to the driver's pending queue. The method also handles
non-monotonic order IDs according to the instruction's arrival-order rule.
"""

verification_explanation = """
The verifier overlays the five declared artifacts onto a pristine engine tree and drives
55 named sessions, 300 original generated small sessions, 120 generated fill-pace
sessions, four original large sessions and one large fill-pace session. The
generated inputs use a nonce chosen after the attempt finishes. Every ordered event row
and final book row is compared exactly with the sealed model. The saved named-case rows
must also agree with that model. There is no partial credit or numerical tolerance.

The model uses a flat book with explicit queue sequence numbers, per-mutation undo
records for nested whole orders, and bucketed trigger prices found by bisection. It shares no
matching code with the submitted engine. Arrival stamps are separate from queue priority
and order IDs. Named sessions distinguish descendant liquidity supply and consumption,
depth-first ordering, final-fill batches, nested restoration, later cancellations and
simultaneous firing with unordered IDs. All original named rows and generated families
are retained. Nineteen tests cover semantics, integrity and process lifecycle.

Integrity checks compare immutable files and live function fingerprints, check monitored
committed-sink entry counts against reported rows, and require the existing walk, avail,
blocks, admit and check decisions to remain in use. The sink accepts only calls from
the frozen emitter code; private speculative buffers are allowed. The worker has a 300-second cutoff. The
900-second verifier budget additionally covers model execution and pytest grading.

The wrapper drops worker privileges, locks the reward directory, defaults the reward
to zero and grades afterwards as root. The worker and cleanup process must both exit
successfully; their statuses are captured by the trusted shell and checked separately
from the worker's report. A correct report followed by a failed process still scores
zero. The reward is written only after every semantic, integrity and lifecycle check
passes. The verifier produces a pytest CTRF report alongside the binary reward.
"""

