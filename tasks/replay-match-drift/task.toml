[task]
name = "afterquery/replay-match-drift"

[metadata]
author_name = "Shiela marie"
author_email = "aurigue.shielamarie20@gmail.com"

difficulty_explanation = """
Every rule is in the brief. What is not in the brief is which structures survive all of them at
once, and the schedule a run produces is not something any container holds.

The remembered shape of replaying a workflow against its recorded history is a cursor walked
beside the code. The shipped engine is that, and this runtime is concurrent: a body forks
branches, a branch that waits goes down until the line that releases it comes up, and the order
branches run in is the order their lines were recorded - not the order they were forked, not the
order they started waiting, and not the order the body issues anything. A branch's place in that
queue is the position of a recorded line that cannot be known until the branch has been matched,
which cannot happen until the branch runs. That is the derivation the task is about, and the
first implementation of it - keep the branches in a list and walk it at each step for the one
whose turn is next - is exactly correct and cannot finish the wide programs. Measured against the
60 second limit for the whole graded set, the six large run files take 2.6 seconds under the
reference and 3.3 and 2.5 under two engines written apart from it, against 137.8 seconds with the
branches walked; walking the history for every lookup does not finish them at all. No amount of
ordinary dict indexing repairs the first of those, and what replaces it follows from the history
being fixed before the body starts rather than from a technique.

The counting rules feed that schedule and are fed by it. Commands are counted by kind and their
results paired on kind and name together, which is a different axis, and the count is global
across branches - so a schedule that puts two branches in the wrong order gives every command
after it the wrong recorded slot, and the failure surfaces as a name that does not match,
programs later. A branch waiting for a signal claims one as it goes down rather than when it
wakes, which decides its mark and therefore its turn, and that in turn decides which branch
claims next.

Then the live side, which is not a test any one command makes. It opens when the whole run comes
to a stop: nothing able to run, and nothing waiting for anything the history recorded. From that
point no command is matched at all, which is what leaves recorded commands unmatched and turns a
run that computed a perfectly good value into a failure naming the earliest of them. A version
marker with no recorded choice reads that same state - the legacy value while the run can still
move, the body's own value once it cannot - and the value decides which arm a branch takes, which
decides what it issues, which decides what it waits for, which decides whether the run can still
move.

Around those sit the decisions that fence both sides. A branch able to run goes before one that
has to be woken, so an engine that always takes the smallest mark never lets a freshly forked
branch start; a body whose history covers it must replay to the end and never print the live line
at all. Branch zero ending ends the run whatever the others are doing. A take reaches for the
earliest command its own branch has not taken. None of these can be confirmed one at a time: the
only feedback a wrong structure gets is one line of one printout, which is what the brief quotes.

Identifiers are in a legacy register - `dur/`, `tab`, `edge`, `pair`, `hold`, `sched`, `wake`,
`mach` - short but never misleading, and no name misdescribes what it holds. That is a choice
about the register of real runtime code rather than an obstacle: each is recoverable from what
calls it and what its value flows into.

The run files are synthetic and are recordings rather than shuffles: the generator forks the
branches, issues their commands in the order the rules put them, and gives every answer a key
that decides where its line lands. Fifteen families concentrate mismatched interleavings,
answers recorded in reverse, one name under two kinds, branches competing for a tag, histories
that stop part way, histories owing commands the body never issues, markers on both sides, and
the two scale families. In a live system these shapes are rare and they are exactly where this
class of bug lives.
"""

solution_explanation = """
Seven files, settled in the order the rules force rather than one that is tidy.

`sched.py` is where the first plan has to be given up. Two queues run over one set of branches
and they are not the same order: the branches able to run are keyed by number, the branches
waiting are keyed by the position of the line that releases them, and the second queue reorders
itself every time a branch goes down. It is a heap rather than a walk, and that is not a taste -
the run goes down once per recorded answer, so walking the branches for the smallest mark costs a
pass over every branch at every step. Branches waiting for something the history never recorded
are held apart, because nothing can wake them and the run reaching that state for all of them at
once is what opens the live side.

`wake.py` says what a branch is waiting for. For a command it is the line carrying its result,
whose position was settled when the command was bound; for a signal the branch has to claim one
as it goes down, per tag, so two branches on one tag take different lines and which of them takes
the earlier one depends on which went down first - which depends on the schedule those marks
produce.

`tab.py` indexes the history once, on the three axes the rules count on: recorded commands per
kind, results per kind and name together, signals per tag, each with the position of its line.
`pair.py` binds a command to its result at the moment it is issued and takes an unrecorded one
off the run file's list at the moment a branch takes it, which under a schedule are not the same
order. `hold.py` keeps a branch's untaken commands in issue order. `edge.py` owns the live side
and holds the matched positions as a set rather than a count, because the leftover a finished run
has to name is the earliest recorded command nobody matched and after the boundary opens the
unmatched ones are not a suffix of anything. `ver.py` settles the markers against that same
boundary.

An expert works in that order because each file consumes the one before it: how the history is
indexed decides what a command can match, what it matches decides what a branch waits for, what
it waits for decides when it runs, when it runs decides what is issued next, and what was issued
decides what the history has left over. The same contract is implemented two further ways in the
authoring set - one holding the waiting branches in a list kept in order and the history as
queues popped rather than indexed, one holding the history in flat parallel arrays with the
matched commands in a bytearray - so the shape is visibly not what is graded.
"""

verification_explanation = """
Only the seven files under `/app/dur/` are taken from the agent. The verifier lays them over its
own clean copy of the tree, so the run file grammar, the body machine, the trace writer and the
driver cannot change what a run file prints, and an eighth file put beside the seven is never
collected at all.

Correct is defined twice over. Forty hand run files, one per graded decision plus the
must-still-work side of each fence, are checked against `gt.json`, frozen before the grading file
was written; the grader first asserts that the sealed model still reproduces `gt.json` exactly,
so a model that had drifted could not quietly redefine correct. Five hundred and twenty-five
further run files are generated inside the verifier from a seed drawn after the agent's container
is gone. They are recordings rather than shuffles: the generator walks the branches the way the
scheduling rules do and gives every answer a key that decides where its line lands. A submission
cannot have seen them, so fitting the shipped examples fails and so does carrying an answer key.

The fences run both ways. Taking the smallest mark ahead of a branch that can just run fails
`sched-ready-first`; taking the waiting branches in the order they went down, or the largest mark
first, fails `plain-ordinary`; taking the ready branches from the highest number down fails
`edge-no-wait`. Taking a signal when the branch wakes instead of claiming it as it goes down
fails `sig-claim`, and marking a branch by where its command was recorded rather than where its
result was fails `plain-ordinary`. Counting a command over the whole history fails `count-kind`.
Pairing a result on kind alone fails `pair-dup` and on name alone fails `pair-cross`, while
results recorded in issue order must still work, which is `pair-order`. Matching commands after
the live side opened fails `edge-after-live-go`; taking an unrecorded result when the command is
issued rather than when it is taken fails `edge-no-wait`. Reporting the last leftover instead of
the earliest fails `left-earliest`, counting a spare signal as one fails `left-not-ok`, and
skipping the check fails `left-after-live`. A marker giving the body's own value while the run can
still replay fails `ver-branch`, and giving the legacy value once live fails `ver-live-cur`.

Thirty-six cheats score 0. Twenty-one are wrong readings, each caught by the enumerated run file
named for it, measured by `tools/readingcheck.py`. Two are exactly correct and too slow: the
branches walked for the one whose turn is next, and the history walked for every lookup. Two are
forgeries. One recognises the forty shipped histories by fingerprint and is the reference only for
those, which passes all of them and fails the run files it could not have seen; the other carries
the frozen answers themselves and hands them back through a trace writer it replaced. The
remaining eleven are probes: the sealed answers read from inside the run, the reward written
directly, a reward written late by a double-forked survivor, a planted record, a record planted
and the stage exited clean before it could be overwritten, a record spoiled on the way out, the
generator rewritten, the grading file rewritten, the exam shrunk, a privilege probe, and an engine
hidden in an eighth file beside the seven that are collected. Two independently written correct
engines score 1.

The submitted code runs unprivileged, in its own session, under the wall clock that is also the
task's execution limit. The model and the frozen answers sit in a directory that uid cannot read,
so code running inside the verifier cannot compute its answers from them. The reward defaults to
0, is written last by the privileged stage into a root-owned directory locked before any agent
code runs, and anything the run left behind is reaped by owner first.
"""

category = "Software"

subcategory = "Data engineering"

tags = [
  "durable-execution",
  "deterministic-replay",
  "event-history-matching",
  "cooperative-scheduling",
  "workflow-versioning",
]

expert_time_estimate_hours = 9

relevant_experience = """
Having worked on the replay half of a durable execution runtime: the part that takes a workflow
body and the history an earlier attempt recorded and decides which branch runs next and which
recorded line each command is entitled to. Familiarity with the fact that a concurrent body's
schedule on replay is the order its work was recorded finishing rather than the order it was
started, that commands are counted on one axis and their results paired on another, and that a
version marker reached during replay must answer for the code that was running when the history
was written rather than for the code running now. Comfort with the difference between a history
that has run out and a history the body has diverged from, with carrying a signal queue across
that boundary, and with the difference between an engine that is correct and one that is
affordable at the branch counts a long-running workflow accumulates.
"""

