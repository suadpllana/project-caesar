]

expert_time_estimate_hours = 9

relevant_experience = """
Experience planning recomputes on partitioned batch pipelines after a source partition is
restated: working out which hourly and daily partitions a correction reaches through roll-ups,
trailing windows and steps that carry their own previous partition forward, which of them
retention has already deleted and must be recomputed from what is left, which were published and
must be read as published, and when a daily roll-up can stand in for hours that are gone.
Familiarity with the gap between the backfill an orchestrator runs - clear everything downstream
and rerun it - and a plan that is both minimal and runnable, and with ordering a plan so that a
partition never runs before something it reads.
"""

