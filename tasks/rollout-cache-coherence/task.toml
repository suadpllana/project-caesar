expert_time_estimate_hours = 8

relevant_experience = """
I work on the serving side of RL post-training loops: rollout engines that stay resident
while a trainer pushes weights into them between batches, with prefix caching carrying
most of the throughput because a group of samples shares one prompt. The pain this task is
built from is the one that costs the most and shows up the least: the prefix cache is
keyed on tokens, the weights move underneath it, and nothing anywhere raises an error. It
takes a while to accept that the reward curve is flat because a fraction of the samples
straddled a weight push. The other half of it, that you cannot fix it by flushing on every
push without giving up the reuse the loop was sized around, is what turned it into a
question about which parameters a cached block actually depends on. The tied projection
and the replayed optimizer step are both things I have been caught by rather than things I
invented for this.
"""

