  "borrowed-row-heights",
  "bounded-measurement-cache",
]

expert_time_estimate_hours = 12

relevant_experience = """
Having owned the list virtualization layer of a desktop application shell: the part that renders a
window of rows out of a document of hundreds of thousands of sections, learns row heights only by
rendering them, keeps a bounded cache of those heights, and holds the reading position still while
all of it changes underneath. Familiarity with estimating unrendered rows from the last row that
was rendered, with what that does to every offset below it, with anchoring below a sticky header
that the next header pushes off, and with a frame that lays out more than once because its own
measuring moves what it has to render. Comfort with keeping an offset-to-row index affordable when
one measurement can change the height of an unbounded run of rows, and with the difference between
a layout that is correct and one that is affordable at the sizes a real log or chat history reaches.
"""

