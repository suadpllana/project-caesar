[task]
name = "afterquery/scan-chunk-pick"

[metadata]
author_name = "Shiela marie"
author_email = "aurigue.shielamarie20@gmail.com"

difficulty_explanation = """
The surviving rows are the easy half and they are not what is graded. What is graded is the
list of dictionary consults and page reads the scan paid for, in the order it paid for them,
across every query of a file. An engine that reads every page and filters produces exactly the
right surviving rows while that list is wrong from its first entry, so the check a solver
reaches for first - run it, compare the rows with a brute force - confirms a plan that has
already failed.

The storage is the shape real column stores have. A column is chunks and a chunk is pages; a
page header carries its null count and its bounds, a chunk carries the sum of its pages' values,
a chunk's dictionary covers the pages written as indexes and not those that fell back to plain
values, and changes sit beside immutable pages as row updates and deletes. The textbook plan
applies one condition at a time and settles only that condition, and answers each reported page
on its own. Two rules the brief states as principles, not steps, make that plan wrong in ways a
brute force built on the same reading cannot see.

The first is that what is known acts at once and on every condition. A header, an updated
value, a page remembered from an earlier query or a dictionary consulted before kills the rows
it fails before any condition is applied; a read settles every condition over its column on
that page, and a consult settles every index page of its chunk for every comparison, killing
rows in pages no pair has reached. A read the per-condition plan makes is often one this engine
never pays for, and the live counts every later choice is scored on move with it.

The second is the report. It reads a page only when the line could not be worked out without it
even if every other page it could read were read. Pages carry no sum, so the pages of a chunk
whose rows are all live are told together by the chunk's sum less the sums of its other pages -
unless one of those other pages has no live row and a sum nobody knows. Such a page can never be
read, so it blocks the split and every wholly live page must be read instead. Whether a dead
page's sum is known depends on how its rows died: killed by a header it stays unknown, read
before its rows died it does not; a page of one value knows its sum even when it holds nulls,
and so does an index page whose one-entry dictionary is known. A one-entry dictionary is
consulted only when knowing it spares a read, which it can do through a dead page. None of this
is visible in the surviving rows, and the per-page plan gets the sum right while reading pages
the chunk sum answers, or answers a page the chunk sum cannot split.

The file is scanned with one memory: a page read or a dictionary consulted by any query is known
to every later query, prints only the first time, kills rows at a later query's start, counts
exactly from its first step, and gives the report its sums. Underneath is a measured boundary:
the pair applied next is re-chosen after every step, the wide shape puts about two thousand
chunks in each column, and rescanning every pending pair is exactly correct and takes 140
seconds on one such file against 1.6 for the reference and 60 for the whole graded set. The fast
path is an incremental priority structure whose keys fall as rows die in any column whose
partition overlaps the chunk and rise when a page read replaces a low spread with a higher exact
count.

Identifiers are in a legacy register - `scn/`, `hdr`, `dct`, `live`, `pick`, `step`, `proj`,
`mn`, `mx`, `dic`, `toks`, `up`, `gone`, `mem` - short but never misleading. That is a choice
about the register of real scan-path code rather than an obstacle: each is recoverable from what
calls it.

The segment files are synthetic, in seventeen families, concentrating headers rounded inward,
dictionary chunks whose later pages fell back to plain values, misaligned partitions, null runs,
chunks whose every row was updated, pages of one value with and without nulls, heavy deletion,
skewed pages whose spread sits far below what a read finds, files whose later queries run on
what earlier ones read, scores built to tie, a banded column whose range conditions kill some
pages of the reported columns whole and keep others whole, and the two scale shapes. In a
warehouse these concentrations are rare, and they are exactly where this class of bug lives.
"""

solution_explanation = """
Six files. The order they are settled in is the order the rules force.

`hdr.py` is the page header. `bounds` widens a recorded pair by the granularity less one when
the exactness flag is off. `miss` and `allsat` are what the bounds and the null count prove
about every row a page holds - no row matches, or every row does, which with a null present is
never true except for is-null. `one` says when the bounds alone fix every non-null value.
`guess` is the spread the order is chosen on: non-null rows times the width of the part over the
width of the bounds, rounded up, with `ne` taking the complement.

`dct.py` says a dictionary speaks only for `i` pages, gives its verdict on a comparison, and is
charged once per chunk per file.

`live.py` separates what the file owns from what a query owns. `fresh` makes the file's memory,
the values of every page read and the set of dictionaries consulted. `start` makes one query's
state and puts every condition to what is already known: updated values, each page's header,
every remembered page and every dictionary consulted before. Rows any of them fail die there;
what is left of each condition is a set of open pages. `settle_read` and `settle_dict` are the
two ways a page closes during the query, and both act on every condition over the column at
once, killing rows as they go. Live counts per chunk of every column are kept through a
row-to-chunk map, and each condition's count on each chunk is summed from exact counts where a
page is remembered and spreads where it is not, swapped when a page is read.

`step.py` applies one condition to one chunk: the open pages that still supply a live row, in
order, the dictionary first for a comparison on an `i` page whose dictionary is not yet known,
and a read if a row is still unsettled after that. `pick.py` keeps every pending pair in a heap
keyed exactly as the order is - score, condition position, chunk number - re-pushes the pairs of
every dirty chunk after each step, and trusts a popped key only while it still equals the pair's
current score, because scores fall as rows die and rise when a read replaces a spread.

`proj.py` works each chunk of each named column as a whole. A page only some of whose rows are
live is read unless it has been read, holds only nulls, or holds no null with one known value.
Pages whose rows are all live and whose sum is unknown are told together by the chunk's sum less
the other pages' sums, unless some page with no live row has an unknown sum, in which case they
are all read. A one-entry dictionary is consulted first when one of its `i` pages supplies a row
and knowing it leaves fewer reads. Reads come in page order.

An expert works in that order because each file consumes the one before it: the bounds decide
what a header settles, what is known decides which rows are alive before anything is paid for,
the dictionary's scope decides whether a page is read, a read decides the next scores, what the
file remembers and which page sums the report knows, and those sums decide what the report still
pays for. Two further correct layers are in the authoring set - one that keeps settlement per
row, keeps no counts and uses version-stamped heap entries, and one that keeps the pending pairs
in a segment tree of exact minima - so the shape of the reference is visibly not what is graded.
"""

verification_explanation = """
Only the six files under `/app/scn/` are taken from the agent. The verifier lays them over its
own pristine copy of the tree, so the grammar, the value decoder, the trace writer, the driver
and the sample segments cannot change what a segment file prints, and a new file put beside the
six is never collected at all.

Correct is defined twice over. Eighty-two hand-written segment files, one per graded decision
plus the must-still-work side of each fence, are checked against `gt.json`; the grader first
asserts that the sealed model still reproduces `gt.json` exactly, so a model that had drifted
could not quietly redefine correct. Three hundred and thirty-six further files - twenty-two of
each of fifteen small families and three of each of the two scale shapes - are built inside the
verifier from a seed drawn after the agent's container is gone, and checked against the sealed
model, which was written apart from the reference: one module that asks each row's fate afresh
from what is known, keeps the pending pairs in a segment tree of exact minima, and finds the
report's reads by asking of each page in so many words whether the line could be worked out
without it. A submission cannot have seen those files, so fitting the shipped examples fails,
and so does carrying an answer key. Every hand file's sums, null counts, recorded pairs and
indexes are what its values give.

The fences run both ways. Letting a header, an updated value, a remembered page or a consulted
dictionary wait for its own condition's turn fails `flt-header-kills-at-start`,
`flt-header-kills-other-column`, `flt-memory-kills-at-start` and `upd-drop-spares`; letting a
consult settle only its own page or only its own condition fails `flt-dict-settles-every-page`
and `flt-consult-settles-whole-chunk`. Reading the wholly live pages of a chunk instead of taking
their sum from it fails `prj-chunk-sum-whole` and `prj-chunk-sum-together`; taking it past a dead
page with an unknown sum fails `prj-chunk-sum-blocked` and `prj-dead-page-blocks-sum`; treating a
one-value page holding nulls as having no known sum fails `prj-chunk-sum-pinned-dead` and
`prj-pinned-nulls-sum`; the one-entry dictionary is fenced on three sides by
`prj-consult-spares-read`, `prj-consult-not-sparing` and `prj-consult-needs-live-row`. The rules
carried over are fenced as before: pages read singly by `pg-partial-read`, the dictionary's scope
by `dic-overflow-read` and `pg-dict-skips-fallback`, the memory by the `mem-` files, updated rows
by the `upd-` files, deletes by `del-caps-score`, the widened header by the `hdr-widen-` files,
the order by `ord-nothing-prunes`, `ord-exact-after-read`, `ord-read-raises-repush` and
`ord-read-raises-stale`, and the rest of the report pass by the `prj-` files.

Seventy-eight cheats score 0. Sixty-one are wrong readings, each caught by the enumerated case
named for it. One is the per-condition plan with a per-page report - free facts acting only when
their own condition's turn comes, a read settling only its own condition, each reported page
answered on its own - which fails 37 of the 82 hand files. One is exactly correct and too slow:
the pending pairs rescanned after every step, 140 seconds on one wide file. Three are shortcut
strategies - one fixed output for every file, the worked example replayed, and the conditions
run in query order over whole columns - and the shipped tree is the fourth, run as the
do-nothing agent. One is a forgery carrying the frozen answers keyed on each file's query
history, which reproduces all eighty-two and fails on the files it could not have seen. The
other eleven are probes, each on an engine that prints a constant so that a reward of 1 can only
have come from the tamper: reading the frozen answers out of the sealed directory, the reward
written directly, a reward written late by a double-forked survivor, a planted worker record, a
record planted and the worker exited clean before it could be overwritten, a record spoiled on
the way out, a rewritten generator, a rewritten grader, a rewritten case list, a uid and
root-path probe, and an engine hidden in a file beside the six that are collected. Two
independently written correct scan layers score 1.

The submitted code runs unprivileged, in its own session, under the wall clock that is also the
task's execution limit. The graded segment files are built before that clock starts, by the
privileged stage, so the limit measures the submitted engine and nothing else, and the seed they
came from is never handed to the process that runs the submission. The model and the frozen
answers sit in a directory that uid cannot read, so code running inside the verifier cannot
compute its answers from them. The reward defaults to 0, is written last by the privileged stage
into a root-owned directory locked before any agent code runs, and anything the run left behind
is reaped by owner first.
"""

