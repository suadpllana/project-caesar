  "selectivity-estimation",
  "null-semantics",
  "late-materialization",
]

expert_time_estimate_hours = 9

relevant_experience = """
Having worked on the scan layer of a columnar store: the part that turns a segment footer and a
filter into rows, decides which chunks are fetched at all, and keeps the per-chunk statistics
that decision rests on. Familiarity with statistics that are bounds rather than facts, with
dictionaries that stop being usable the moment a chunk falls back to a literal, and with the
difference between a filter order chosen once from the footer and one chosen again as each
chunk lands. Comfort with null semantics that decide whether a chunk can be skipped or has to
be fetched, with chunk partitions that do not line up between columns of the same table, and
with the difference between a scan that is correct and one that is affordable at the row counts
a real segment carries.
"""

