[metadata]
author_name = "Shiela marie"
author_email = "aurigue.shielamarie20@gmail.com"

difficulty_explanation = """
The surviving rows are the easy half and they are not what is graded. What is graded is the
list of dictionary consults and page reads the scan paid for, in the order it paid for them,
across every query of a file. An engine that reads every page and filters produces exactly the
right surviving rows while that list is wrong from its first entry, so the check a solver
reaches for first - run it, compare the rows with a brute force - confirms a plan that has
already failed.

The storage is the shape real column stores have. A column is chunks, a chunk is pages, each
page carries its own header with a sum, a chunk's dictionary covers the pages written as
indexes and not the pages that fell back to plain values, and changes sit beside immutable
pages as row updates and deletes. The textbook plan treats the chunk as the unit: merge its page
statistics, decide it, read it whole, merge the updates in. Almost every rule of this engine is
a consequence of the chunk not being the unit. A condition is applied page by page, so a chunk
is read in part and its count becomes a mix of exact counts on the pages read and header spreads
on the rest; the dictionary settles its index pages and sends its fallback pages to a read; a
verdict that every entry passes still sends a page holding a null to a read; and a page holding
nothing alive that it still supplies is never touched.

On top of that the file is scanned with one memory. A page read or a dictionary consulted by any
query is known to every later query, prints only the first time, and a later query counts a
remembered page exactly from its first step, which reorders what it pays for next. What a query
owns and what the file owns are different things, and the natural per-query state has to be
split. The report pass inherits all of it: it answers a page from a page already read, from its
header when every row is null or the bounds are one value, and from the header's sum when the
rows it wants are every row of the page - which a single delete, update or death in another
column quietly takes away - then from a one-entry dictionary for its charge, and only then reads.

The brief states each of these once, as what a header, a dictionary and a read can prove and
what each costs, not as steps; the procedure has to be worked out, and there is no oracle for
the printed list beyond the one worked example. Underneath is a measured boundary: the pair
applied next is re-chosen after every step, the wide shape puts about two thousand chunks in each
column, and rescanning every pending pair is exactly correct and takes 142 seconds on one such
file against 2.1 for the reference and 60 for the whole graded set. The fast path is an
incremental priority structure whose keys move both ways: they fall as rows die in any column
whose partition overlaps the chunk and rise when a page read replaces a low spread with a higher
exact count.

Identifiers are in a legacy register - `scn/`, `hdr`, `dct`, `live`, `pick`, `step`, `proj`,
`mn`, `mx`, `dic`, `toks`, `up`, `gone`, `mem` - short but never misleading. That is a choice
about the register of real scan-path code rather than an obstacle: each is recoverable from what
calls it.

The segment files are synthetic, in sixteen families, concentrating headers rounded inward,
dictionary chunks whose later pages fell back to plain values, misaligned partitions, null runs,
chunks whose every row was updated, pages whose header or one-entry dictionary already answers,
pages that stay whole and pages a delete or an update breaks, heavy deletion, skewed pages whose
spread sits far below what a read finds, files whose later queries run on what earlier ones read,
scores built to tie, and the two scale shapes. In a warehouse these concentrations are rare, and
they are exactly where this class of bug lives.
"""

solution_explanation = """
Six files. The order they are settled in is the order the rules force.

`hdr.py` is the page header. `bounds` widens a recorded pair by the granularity less one when
the exactness flag is off. `miss` and `allsat` are what the bounds and the null count prove
about every row a page holds - no row matches, or every row does, which with a null present is
never true except for is-null. `pinned` says when the header alone fixes every value: all rows
null, or no nulls and a low equal to its high after widening. `guess` is the spread the order is
chosen on: non-null rows times the width of the part over the width of the bounds, rounded up,
with `ne` taking the complement.

`live.py` separates what the file owns from what a query owns. `fresh` makes the file's memory,
the values of every page read and the set of dictionaries charged. `start` makes one query's
state: a byte per row with deleted rows dead from the start, a live-row count per chunk of every
column the query touches kept through a row-to-chunk map, and each condition's count on each
chunk, summed over its pages from exact counts where the page is remembered and spreads where it
is not. `learn` swaps a page's spread for its exact count when the page is read, and marks the
chunk dirty.

`dct.py` says a dictionary speaks only for `i` pages and charges once per chunk per file.
`step.py` applies one condition to one chunk page by page: updated live rows are tested on their
own values; a page with nothing else alive is passed over; otherwise the header, then a page
already read, then for a comparison the dictionary (its verdict worked out once for the pair),
then a read of that page alone. A verdict that every entry passes keeps a page only when the
page holds no null.

`pick.py` keeps every pending pair in a heap keyed exactly as the order is - score, condition
position, chunk number - re-pushes the pending pairs of every dirty chunk after each step, and
trusts a popped key only while it still equals the pair's current score, because scores fall as
rows die and rise when a read replaces a spread.

`proj.py` reports the named columns in order, page by page, adding the updated survivors' own
values and answering each wanted page from a page already read, from its header (all null, one
value, or its non-null count and sum when every row of the page is wanted), from a one-entry
dictionary on an `i` page with no null for its charge, and from a read otherwise.

An expert works in that order because each file consumes the one before it: the bounds decide
what a header settles, the overlay decides whether a page is asked at all, the dictionary's scope
decides whether a page is read, a read decides the next scores and what the file remembers, and
the memory decides what the next query and the report pass still pay for. Two further correct
layers are in the authoring set - one that keeps no counts and sums a byte slice and a chunk's
pages when asked, with version-stamped heap entries, and one that keeps the pending pairs in a
segment tree of exact minima - so the shape of the reference is visibly not what is graded.
"""

verification_explanation = """
Only the six files under `/app/scn/` are taken from the agent. The verifier lays them over its
own pristine copy of the tree, so the grammar, the value decoder, the trace writer, the driver
and the sample segments cannot change what a segment file prints, and a new file put beside the
six is never collected at all.

Correct is defined twice over. Sixty hand-written segment files, one per graded decision plus
the must-still-work side of each fence, are checked against `gt.json`; the grader first asserts
that the sealed model still reproduces `gt.json` exactly, so a model that had drifted could not
quietly redefine correct. Three hundred and fourteen further files - twenty-two of each of
fourteen small families and three of each of the two scale shapes - are built inside the
verifier from a seed drawn after the agent's container is gone, and checked against the sealed
model, which was written apart from the reference: one module, a segment tree of exact minima
where the reference has a heap, and a chunk's count summed afresh from its pages whenever the
chunk is touched where the reference maintains it. A submission cannot have seen those files,
so fitting the shipped examples fails, and so does carrying an answer key.

The fences run both ways. Reading a whole chunk when one page needs it fails `pg-partial-read`;
letting the dictionary speak for a fallback page, or refusing it for a chunk that has one, fails
`dic-overflow-read` and `pg-dict-skips-fallback`; keeping or reading on the chunk's nulls rather
than the page's fails `pg-dict-keep-page-nulls`; counting a partly read chunk from its headers
fails `pg-count-mixed`. Forgetting what earlier queries read fails `mem-no-reread` and
`qry-starts-over`; charging a dictionary again per query fails `mem-charge-across`; counting a
remembered page by its spread fails `mem-exact-from-start`; forgetting a page the report pass
read fails `mem-report-read-kept`. Never answering a whole page from its sum fails
`prj-whole-page-sum`, and answering from it after a delete or an update fails
`prj-whole-broken-by-delete` and `prj-whole-broken-by-update`; the one-entry dictionary is fenced
by `prj-one-entry-rd`, `prj-one-entry-nulls` and `prj-one-entry-fallback`. The rules carried over
are fenced as before: updated rows by the `upd-` files, deletes by `del-caps-score`, the widened
header by the `hdr-widen-` files, a null blocking a pass by `hdr-nulls-block-pass`, the order by
`ord-nothing-prunes`, `ord-exact-after-read`, `ord-read-raises` and `ord-read-rescored`, and the
rest of the report pass by the `prj-` files.

Sixty-six cheats score 0. Forty-nine are wrong readings, each caught by the enumerated case
named for it. One is the previous design of this engine - every query starting over, a chunk
read, counted and trusted whole, no page sums - which fails 26 of the 60 hand files. One is
exactly correct and too slow: the pending pairs rescanned after every step, 142 seconds on one
wide file. Three are shortcut strategies - one fixed output for every file, the worked example
replayed, and the conditions run in query order over whole columns - and the shipped tree is the
fourth, run as the do-nothing agent. One is a forgery carrying the frozen answers keyed on each
file's query history, which reproduces all sixty and fails on the files it could not have seen.
The other eleven are probes, each on an engine that prints a constant so that a reward of 1 can
only have come from the tamper: reading the frozen answers out of the sealed directory, the
reward written directly, a reward written late by a double-forked survivor, a planted worker
record, a record planted and the worker exited clean before it could be overwritten, a record
spoiled on the way out, a rewritten generator, a rewritten grader, a rewritten case list, a uid
and root-path probe, and an engine hidden in a file beside the six that are collected. Two
independently written correct scan layers score 1.

The submitted code runs unprivileged, in its own session, under the wall clock that is also the
task's execution limit. The graded segment files are built before that clock starts, by the
privileged stage, so the limit measures the submitted engine and nothing else, and the seed they
came from is never handed to the process that runs the submission. The model and the frozen
answers sit in a directory that uid cannot read, so code running inside the verifier cannot
compute its answers from them. The reward defaults to 0, is written last by the privileged stage
into a root-owned directory locked before any agent code runs, and anything the run left behind
is reaped by owner first.
"""

