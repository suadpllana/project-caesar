schema_version = "1.3"

artifacts = [
  "/app/wire/own.py",
  "/app/wire/hold.py",
  "/app/wire/gate.py",
  "/app/wire/tear.py",
  "/app/wire/plan.py",
]

[task]
name = "afterquery/scope-hold-release"

[metadata]
author_name = "Suad Pllana"
author_email = "suadpllana12@gmail.com"

difficulty_explanation = """
Who does this for a living: a platform engineer who owns the dependency container every
other team registers services in, and who has to answer for a disposal that ran too early
or never ran at all. The graded data is synthetic. A stream is a registration table of
short opaque names with declared lifetimes plus a list of scope opens, closes, resolutions
and factory invocations; nothing real is constructed and nothing is really disposed. That
is not a fair sample of a production container, where graphs are far wider and most of the
registrations are dull. What it does reproduce faithfully is the one condition that makes
the question hard, which is a capture that outlives the scope it was taken in.

The tree is a working container with the wrong ownership and teardown decisions, and the
wrongness is coherent rather than broken: it charges an instance to the scope that was
active when the call was made, and it tears a scope's instances down in the order they
were created. That is the shape of every container write-up, because with direct
resolutions and no factories it is right, so it is also the shape a frontier agent
reconstructs from its prior.

The instruction states the ownership rule outright, because fairness requires it. What it
does not state is where the capture is taken, and that is the whole task. Measured against
the reference over three hundred generated streams: a submission that fixes the singleton
chain, the transitive refusal and the teardown order, and takes the capture at the moment
the factory is invoked, is wrong on 38.3 percent of them. A submission that is told the
ownership rule and still takes the capture at invocation is wrong on every corner stream
we generate. Neither failure is visible from anything in the tree: all four case files in
/app/cases come back byte-identical between that submission and the reference, which was
checked file by file before the set was frozen. The capture is recoverable, and only by
experiment - the container resolves a factory's scoped dependencies against the scope its
holder was built in, so invoking one factory from two different nested scopes hands back
the same dependency instance, and that identity is the only thing in the system that says
where the capture lives.

The second discovery invalidates the natural implementation of the first. Once ownership
follows the capture, the capture has to be threaded through nested resolution rather than
passed down as the active scope, because a dependency pulled in underneath a singleton
belongs to the root however deep it sits, and the obvious single-scope implementation of
the first answer gets that wrong for every chain of more than one step.

The container ships with no comments anywhere and its identifiers are in the register of
ordinary internal code rather than self-describing ones. That is deliberate: the token
table, the scope stack and the pull-in chain recorded by the core have to be recovered by
reading behaviour instead of by reading names.
"""

solution_explanation = """
The reference is four small files. Two of them carry the work.

wire/hold.py records the scope a factory token was minted in and hands it back when the
token is fired. That is one line each way, and it is the whole of the discovery: the mint
happens when the holder is resolved, so the scope it records is the holder's, and every
later invocation is charged there no matter how many scopes have opened since.

wire/own.py settles the home of every instance a call created. The core reports each
creation with the instance that pulled it in, so the file walks that chain upward and
sends anything standing under a singleton to the root, and everything else to the scope
the call was charged to. Written that way the singleton rule and the capture rule are one
rule asked twice.

wire/gate.py refuses a singleton that reaches a scoped registration anywhere below it,
using the reachability helper the frozen registration module already exposes rather than
looking only at direct dependencies. wire/tear.py reverses the creation order within a
scope. wire/plan.py needs no change, and establishing that is part of the work.

Three alternative correct implementations are kept outside the bundle and all three score
1: the capture held as a scope-to-token index instead of a token-to-scope map, the
teardown ordered by descending creation serial instead of by reversing a list, and the
home walk done downward from the roots of the pull-in forest instead of upward from each
instance. All three agree record for record with the reference on the enumerated cases and
on three hundred generated streams.
"""

verification_explanation = """
The container is driven over thirteen named cases and three hundred streams the verifier
builds from a nonce minted after the agent has finished, and it is graded on one thing
with no partial credit: the dump, record for record, in order.

The dump comes out of the run, and the records the grader reads are produced by the frozen
core rather than by anything a submission writes: the core assigns instance identity and
reports what pulled in what, so the ledger records what the container actually built. The
grader runs as root after the run has been reaped and never executes agent code.

Expected results for the named cases come from tests/oracle.py, a sealed second
implementation written from the specification rather than from the tree, sharing no code
with the reference: where the reference threads a capture through a driver built on
wire.core, the oracle replays the stream with its own instance tables and emits each
scope's teardown by descending serial. The reference is proved against it on the named
cases and four hundred generated streams before any ground truth is written, and the three
hundred graded streams are re-derived through the oracle inside the grader, so nothing a
submission returns is compared against a number it could have read.

Two attestations sit under that. The sealed modules are fingerprinted against digests the
grader derives by compiling the pristine sources, so rebinding a core function is caught
even when it happens at import time before any run-time digest is taken. And the executed
tree is compared file by file against the pristine copy after the run, with the count of
files compared asserted before any comparison is believed, so a probe that rewrites a
frozen module on disk is caught by that check and by nothing else. Both are exercised: the
cheat suite carries one probe per attestation, each built on the reference so that every
answer it returns is correct, and each is caught by its own layer alone.
"""

category = "Software"
subcategory = "Systems"

tags = [
  "object-lifetimes",
  "scope-capture",
  "teardown-ordering",
  "dependency-graphs",
  "refusal-rules",
]

expert_time_estimate_hours = 8

relevant_experience = """
I have owned the wiring layer of a service platform where every team registered their own
components, and the two incidents that cost the most were both this: a long-lived
component holding a factory, calling it during a later request, and the object it built
being torn down with a scope that had nothing to do with it. The first time it showed up
as a connection being closed underneath a background worker, and it took a week, because
every test we had resolved things directly and every one of them passed. The second time
was the same bug reached through a decorator. What I took from both is that the ownership
rule is easy to state and almost nobody implements the capture where it actually happens,
and that the failure is invisible to any test you would think to write, because it needs a
scope opened after the holder was built.
"""

