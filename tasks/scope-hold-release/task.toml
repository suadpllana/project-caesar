[task]
name = "afterquery/scope-hold-release"

[metadata]
author_name = "Suad Pllana"
author_email = "suadpllana12@gmail.com"

difficulty_explanation = """
The work is exception safety in a dependency container with captured factories and separate
construction and disposal scopes. The environment is a compact, executable model of that
subsystem. Registrations and operation streams are synthetic; the concentration of constructor
failures, retries and retained factories is deliberate. It represents a platform engineer's work
on failed service initialization and cleanup. File count is not the source of difficulty.

The initial four ownership repairs do not repair failed construction. The core reserves parent
identity before it builds children, but records completed objects after children finish. When a
constructor fails, the completion list can contain descendants whose singleton ancestor never
completed. Walking only that list assigns the wrong rollback owner. Walking all entered objects
finds the owner but would dispose unfinished objects unless completion is tracked separately.

Rollback has a different membership rule from scope close. It must remove completed allocations
from one attempt across several owners, including root, while preserving older instances borrowed
from the same caches. A marked instance may be cached under an inner build scope and disposed by
an outer scope; grouping cleanup by either scope cannot identify the failed attempt. An object
left in a cache after rollback changes which constructors execute on retry. Clearing the whole
cache instead destroys earlier instances, even where their current constructor is unavailable.

Failure is tested only when construction reaches that node, after its dependencies. A successful
cached lookup bypasses both the constructor and its dependency traversal. Prechecking fault flags
over the declared graph therefore rejects valid requests and suppresses required cleanup records.
The fault state can change between operations, making these differences observable on the same
registration. Refusals, rollback records, parting calls and later closes share one ordered trace.

The agent must coordinate the attempt boundary with captured invocation scopes, request admission,
singleton ancestry, completion state and cache provenance. A failed holder resolution must preserve
an older factory binding even if that binding points to a scope that has closed. Failure during a
parting call must finish its rollback before the surrounding close continues. These interactions
require the driver and the ownership policies to agree on a state model.

Five editable modules need repair. The admission and parting-scope policies already behave correctly.
The environment uses short internal names and contains no comments or docstrings. All behavior is
specified; there is no missing rule or undisclosed timing limit used to create difficulty.
"""

solution_explanation = """
The reference replaces five policy files and executes every input fixture. It keeps construction,
allocation and fault evaluation in the frozen core. The driver records the cache contents and the
start of the attempt before entering construction. Successful work receives normal ownership and
cause entries, and only a successful explicit holder resolution publishes replacement tokens.

On failure, the ownership policy receives every entered allocation from the attempt, including
unfinished parents. It follows parent identity to detect singleton ancestry. The driver emits the
refusal, disposes only completed allocations in descending allocation order with those owners, and
restores the pre-attempt cache contents. Provisional completion records are removed and allocation
serials remain monotone. No rollback disposal runs a parting call. Older ledger entries and token
bindings are unaffected because they were never provisionally overwritten.

The same attempt routine serves explicit resolution, factory invocation and parting calls. Each
supplies its build scope and its refusal location separately. Factory capture, nearest-mark lookup
and ordinary teardown ordering are repaired in hold.py, pin.py and tear.py.

The sealed model uses another representation: it carries singleton ancestry downward during
construction and removes provisional cache entries by allocation identity on failure. Four
author-side variants additionally exercise descending-serial teardown, downward ownership,
outer-to-inner mark search and a scope-indexed token table; all use cache-delta rollback rather
than the reference's saved-cache method.
"""

verification_explanation = """
The verifier compares the full ordered dump on 42 named cases, 300 generated lifetime streams
and 300 generated construction/fault/retry streams. Every record must match; there is no partial
credit or tolerance. The construction generator combines random dependency graphs and fault
changes with connected retry sequences that borrow older instances, fail, recover and invoke
captured factories across scope boundaries. Named examples distinguish unfinished allocations
from completed objects, old cache entries from provisional entries, and admission from construction.

Expected named outputs are stored in sealed ground truth and checked against an independent model.
All 22 legacy expected sequences remain intact. Eight new literal traces were also checked by hand
in author-side validation. Generated expectations are recomputed from a fresh nonce in the grader.
The model shares no implementation code with the reference or submitted policies.

Only the seven declared policy artifacts are overlaid on the pristine tree. Submitted code runs
as uid 1002 with a 600-second execution bound and one inherited report descriptor. The report path,
answer model and reward are protected from that user. The trusted grader runs after surviving
submitted processes are reaped; reward starts at zero and changes only after all assertions pass.

Frozen modules are checked by code fingerprints and the executed tree is compared with pristine
files. Two integrity probes return correct semantic traces while changing a frozen function or
source file; each must fail its corresponding integrity assertion. Other probes implement the
previous four-fix strategy, graph-wide fault prechecks, incomplete ancestry, wrong rollback order,
disposal of unfinished objects, disposal restricted to one owner, cache leakage, cache over-clearing,
early token rebinding, rollback parting calls and forged output.
"""

category = "Software"
subcategory = "Systems"

tags = [
  "object-lifetimes",
  "scope-capture",
  "teardown-ordering",
  "dependency-graphs",
  "transactional-rollback",
]

expert_time_estimate_hours = 8

relevant_experience = """
I have owned the wiring layer of a service platform where every team registered their own
components, and the two incidents that cost the most were both this: a long-lived
component holding a factory, calling it during a later request, and the object it built
being torn down with a scope that had nothing to do with it. The first time it showed up
as a connection being closed underneath a background worker, and it took a week, because
every test we had resolved things directly and every one of them passed. The second time
was the same bug reached through a decorator. What I took from both is that the ownership
rule is easy to state and almost nobody implements the capture where it actually happens,
and that the failure is invisible to any test you would think to write, because it needs a
scope opened after the holder was built.
"""

