[task]
name = "afterquery/shard-redraw-resume"

[metadata]
author_name = "Shiela marie"
author_email = "aurigue.shielamarie20@gmail.com"

difficulty_explanation = """
Every rule is in the brief. What is not in the brief is which of the structures those rules seem
to ask for survive all of them at once, and that is the work.

The first plan is the one this code always gets: permute the epoch, hand rank r the slice
`order[r::ranks]`, run a cursor down each rank's slice, and put the cursor in the checkpoint.
Most of it is even close. It is defeated in stages, and the stages arrive in an order that lets
the first two look like patches.

The first is that a step holding a non-finite sample is skipped and has still taken its window,
so the position and the applied count move at different rates and the checkpoint cadence runs on
one while a return lands on the other. The second is that a return may come back on a different
number of ranks, which redraws the order for the epoch the run was in, so a saved position
addresses a different sequence of samples than the one that produced it.

The third is the one with no line to fix. An epoch hands each sample out once, and after a
redraw the new order runs over ground the old one already covered, so a window is the next
samples the epoch has *not* fed rather than the next positions. The question a window has to
answer is therefore asked of a sample and not of a position, and nothing in the tree answers it:
the shipped engine keeps a scalar cursor and has no ledger at all, so there is no wrong line
here, only a structure that cannot say the thing. Two derivations follow, and neither is stated.
The shuffle is a cycle-walking Feistel and is therefore invertible, so a sample's position under
any order is one evaluation away - an inverse ships nowhere and has to be built. And two walks
under the same order collapse into one, because a walk leaves nothing unfed behind it, so an
epoch needs one number per rank count rather than one record per leg. That second one is also
what makes a four-hundred-leg run affordable at all, and what makes `rows` minus the samples fed
the right test for whether the epoch is out - everything still unfed lies ahead of the head.

Two families decide what a correct structure is allowed to cost, and the fast path in each
follows from one of those invariants rather than from a technique. Measured against the 120
second limit for the whole graded set: building the epoch order to index it takes 393 to 398
seconds on one sixty-million-row program, and re-walking the epoch from the top on every step
takes 18 to 36 seconds on each of those and 218 to 222 on each four-hundred-leg program. Both
produce the reference's traces exactly on everything they finish. The reference settles all 347
graded programs in eleven seconds; the limit is the only thing separating the three.

Around those sit the ordinary decisions, each a fence with two sides: a window dealt out with
the micro-batch index outside the rank index, a tail given up a whole window at a time, a scale
that stops at an exponent of zero, a growth counter that counts a run of successes and not a
total, a return with no checkpoint behind it that goes back to the scale the run opened on, and
a resize that takes effect where it is given. All six editable files ship wrong. The only
feedback a wrong structure gets is the trace itself, and every case that turns on the ledger
sits behind a stretch of ordinary steps that pass.

Identifiers are in a terse legacy register - `rig/`, `draw`, `cut`, `scal`, `turn`, `keep`,
`lead`, `st`, `sc`, `gt`, `nf` - short but never misleading, and no name misdescribes what it
holds. That is a choice about the register of real training-loop code and not an obstacle: each
one is recoverable from what calls it, and the domain names the rules turn on are left whole.

The generated programs come in nine families, shaped at the redraw, at a return to a rank count
the epoch has already walked under, at the skip and at the epoch edge, with datasets smaller
than one window and the two scale families. In a training run these are the rare days. They are
also exactly where this class of bug lives.
"""

solution_explanation = """
Six files, settled in the order the rules force rather than one that is tidy.

`draw.py` is where the epoch's ledger is read and is the largest of the six, because the ledger's
shape is the problem. It carries an inverse for the shuffle, built by running the Feistel rounds
the other way and walking the cycle backwards, so asking where a sample stands under any order
costs one evaluation. It holds one head per rank count the epoch has walked under, not one record
per leg, because a second walk under an order starts where the first stopped and everything
behind that head is fed either way. A window is then the next samples from the current head that
no head covers, and it is dealt out in chunks of `micro` with the accumulation index outside the
rank index.

`cut.py` is the width and the edge. What is left of an epoch is counted in samples it has not
handed out and never in positions it has walked, and that is sound because a walk leaves nothing
unfed behind it, so the remainder is always still ahead.

`scal.py` is two counters where only one is obvious: the scale halves on a skip and stops at
zero, and the counter that matters is the run of successes since the last skip, not the total of
applied steps. `turn.py` is one attempted step and exists to keep the ledger and the applied
count apart - the window is taken either way, the count moves only when the step is applied.

`keep.py` holds what cannot be recomputed: the epoch, its ledger, the samples fed, the applied
count and the scale state. The ledger is copied rather than referenced, because the epoch keeps
walking after the checkpoint is taken. The rank count is deliberately not in it - a run comes
back on whatever it is given, and the order it then walks is drawn for that. `lead.py` drives
the legs, applies a return where it is given, and tests the epoch edge before a step is
attempted, which is what lets a return end an epoch with no step in it.

An expert works in that order because each file consumes the one before it. The same contract is
implemented two further ways in the authoring set - one holding the whole engine in a single file
with the ledger as a list of pairs, one over a dict with the shuffle memoised both ways - and
both score 1, so the shape is visibly not what is graded.
"""

verification_explanation = """
Only the six files under `/app/rig/` are taken from the agent. The verifier lays them over its own
pristine copy of the tree, so the parser, the shuffle, the trace format and the driver entry point
are its own and nothing else the agent touched can change what a program prints. Every trace is
compared line for line.

Correct is defined twice over. Twenty-six hand programs, one per graded decision plus the
must-still-work side of each fence, are checked against `gt.json`, frozen before the grading file
was written; the grader first asserts that the sealed model still reproduces `gt.json` exactly, so
a model that had drifted could not quietly redefine correct. Three hundred and twenty-one further
programs are generated inside the verifier from a seed drawn after the agent's container is gone,
across nine families that concentrate returns on a new rank count, returns to a rank count the
epoch has already used, skips that push the cadence out of step with the windows, preemptions with
no checkpoint behind them, sets smaller than one window, and the two scale families. A submission
cannot have seen them, so fitting the shipped examples fails, and so does carrying an answer key.

The fences run both ways. Handing a sample out again after a redraw fails `back-now`; consulting
only the current order fails it too; counting what is left of an epoch in positions fails
`roll-empty`; forgetting the ledger at a checkpoint fails `back-redraw` and holding it by
reference instead of by copy fails `kill-same`. Dealing the window rank by rank fails
`deal-order`, sample by sample fails `back-hold`, and sharding the epoch per rank fails it as
well. Giving up the tail a micro-batch at a time fails `drop-window`. Holding the position across
a skip fails `plain-two`, and counting a skip as applied fails it too. A growth counter that
totals applied steps fails `plain-two`, a scale with no floor fails `scale-floor`, keeping the
live scale when no checkpoint exists fails `kill-none`, holding the old order across a resize
fails `back-now`, and deferring the new rank count to the epoch boundary fails it as well.
Rolling after a step instead of before one fails `deal-one`, and charging a roll to the run
budget fails `drop-none`. The everyday side is checked by `deal-one`, `drop-none`, `scale-grow`,
`back-hold` and `plain-two`, none of which may change.

Thirty cheats score 0. Eighteen are wrong readings, each caught by the enumerated case named for
it. Two are exactly correct and too expensive: the epoch order built into a list, and the epoch
re-walked from the top on every step. One is a forgery carrying the frozen answers for all
twenty-six enumerated programs, keyed on the program rather than on the order the worker runs
things in; it reproduces every one of them and fails on the programs it could not have seen. The
other nine are isolation probes: the answer key, a hijacked driver, a planted record, a record
planted and the worker exited clean before it could be overwritten, malformed records, privilege,
a shrunken population, a late reward, and a rewrite of the parts of the tree the verifier does not
take. Two independently written correct engines score 1.

The submitted code runs unprivileged, in a session of its own, under the wall clock that is also
the task's execution limit. The model and the frozen answers sit in a directory that uid cannot
read, so code running inside the verifier cannot compute its answers from them. The reward
defaults to 0, is written last by the privileged stage into a root-owned directory locked before
any agent code runs, and anything the run left behind is reaped by owner first.
"""

category = "ML"

subcategory = "Training"

tags = [
  "data-parallel-sharding",
  "gradient-accumulation",
  "checkpoint-resume",
  "dynamic-loss-scaling",
  "elastic-world-size",
  "index-computable-shuffle",
]

expert_time_estimate_hours = 12

relevant_experience = """
Having worked on the data path of a distributed training stack: the part that decides which
samples a rank consumes, what a checkpoint has to hold for a run to come back where it left off
rather than near it, and what all of that means when a preempted job returns on a different number
of ranks and the partition it was reading is redrawn underneath it. Familiarity with the fact that
a step the scaler skips has still consumed its batch, so the applied count and the epoch's
progress are two different clocks; that once an order is redrawn mid-epoch the only honest
question is which samples the epoch has already handed out, not how far down a list it got; and
that an epoch shuffle over a set too large to materialise has to be a function you can evaluate,
and invert, at a position. Comfort with reading a training trace as evidence, and with the
difference between a data pipeline that is correct and one that is affordable at the size the job
actually runs at.
"""

