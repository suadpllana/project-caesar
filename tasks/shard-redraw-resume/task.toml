artifacts = [
  "/app/rig/draw.py",
  "/app/rig/cut.py",
  "/app/rig/scal.py",
  "/app/rig/turn.py",
  "/app/rig/keep.py",
  "/app/rig/lead.py",
]

[task]
name = "afterquery/shard-redraw-resume"

[metadata]
author_name = "Shiela marie"
author_email = "aurigue.shielamarie20@gmail.com"

difficulty_explanation = """
Every rule is in the brief. What is not in the brief is which of the structures those rules
seem to ask for survive all of them at once, and that is the work.

The first plan is the one this code always gets: permute the epoch, hand rank r the slice
`order[r::ranks]`, run a cursor down each rank's slice, and put the cursor in the checkpoint.
Most of it is even close. It is defeated in three stages, and the stages arrive in an order that
lets the first two look like patches.

The first is that a step holding a non-finite sample is skipped and has still read its window.
The position and the applied count therefore move at different rates, and since the checkpoint
cadence runs on the applied count while a return lands on a position, neither can be recovered
from the other. A cursor derived from the step count is exactly right until the first skip. The
second is that a return may come back on a different number of ranks, which redraws the order
for the epoch the run was in. The saved position now addresses a different sequence of samples
than the one that produced it, and every per-rank slice, per-rank cursor and count of an epoch's
steps worked out before the resize is a quantity of a geometry that is no longer in force. That
one is not a patch. The stable coordinate is the position in the epoch order and nothing else,
every window is derived from it where it is needed, and the epoch edge has to be tested before
a step is attempted so that a return on more ranks can end an epoch with no step in it at all.

Two scale families decide what a correct structure is allowed to cost, and the fast path in each
follows from an invariant instead of a technique: the order is a permutation evaluated one
position at a time, and a leg's state is what a checkpoint already holds. Measured against the
60 second limit for the whole graded set, building the epoch order and slicing the window out of
it takes 382 to 389 seconds on one sixty-million-row program, and rebuilding the run state by
replaying the run on every return takes 42 to 52 seconds on each of the three four-hundred-leg
programs. Both produce the reference's traces exactly on everything they finish. The reference
settles all 298 graded programs in under two seconds; the limit is the only thing separating
the three.

Around those sit the ordinary decisions, each a fence with two sides: a window dealt out with
the micro-batch index outside the rank index and not the other way round, a tail dropped a whole
window at a time and not a micro-batch at a time, a scale that stops at an exponent of zero, a
growth counter that counts a run of successes and not a total, a return with no checkpoint
behind it that goes back to the scale the run opened on, and a resize that takes effect where it
is given. All six editable files ship wrong. The only feedback a wrong structure gets is the
trace itself, and the resize cases sit behind every plain case in every program that has them.

Identifiers are in a terse legacy register - `rig/`, `draw`, `cut`, `scal`, `turn`, `keep`,
`lead`, `st`, `sc`, `gt`, `nf` - short but never misleading, and no name misdescribes what it
holds. That is a choice about the register of real training-loop code and not an obstacle: each
one is recoverable from what calls it, and the domain names the rules turn on are left whole.

The generated programs come in eight families, shaped at the resize, at the skip and at the
epoch edge, with returns on more ranks and on fewer, preemptions with no checkpoint behind
them, datasets smaller than one window, and the two scale families. In a training run these are
the rare days. They are also exactly where this class of bug lives.
"""

solution_explanation = """
Six files, settled in the order the rules force rather than one that is tidy.

`cut.py` is the window arithmetic and nothing else: how wide one step is, and whether the epoch
still holds a whole one. Both are computed from `rows - seen` at the moment they are asked, and
never from a step count worked out when the epoch opened, because the rank count can change in
the middle of an epoch and a count taken at its start belongs to a geometry that has gone.

`draw.py` turns positions into samples and keeps nothing. The order is evaluated one position at
a time through the frozen shuffle, so a run costs the samples it consumes and not the size of
the set, which is what the sixty-million-row program is there to insist on. The window is cut
out of the order first and dealt out after: chunk `j * rank + r` of it, `micro` wide, is what
rank `r` feeds at accumulation `j`, so consecutive positions travel across the ranks before they
travel down the accumulations.

`scal.py` is two counters where only one of them is obvious. The scale halves on a skip and
stops at zero; the counter that matters is the run of successes since the last skip, not the
total number of applied steps, and those two agree on every program that never skips.

`turn.py` is one attempted step, and exists to keep the position and the applied count apart:
the window is consumed either way, the applied count moves only when the step is applied.
`keep.py` holds what cannot be recomputed - the epoch, the position, the applied count, the
scale and its counter - and deliberately not the rank count, because a run comes back on
whatever it is given and the order for the epoch is drawn for that.

`lead.py` drives the legs. A return changes the rank count where it is given, so the rest of the
epoch is re-windowed under the new width from wherever the position stands. The epoch edge is
tested before a step is attempted, which is what lets a return on more ranks end an epoch with
no step taken in it, and rolling costs nothing out of the budget a `run` names because the
budget counts steps attempted.

An expert works in that order because each file consumes the one before it: the arithmetic
decides what a step may take, the lookup decides what it reads, the step decides what moves, the
checkpoint decides what survives a preemption, and the driver decides what a return re-derives.
The same contract is implemented two further ways in the authoring set - one that holds the
whole engine in a single file over a plain list, one that caches the window it is standing on
and keeps the checkpoint as an immutable record - and both score 1, so the shape is visibly not
what is graded.
"""

verification_explanation = """
Only the six files under `/app/rig/` are taken from the agent. The verifier lays them over its
own pristine copy of the tree, so the parser, the shuffle, the trace format and the driver
entry point are its own and nothing else the agent touched can change what a program prints.
Every trace is compared line for line.

Correct is defined twice over. Twenty-two hand programs, one per graded decision plus the
must-still-work side of each fence, are checked against `gt.json`, frozen before the grading file
was written; the grader first asserts that the sealed model still reproduces `gt.json` exactly,
so a model that had drifted could not quietly redefine correct. Two hundred and seventy-six
further programs are generated inside the verifier from a seed drawn after the agent's container
is gone, across eight families that concentrate returns on a different rank count, skips that
push the cadence out of step with the windows, preemptions with no checkpoint behind them, sets
smaller than one window, and the two scale families. A submission cannot have seen them, so
fitting the shipped examples fails, and so does carrying an answer key.

The fences run both ways. Dealing the window rank by rank fails `deal-order` and `back-now`;
sharding the epoch per rank fails `back-hold`; a run on one rank count with no preemption has to
keep working, which `deal-one`, `drop-none`, `scale-grow` and `plain-two` check. Dropping the
tail a micro-batch at a time fails `drop-window`. Holding the position across a skip fails
`plain-two`, and counting a skip as applied fails it too. A growth counter that totals applied
steps fails `plain-two`, and a scale with no floor fails `scale-floor`. Storing the applied count
and multiplying the position back out of it fails `save-pos`. Returning to the top of the epoch
fails `back-redraw`, keeping the live scale when no checkpoint exists fails `kill-none`, holding
the old order across a resize fails `back-now`, and deferring the new rank count to the epoch
boundary fails it as well. Rolling after a step instead of before one fails `deal-one`, and
charging a roll to the run budget fails `drop-none`.

Twenty-six cheats score 0. Fourteen are wrong readings, each caught by the enumerated case named
for it. Two are exactly correct and too expensive: the epoch order built into a list, and the run
state rebuilt by replaying the run on every return. One is a forgery carrying the frozen answers
for all twenty-two enumerated programs, keyed on the program rather than on the order the worker
runs things in; it reproduces every one of them and fails on the programs it could not have seen.
The other nine are isolation probes: the answer key, a hijacked driver, a planted record, a
record planted and the worker exited clean before it could be overwritten, malformed records,
privilege, a shrunken population, a late reward, and a rewrite of the parts of the tree the
verifier does not take. Two independently written correct engines score 1.

The submitted code runs unprivileged, in a session of its own, under the wall clock that is also
the task's execution limit. The model and the frozen answers sit in a directory that uid cannot
read, so code running inside the verifier cannot compute its answers from them. The reward
defaults to 0, is written last by the privileged stage into a root-owned directory locked before
any agent code runs, and anything the run left behind is reaped by owner first.
"""

category = "ML"

subcategory = "Training"

tags = [
  "data-parallel-sharding",
  "gradient-accumulation",
  "checkpoint-resume",
  "dynamic-loss-scaling",
  "elastic-world-size",
  "index-computable-shuffle",
]

expert_time_estimate_hours = 10

relevant_experience = """
Having worked on the data path of a distributed training stack: the part that decides which
samples a rank consumes, what a checkpoint has to hold for a run to come back where it left off
rather than near it, and what all of that means when a preempted job returns on a different
number of ranks. Familiarity with the fact that a step the scaler skips has still consumed its
batch, so the applied count and the position in the epoch are two different clocks; that a
per-rank cursor stops meaning anything the moment the partition it indexes is redrawn; and that
an epoch shuffle over a set too large to materialise has to be a function you can evaluate at a
position instead of an array you build. Comfort with reading a training trace as evidence, and
with the difference between a data pipeline that is correct and one that is affordable at the
size the job actually runs at.
"""

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

