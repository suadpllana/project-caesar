[task]
name = "afterquery/share-register-screen"

[metadata]
author_name = "Suad Pllana"
author_email = "suadpllana12@gmail.com"

difficulty_explanation = """
The tree is a working sanctions screen with the wrong reading of one sentence, and the
wrongness is coherent rather than broken. It walks the register once, asks of each company
whether the parties it has on its list took more than half the seats, and adds the ones
that did. That is the shape of every screening tool anyone has read, so it is the shape a
frontier agent reconstructs from its prior, and it is wrong twice.

The first is that the list is closed under itself and the walk has to be repeated. A
company the list can appoint the board of votes the way the list votes, so its own shares
join the hand and can carry a further company, and a company that fell short on one pass
can carry on the next without a share moving. Sweeping the register once misses that
whenever a holding runs backwards through the incorporation order, which is 24 percent of
the registers we grade. This half announces itself: /app/regs/ring.txt comes back with a
company off the list on a row that says the list took two of its three directors, and an
agent that fixes the sweep makes that contradiction go away.

The second does not announce itself and it is where the task lives. A board is not shared
out in proportion, it is filled a seat at a time by running averages, and the seats a
group of holders takes standing together are not the seats its members take standing
apart. The screen asks what the parties on the list CAN appoint, so they have to arrive at
the meeting as one hand. Summing what each of them won separately is short by a seat
wherever two of them would have carried one between them, and that is 11 percent of graded
registers on the determination alone, more once the seat list is compared. Nothing in the
tree says so, no register in /app/regs is annotated, and the screen prints a perfectly
plausible answer either way.

The two interact rather than sitting side by side, which is what stops a half-recognition
from landing. The natural implementation of the first is a fixpoint that asks the shipped
seat allocation for each company's board and counts the seats whose taker is on the list.
The second takes that count away: after the collapse no member of the list holds a seat
under its own name, so the field the first answer reads stops meaning what it meant, and a
submission that finds the collapse and keeps the old count reaches an empty list on every
register. Finding the collapse also changes which companies are on the list, which changes
the hand, which changes boards already settled, so the sweep has to be re-run against it.

There is no oracle for any of it. The screen runs whatever rules it is given and prints
records that add up under all of them, the environment ships no expected output, the brief
states requirements without stating how to satisfy them, and the graded set is three
hundred and twenty registers built inside the verifier from a nonce made after the agent
has stopped, so a reading that fits the six registers in the tree carries no information
about whether it fits the rest. The tree ships with no comments anywhere and its
identifiers are in the register of ordinary internal code, so the filing language, the
nominee resolution, the treasury rule and the class weights have to be recovered from
behaviour instead of from names.
"""

solution_explanation = """
The reference is about forty lines across three files and one file it leaves alone. It is
written from the requirement backwards: a company is on the list when the parties already
on the list can appoint more than half of its directors, and the whole of the work is
taking those two words, already and can, at face value.

Already makes the list a closure. The sweep starts from the parties the programme named
and repeats whole passes until a pass adds nobody, re-asking companies that fell short,
because the hand grows every time the list grows and the seats it takes are recomputed
against the whole meeting. No ordering of the companies replaces the repetition, since two
companies can carry each other and only fall out together.

Can makes the list one voter. voice.py builds the vote map a company's meeting sees and
gives every holder on the list the same key, so the shipped allocation in reg/poll.py fills
the seats against one hand of their combined size rather than against several small ones.
The collapse is keyed on the party that casts the vote and not on the party the register
records, which is what makes a nominee on the list bring nothing when it holds for an
outsider and an outsider bring everything when it holds for the list. tally.py then counts
the seats that hand took, which is a different question from how many takers are on the
list, and applies the majority.

note.py needs no change at all, and establishing that is part of the work rather than an
accident: a file being editable is not evidence that it is wrong.

Five alternative correct implementations are kept in the authoring directory and all five
score 1 through the real verifier: the closure by a worklist instead of repeated passes,
the sweep walking the register backwards, the combined hand assembled before the
singletons instead of alongside them, the seat count reached from the other side of the
board, and one that names the combined hand so that it sorts after every party id rather
than before one. That last is not decoration. It disagreed with the reference the first
time it ran, on registers where a seat came down to two hands on the same average, which is
a seat decided by the name a submission chose. Registers are now generated tie free by
construction and every one that ships is checked, so the name cannot matter and the five
agree record for record.
"""

verification_explanation = """
The rebuilt screen is driven over every register and graded on one thing, all or nothing:
the determination record for each company, in incorporation order, carrying the company,
whether the list holds it, how many of its seats the list took, how many seats it has, and
who took each seat.

Two register sets are driven. Twenty-three are enumerated, one per rule, each named for the
reading it exists to fail, and including the must-still-work side of every fence: a company
the list carries alone and one it does not, a hand of two that carries and a hand of two
that falls short, a nominee that brings votes and a nominee that takes them away, a board
where the list takes exactly half. The other three hundred and twenty are built inside the
verifier container from a nonce made out of /dev/urandom at trial time, after the agent has
finished, and their expected records are produced afterwards by the sealed model. Those
registers did not exist when the submission was written. That is what stands in place of a
work counter, and it is stronger, because what is compared is the whole determination
rather than a summary of it: there is no number to assign and no table to paste. The
generated registers are tie free by construction and every enumerated one is checked,
because a seat taken on a tied average would be settled by the name a submission gives to a
hand of several holders, which is its own business and not a graded quantity.

Expected records come from tests/oracle.py, a second implementation written from the
specification rather than from the tree and sharing no code with it: the filings are folded
into a flat list of movements instead of applied to a running book, the board is filled by
comparing exact rationals instead of by integer cross multiplication, the closure is driven
by a worklist instead of by whole passes, and nominee chains are flattened up front instead
of walked per lookup. The two agree on every record of 4500 registers, which is the evidence
that what is graded is the specification and not one author's bug. The ground truth is
believed only where the model reproduces it, and that check runs at verification time.

Deliberately not graded, because two correct implementations differ on them: how many times
a submission consults the register, what it caches, the order it sweeps in, and the name it
gives a combined hand. Five alternative correct implementations are required to score 1 and
all five do.

Since the run executes agent code in a shared interpreter, four more things are attested.
The executed tree outside the four declared artifacts must be byte-identical to the pristine
copy afterwards, and the comparison counts the files it found first, because a comparison
against a directory that is not there passes every file it never looked at. Every frozen
entry point is fingerprinted as it actually stood in the running interpreter, at import and
again when the last register was done, against digests the grader derives by compiling the
pristine sources without executing them. The interpreter's own tally of entries into the
seat allocation and the register reader, kept in a closure the runner owns, has to be
consistent with the register set and the instrumentation still armed at the end. And the
report carries the run nonce, so a report planted before the run cannot pass.

Twenty cheats were run in the real two-image trial and all score 0, each caught by the
layer it was aimed at rather than by an import error. Ten are the reference with exactly one
decision made the way a solver who missed one piece would make it, generated by swapping an
anchored block in the reference source: every holder standing alone, one sweep of the
register, a company that falls short never asked again, a hand made only of the named
parties, a hand collapsed on the record holder instead of the caster, half the board taken
as enough, more than half the votes taken as the test, the seat list written under the
takers' own names, the record's seat count read as the seats the list took, and a collapse
counted by looking for members among the takers. Eight are reward probes built on the
shipped tree, since a probe built on the reference does the real work and scores 1 for
honest reasons: a double-forked process writing the reward after grading starts, a planted
report, a planted report followed by a hard exit, a privilege probe, a read of the ground
truth, a sweep of everything the run's uid can reach, and a rewrite of a frozen file inside
the tree being executed. Two are the opposite and are built on the reference with every
answer correct, because a probe that fails on its own answers cannot tell you whether the
layer it attacks fires at all: one rebinds the frozen seat allocation to a copy of itself
and is caught only by the fingerprint, one switches the interpreter's instrumentation off
from inside a decision and is caught only by the tally. The last is generated from
tests/gt.json: it is the reference determination for every enumerated register, recognised
by a fingerprint of the register in front of it, and the shipped policy on everything else.
It passes all twenty-three enumerated registers and is wrong on twenty-five of forty
generated ones.

The run happens as an unprivileged uid in its own session under a wall clock timeout,
against a tree it cannot write; the reward channel is root-owned and closed before it
starts; the answers, the sealed model and the grader are root-only; and the report is opened
by root in a directory the run cannot enter and handed over as an inherited descriptor, so
the uid running agent code never owns the file its grade comes from. Grading runs afterwards
as root and imports nothing the agent wrote.
"""

category = "Operations"
subcategory = "Compliance"

