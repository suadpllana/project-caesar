  "differential-testing",
]

expert_time_estimate_hours = 7

relevant_experience = """
I have built and argued about ownership and control screening for financial crime teams,
which is where I learned that the interesting part is never the percentages. The case this
task is built from cost a fortnight. Our screen agreed with the regulator on every company
a listed person owned outright and disagreed on a handful where two listed people each held
a minority, and the argument was not about the arithmetic: it was about whether two people
under the same programme show up at a meeting as two shareholders or as one. They arrive as
one, and once you accept that, a board that is filled seat by seat gives them a majority
they do not have separately, so the answer changes for companies nobody had flagged. The
second half was worse. Every company we added by that route is itself a shareholder
somewhere else, so the screen has to be run again with the new list in hand, and again,
until it settles. The old one walked the register once. Nothing crashed and nothing looked
wrong, because a screen that misses a company prints exactly the same kind of row as one
that does not, which is why it took a fortnight and an external review to find.
"""

