difficulty_explanation = """
A storage-engine engineer would do this work while repairing concurrent compaction and
commit validation in a partitioned store. The source catalogue retained by a proposal and
the current physical layout answer different questions. A source that was too wide when
planned stays too wide after its extreme keys disappear. A replacement at the same coordinate
is not the same arrival, while a rewrite preserves the arrival even when its slab changes.

Conflict repair crosses a second boundary. Source selection follows surviving incarnations,
but replacing physical source records follows shared coordinates, including coordinates whose
arrivals changed. The replacement must cover a complete connected source region to avoid
leaving overlapping old and new records. It must also preserve unrelated records, so refreshing
the entire bucket admits work the proposal did not select. Replaying an earlier fold under the
repaired view can change which later slab conflicts. A view that cannot change causes a clash,
including conflicts introduced by the proposal's own prior folds.

Historical source geometry, tentative live contents and the committed layout at push start must
remain separate without copying the whole store at each plan. Narrow changes to both many small
slabs and one heavily fragmented slab require indices that share unchanged state and still
support complete rollback of slab numbers and counts. The synthetic programs concentrate
replacement, missing keys, disconnected sources, repeated reconciliation and retained snapshots.
The small Python service uses terse legacy-style internal names and has no explanatory comments;
its size is not itself a difficulty mechanism.
"""

solution_explanation = """
The reference keeps immutable ordered indices for bucket runs, slab ownership and each
slab's runs. Planning saves the bucket roots, and a range edit rebuilds only the affected index
paths. Each run carries its endpoints, arrival number and physical slab number. The source
indices preserve old geometry while current cuts and puts change the live indices.

A fold first selects whole source slabs from the proposal view, then matches their surviving
incarnations against current runs. Current slab totals distinguish complete selection from a
mixture. A mixture supplies saved-head seeds; alternating coordinate-overlap queries find the
complete source region to replace. The view keeps that repair while tentative roots, counters
and counts return to the push-start state. An unchanged catalogue clashes. This separation lets
an expert establish source entitlement before optimizing snapshot retention and replay.
"""

verification_explanation = """
The verifier overlays only the six declared Python files onto its pristine service. It
executes the submitted code as an unprivileged user under the stated 60-second limit. A separate
root process compares complete traces with sealed expected results. Submitted code cannot read
the model or write the reward directory. The reward starts at zero and becomes one only after
execution, cleanup and all assertions succeed; the verifier also writes a pytest CTRF report.

Literal programs cover ordinary put/cut accounting and slab numbering, historical source
geometry, exact arrival matching, coordinate-based source replacement, holes, multi-step
reconciliation, replay and no-progress clashes. Deterministic generated programs combine those
rules, including wide, deep and retained-snapshot workloads. The original scalar-age solution
and targeted wrong interpretations are negative controls. Independent implementations check
that the expected traces follow the behavioral contract rather than one internal structure.
"""

