relevant_experience = """
I work on exchange infrastructure, which means most of my hard bugs are matching bugs and
almost none of them look like bugs when they land. The one this task is built from cost a
week: a fill-or-kill order that was correctly rejected, and correctly left nothing behind
except the two resting orders it had already cancelled on its way through, because the
engine decided admission by walking the book and unwinding the fills rather than by
deciding first. Nobody noticed for a month, because the only symptom was that a
participant's own quotes went missing on days when they sent that order type, and the
fills that did print were all correct.

What made it expensive is that the natural design - walk it, and put it back if it comes
up short - is right in every situation you would write a test for, and wrong exactly when
the walk has side effects that are not fills. The interaction with a price collar measured
against the last trade is the same bug wearing a different hat: a level that gets cleared
by a self-match cancellation does not move the reference, so the walk stops one gap
earlier than the arithmetic says it should, and every venue I have worked on has gotten
that wrong at least once. The disclosure rule is the one newcomers always get backwards -
they fill the whole resting order because that is what the size field says - and the
activation rule is the one they get right and then make unaffordable.
"""

