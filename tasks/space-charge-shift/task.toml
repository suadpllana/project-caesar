[task]
name = "afterquery/space-charge-shift"

[metadata]
author_name = "Suad Pllana"
author_email = "suadpllana12@gmail.com"

difficulty_explanation = """
Who does this for a living: an engineer who owns the metadata and accounting layer of a
shared object store - the part that decides whose budget a file counts against, keeps the
per-team totals right while folders are reorganised underneath it, and refuses the write that
would put a team over. Storing identical content once is what makes that hard, because the
charge then answers to a link some other team made.

The graded data is synthetic. Scripts combine folders, links, content shared between assets,
claims, checkpoints and limits set close to the standing usage, and the concentration of
sharing and rollback is deliberately adversarial. The scale family is a store of 4500 assets
over some three thousand contents, whose folder of several thousand links moves between two
spaces four thousand times while the usage is asked for two thousand times. Six of those run
inside one 60-second budget.

The first plan is coherent and wrong in four places at once. Charging each asset for its own
content double-counts everything shared and settles the wrong link when a sharer drops out.
Recording the space when a link is made goes stale the moment a folder moves, which creates and
destroys no link at all. Testing the limit as each change lands refuses batches whose produced
state is fine and admits ones that are not. Indexing links in the order the accounting saw them
matches their ages exactly until a rollback restores them newest first, and then the oldest link
is no longer the one at the head.

None of those is visible in ordinary testing. A store with unique content, no rollback and
generous limits behaves identically under all of them, and the only oracle is the store itself,
which prints the submitted reading back. The one implementation that dodges the whole question -
recompute each space from the tree whenever anything asks - stays exactly correct and does not
fit the stated limit, measured at about twenty seconds for a single wide script against 1.7
seconds for the reference on the whole graded set.

The environment is small and deliberately terse: no comments or docstrings, and short internal
names in the register of long-lived code. The difficulty is reconciling ownership, aggregation,
the limit gate and the rollback path, not finding files.
"""

solution_explanation = """
The reference indexes the links of each content by age, so the owning link is the smallest age
present and stays right when a rollback puts an older link back. The charge sits on the folder
that link is in and on every folder above it, which makes a space's usage the aggregate held at
its root and a folder move two walks up ancestor chains instead of one walk down a subtree. That
choice is what a working store does, and it is what the execution limit leaves room for: the
same aggregate answers both what a space holds and what a folder would take with it.

Deciding an operation is separate from applying one. The gate reads the effect list the runtime
built, works out for every content it touches where the oldest link would be in the state the
operation produces, turns that into per-space deltas, and refuses only a space that ends over
its limit and higher than it started. Nothing is written until that answer is known, so a
refused operation leaves no trace. Applying an operation is then a per-change update: each
record moves the charge if it changed the head of a content's link index, and a content change
carries one asset's links from one index to the other and re-settles both. The rollback needs no
special case, because the journal replays inverse records with the ages they carried.

The independent model shares no code with any of it. It keeps its own store and its own op loop,
holds the links of a content in one age-sorted list, decides an operation by applying it and
reading every space total afterwards, rolls the mutations back one at a time when the limit
refuses, and restores a whole-store snapshot on a checkpoint rollback rather than following the
journal.
"""

verification_explanation = """
The verifier compares the line printed after every operation, exactly, and scores
all-or-nothing. Thirty hand-written scripts carry one graded decision each plus the
must-still-work side of every fence - a batch that has to be refused and the same batch against
a limit with room, a link that is not the oldest costing nothing, a space coming down while
already over. They are checked against a ground truth frozen before the verifier was written,
and the sealed model has to reproduce all of it before any grading counts. The two scripts that
ship in the agent's tree are graded too, from the verifier's own copy of them. On top of that,
279 scripts are generated inside the verifier from a nonce drawn after the agent has finished,
over six families: unshaped, shared content, content changes, checkpoints and claims, limits set
close to the usage, and the wide family that carries the execution limit.

The submitted files run under an unprivileged uid, in a pristine copy of the store with only the
four declared paths overlaid, in its own session and under a wall-clock bound. The reward
channel is root-owned, locked before that starts and defaulted to zero. The trusted grader runs
afterwards, checks the worker's exit status, reaps anything left running as the sandbox uid,
treats the worker's output as hostile input, and imports nothing the agent wrote. A recomputing
implementation is correct and does not finish; a reward written by anything other than the
grader cannot land.
"""

category = "Software"
subcategory = "Systems"

tags = [
  "quota-accounting",
  "content-addressed-storage",
  "reference-ownership",
  "incremental-aggregation",
  "checkpoint-rollback",
]

expert_time_estimate_hours = 8

relevant_experience = """
I work on the metadata layer of a shared asset store: the index that answers where a file is
linked, which team is charged for it, and whether the next write fits. Deduplication is where
the accounting stops being arithmetic. One copy of the bytes can be reached through links that
several teams made, so the bill has to belong to exactly one of them, and the rule we settled on
- the team holding the oldest link pays until it drops that link - is the one that survives
teams copying each other's work. It also produces the support ticket I have answered most often:
a team reorganises its folders, a project moves, and a bill arrives for content nobody in that
team ever touched. The fix people write first charges the link, not the content, and it is right
until two teams share a file.
"""

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[agent]
timeout_sec = 14400.0

[environment]
build_timeout_sec = 900.0

cpus = 2
memory_mb = 4096
storage_mb = 10240

gpus = 0
