schema_version = "1.3"

artifacts = [
  "/app/store/dev.py",
  "/app/store/hold.py",
  "/app/store/item.py",
  "/app/store/line.py",
  "/app/store/tally.py",
]

[task]
name = "afterquery/span-claim-charge"

[metadata]
author_name = "Suad Pllana"
author_email = "suadpllana12@gmail.com"

difficulty_explanation = """
Who does this for a living: an engineer on the storage side of a filesystem or volume manager
that supports snapshots, owning the allocator and the space accounting that sits on top of it.
They are the person who gets the bug report saying "I deleted most of a huge file and nothing
was freed", and the one saying "the snapshot claims to use no space, and deleting it gave none
back". Both reports are usually accurate. Both surprise the person who filed them. Answering
either means knowing exactly which volume is charged for which stretch of the disk, and why.

The graded data is synthetic: programs in ten families, each concentrating one situation far
above its natural rate. Overwrites that land where they already are, a device with nothing to
spare, a free map cut into many small runs, snapshots taken and dropped, ranges shared until
several references sit on one block, defragmenting files that are shared and files that are
not, and sets of volumes asked what dropping them together would give back. A census of
unshaped programs put the out-of-room check at one per cent of programs and an allocation
spread across several runs at three. In a working store these are rare, and they are exactly
where this class of bug lives.

The system is small enough to describe in a paragraph. A device is a run of blocks. An
allocation hands back a `span`, one contiguous stretch of them. A `line` is a named set of
`item`s - read that as a volume and its files, or as a snapshot of one - and an item holds
`claim`s, each saying that a range of the item lives at a range of some span. Two lines can
hold claims on the same span, which is what makes a snapshot cheap. One line can hold several
claims on the same span, which is what makes the accounting hard.

The first plan is a reference count on each span, a list of claims per item, allocate and then
splice on a write, and each volume's usage added up from the spans it touches. It is coherent,
it is what a copy-on-write store is remembered as, and it is wrong in four places that only
show up together.

The trouble is that the rules ask two different questions of the same claims, and one count
answers neither. The write path asks whether a block may be overwritten where it lies or has
to be copied first, which is a question about how many claims cover that one block. The
accounting asks whether a span belongs to one volume or to several, which is a question about
which volumes hold claims on it. Picture a span with two claims. If both belong to the same
volume, because one file was cloned into another beside it, the block cannot be overwritten in
place and yet the span is still that volume's alone. If instead the two claims belong to a
volume and its snapshot, both answers flip. A count returns the same number in both cases, and
the two cases differ in both answers, in opposite directions.

The second finding reorders the write path rather than adding a case to it. Blocks are taken
from the free map only after that same write has given back the spans it emptied. So a write
can land on the ground it just freed, and on a full device an overwrite of a file nobody else
shares has to succeed - which means the space check is made against the free total the release
will produce, not against the one standing when the command arrives. What the free map looks
like at that instant then decides how many spans the write becomes, because a request that no
single free run can hold takes the largest run whole and carries on from what is left. So the
claims a write leaves behind are not one per hole, and not one per allocated piece. Allocating
first is a reasonable reading. It passes every program with room to spare and refuses the ones
that have none.

Three further rules each invalidate a structure rather than a line of code. A span is never
split, so overwriting the middle of a file frees nothing, and the free map is a function of
when spans die rather than of how many bytes are live - the first bug report above. A snapshot
puts a second volume on every span the original stood on, so the original has no space of its
own left the instant it is taken, and its next write stops landing in place - the second.
Defragmenting a file nobody shares puts it back on its own blocks, and defragmenting a
snapshotted one cannot, so tidying a file can double what the pair uses between them. Every one
of those changes the addresses that every later command sees, so a wrong reading does not move
a single number: the tail of the program diverges.

Three methods that are exactly correct are over the stated limit. Adding a volume's usage up on
every query takes 90.8 seconds. Choosing the best-fitting free run by looking at all of them
takes 112.3 seconds. Deciding the overwrite-in-place question by walking every item's claims
takes 149.5 seconds. The limit for the whole graded set is 60 seconds, and the reference
settles it in about 11. All three produce the reference's traces exactly, so the limit is the
only thing that separates them. Two independently written correct stores come in at 8.9 and 8.8
seconds, which is how the limit is known not to be tuned to one implementation.

Identifiers are in a legacy register - `spot`, `spare`, `szlist`, `on`, `by`, `cl`, `ats` -
short but never misleading, and no name misdescribes what it holds. That is a choice about the
register of real storage code rather than an obstacle: each one is recoverable from what calls
it.
"""

solution_explanation = """
Five modules, settled in the order the rules force rather than one that is tidy.

`hold.py` gives each span two indexes over the claims standing on it, because the rules ask two
different questions. `on` is the claims themselves, which is what the write path needs: to decide
a range it takes the other claims' windows on that span, unions them, and what is left of the
range is what may be rewritten where it stands. `by` is a count per line, which is what the charge
side needs: a line stands on a span while its count is above zero, and the span is exclusive to it
while `by` holds one name. A span goes back to the free map when `on` is empty, which is why
overwriting the middle of an item frees nothing.

`tally.py` carries referenced and exclusive forward instead of recounting them. The two numbers
move only where a line's count on a span leaves or reaches zero, so the span table calls in at
exactly those moments and the totals move by that span's length; the transitions that matter are
zero to one for referenced, and one to two, and back, for exclusive. It also keeps the spans per
line, because the freed-by-dropping question is asked of a set and no running total can answer it.

`item.py` is the write path, in the order the rules impose. It settles the range one block at a
time into stretches that stay and stretches that are fresh, counts what the fresh ones need,
works out which spans the replacement would empty and checks the room against that total, drops
the replaced claims so those spans go back, takes the blocks, and only then lays them over the
fresh stretches in item order, walking pieces and stretches together so a stretch can straddle
two pieces. Cutting a claim at a boundary keeps the span reference for the part that survives.
The picture an item prints runs adjacent claims together, so where an implementation happened to
cut is not observable.

`dev.py` keeps the free runs in the two orders they are asked for: a start map with the starts in
address order, for the neighbours a release has to merge with, and the lengths with their starts
in length order, so the smallest run that fits is a bisection. `line.py` is the line table, where
a stamp copies each item's claims onto the new line - registering every copy, which is what
collapses the origin's exclusive space - and a drop rips them and sweeps.

An expert works in that order because each module consumes the one before it: the span table
decides what sharing means, sharing decides the charges and the write path, the write path decides
what the allocator is asked for, and the allocator decides where everything lands next. The same
contract is implemented two further ways in the authoring set - one storing an item as an entry
per block so nothing has to be split, with the free map indexed by run length, and one keeping the
claim shape but marking the in-place test off block by block and tracking exclusivity through the
single line that holds a span - so the shape is visibly not what is graded.
"""

verification_explanation = """
Only the five files under `/app/store/` are taken from the agent. The verifier lays them over its
own pristine copy of the tree, so nothing else the agent may have touched can change what a
program prints, and every trace is compared line for line.

Correct is defined twice over. Forty-eight hand programs, one per graded decision plus the
must-still-work side of each fence, are checked against `gt.json`, frozen before the grading file
was written; the grader first asserts that the sealed model still reproduces `gt.json` exactly, so
a model that had drifted could not quietly redefine correct. Three hundred and sixty-six further
programs are generated inside the verifier from a seed drawn after the agent's container is gone,
across ten families that concentrate in-place rewrites, a device with nothing to spare, a
fragmented free map, stamping and dropping, overlapping shares, defragmenting, sets of lines, and
two sizes that exist for the execution limit. A submission cannot have seen them, so fitting the
shipped examples fails, and so does carrying an answer key.

The fences run both ways. Copying on every write fails `keep-sole` and `keep-mixed`; rewriting in
place when a second claim stands on the block fails `keep-shared` and `keep-self`. Releasing a
span when the claim over it is replaced fails `span-hold`; never releasing fails `span-back` and
`merge-runs`. Allocating before the release fails `reuse-own`, and checking the room before it
fails `room-after`, while `room-short` fails a store that stops refusing at all. Taking the first
run that fits fails `alloc-fit`, breaking a tie high fails `alloc-best` and `alloc-low`,
refusing a request no single run holds fails `alloc-split`, and one piece per stretch fails
`lay-straddle`. Charging a line for the blocks it claims fails `ref-whole`; charging it once per
claim fails `ref-once`; calling a span exclusive because one claim stands on it fails
`excl-claims`, and because one line does fails `excl-lines`. A stamp that leaves the origin
exclusive fails `stamp-collapse`, and freed-by-dropping as a sum of exclusives fails `gone-set`.
Defragmenting before the release fails `vac-room`, and going ahead when the release would still
leave it short fails `vac-short`. Printing the coverage where the claims happen to be cut fails
`chart-merge`, and printing anything after the size of an empty item fails `chart-empty`.

Forty-four cheats score 0. Twenty-nine are wrong readings, and an enumerated case separates every
one of them. Three are exactly correct and over the limit - the charges added up per query, the
best fit found by scanning, and the in-place test taken from every item's claims. One is a
forgery carrying the frozen answers for all forty-eight enumerated programs, which passes every
one of them and fails on the generated programs it could not have seen. The other eleven are
probes: the answer
key, a planted record, a record forged after the worker exits, a grader crash, malformed output, a
late reward, a shrunken exam, a hijacked reader, a rewrite of the frozen half of the tree, a
hunt for the grading process, and privilege. Two independently written correct stores score 1.

The submitted store runs unprivileged, in its own session, under the wall clock that is also the
task's execution limit. The model and the frozen answers sit in a directory that uid cannot read,
so code running inside the verifier cannot compute its answers from them. The reward defaults to
0, is written last by the privileged stage into a root-owned directory locked before any agent
code runs, and anything the run left behind is reaped by owner first.
"""

category = "Software"

subcategory = "Systems"

tags = [
  "copy-on-write",
  "extent-allocation",
  "best-fit-allocator",
  "space-accounting",
  "free-space-coalescing",
]

expert_time_estimate_hours = 10

relevant_experience = """
Having built or maintained the allocation and accounting half of a copy-on-write block store:
something that hands out extents from a free map, lets several volumes stand on the same extent,
decides whether a write can be taken in place or has to be copied, and has to say what a volume is
using and what dropping it would give back. Familiarity with the fact that an extent is charged
whole however little of it a volume still references, that a reference count cannot tell sharing
within a volume from sharing between volumes, and that defragmenting a snapshotted file unshares
it and costs space rather than saving it. Comfort with the order a write has to take when the
blocks it frees are the blocks it needs, and with the difference between the free map's address
order and its length order.
"""

