expert_time_estimate_hours = 9

relevant_experience = """
I work on read paths that put a cache in front of a versioned store, which is where this task
comes from: the part that decides whether an answer can be assembled from what is already held
and, if it can, which version it is an answer at. I have written the invalidation side of one of
these and the assembly side of another, and the bugs that cost the most were never in the
lookup. They were in what a cache is allowed to claim: an entry treated as dead the moment a
write overtook it, fragments combined into one answer that had never been simultaneously true,
and a fetch stamped with the time it happened rather than with the last write it actually
reflects. I have also spent enough time on the cost side to know that the search for a usable
version has to be driven off the points where validity changes, because walking versions is
fine in a test and hopeless against a real history.
"""

