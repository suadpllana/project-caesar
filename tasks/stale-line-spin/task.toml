[task]
name = "afterquery/stale-line-spin"

[metadata]
author_name = "Shiela marie"
author_email = "aurigue.shielamarie20@gmail.com"

difficulty_explanation = """
The brief describes a small GPU: multiprocessors with a few block slots each, a cache of four-word
lines per multiprocessor, and an instruction set whose loads, stores, atomics, fences, spin-waits
and streaming sums say which cache they go through. The shipped model is wrong the way a first plan
from the prior is wrong: memory behaves coherently (a store updates every cached copy), each block
carries a cache that dies with it, blocks go to multiprocessor number modulo the device, lines are
replaced least-recently-used, a spinning block is parked until something stores to the word it
watches, and a sum is one read of global memory. Each is the textbook shape of a cache, a scheduler
or a reduction and each is wrong here. It fails 29 of the 42 hand launches and 287 of the 360 small
generated ones. The shipped tree is terse on purpose - short module and field names, no comments or
docstrings - so that nothing in it names a rule or says which structure is the wrong one; the
naming is a design choice, not carelessness.

The first discovery is that the caches are copies and nothing keeps them in step. A
multiprocessor's lines outlive the blocks placed on it; a load answers from the line as that
multiprocessor last filled it; a store updates only the storer's copy; an atomic touches no copy
at all; a fence empties only its own cache. What a block reads therefore depends on which blocks
ran on its multiprocessor before it, which makes placement part of what a load returns. The second
is that a spinning block is not waiting on a word: it is issuing loads, so a neighbour's fill, a
bypassing load or a fence on the same multiprocessor can release it without any store, and a
launch in which nothing can store any more has not necessarily hung.

The third decides the clock. A sum reads one line per issue through its multiprocessor's cache,
so it never repeats a state, and one kind of large launch keeps sums streaming on most
multiprocessors for up to 16 million cycles while the others issue an instruction every few
cycles. Stepping each line is correct and takes 306 seconds on one such launch and more than 450 on
another, against 60 for the whole graded set. Advancing every stream in bulk between device-wide
events is also correct, and takes 231 and more than 450, because the device is never quiet for
long; the reference runs the whole graded set in about 15 seconds on one CPU. What
fits is to carry each multiprocessor forward on its own and to stop only for what it can observe,
and that is exact only with a rule the brief implies but never states: a store reaches a carried
stream only if it lands before the stream's issue on that line, cycle first and multiprocessor
number second, and only through memory, since a copy cached there hides it; a store to a line the
stream already read changes nothing it read; and which cached lines survive a stream's fills is
first-in-first-out arithmetic, so a stale prefetched line is read on a quiet multiprocessor and
pushed out unread next to a neighbour that streams, and a stale waiter is let go at an exact fill.
The plan built on "memory is static between events" is the one that has to be taken apart.

Nothing ships an expected output but one worked example, found by search so that it decides only
conventions the brief states outright, and the only runner is the model under repair. Grading is
exact and all-or-nothing over 42 hand launches, each named for the rule it pins, and 369 launches
generated at grading time from patterns shaped so that each cache, spin and sum rule changes the
output; each of 38 plausible wrong readings fails a named hand launch.
"""

solution_explanation = """
The reference keeps the machine exactly as the brief states it and carries stretches forward
where that is exact. `line.py` is one multiprocessor's cache: a dict from line number to its four
words in fill order, where a hit reads without reordering and a fill into a full cache drops the
first entry. `mem.py` holds global memory and one cache per multiprocessor for the whole launch,
reads a word or a whole line the way a load of either kind would, keeps running sums of memory by
chunks of lines so a range of lines can be summed at once, and calls a hook before every write
lands. `place.py` puts the next block on the multiprocessor with the most free slots, ties to the
lower number. `turn.py` keeps the slot that issued last. `step.py` executes one instruction; a sum
keeps its next line, lines left and running total on the block.

`clock.py` runs wake, place and issue each cycle for the multiprocessors that need it. When every
ready block on a multiprocessor sits at a sum or a spin, it opens a lane: the run of cycles over
which every issue there is regular - a cached sum missing and filling, a bypassing sum reading an
uncached line, a spin attempt failing and changing nothing. Over a lane the cache moves only by
fills, first in first out, so whether a line cached at the start is still there at a given issue
is the count of fills before it against its place in the queue, and the lane ends before the first
issue that might not be regular, after a sum's last line, or when a block of its own wakes or is
placed. The before-write hook carries forward, up to the write, every lane that reads the written
line from memory or holds a bypassing spinner on it, through the writing cycle when the lane's
multiprocessor issues first in it. Carrying a lane forward is arithmetic: each block took one issue
in k, each sum added a range of memory, the cache is its surviving old lines followed by its last
fills, the rotation sits on the block that issued last. A cycle in which one multiprocessor alone
can issue skips the device bookkeeping. The hang test is unchanged: once every placed block sits at
a spin and none is busy, the stretch is frozen from its first cycle or stepped until an attempt
succeeds or a snapshot of caches and rotations repeats.

This is how an expert would build it because it is conservative parallel discrete-event
simulation with per-component lookahead, applied to a machine whose components share only memory
and placement: each multiprocessor advances on its own until the next event it could observe, and
the observation rule is derived from the cache semantics rather than approximated. The instruction
names borrow PTX's cache operators - `.ca` caches in the first level, `.cg` bypasses it. Two
variants score 1: the sealed model's own clock, written apart from the reference with a different
plan structure and a Fenwick tree for memory sums, and a variant of the reference that never works
out when a cached line goes and steps those cycles instead.
"""

verification_explanation = """
`tests/test.sh` grades in two halves. The first runs `tests/worker.py` as an unprivileged user (uid
1002, no groups) under a 60-second timeout in its own session, and is the only code that executes
the submission: it copies the verifier's pristine tree, lays the six submitted files over it,
imports `run_launch` once and records what every graded launch printed, with a digest of the launch
it was given. Survivors are reaped by uid. The second half runs as root and never executes
submitted code: pytest compares the 42 hand launches with `tests/seal/gt.json`, answers frozen from
the sealed model that the grader first checks the model still reproduces, and 369 generated
launches with the sealed model itself, from a seed drawn with `secrets` at grading time, after the
agent's container is gone. The model has its own parser and clock and shares no code with the
reference. `tests/seal` is made root-only before the worker starts, so submitted code cannot import
the model, and the reward starts at 0 and becomes 1 only when the worker exits cleanly inside the
clock and every test passes.

The hand launches are one per graded rule and named for it, and each of 38 plausible wrong readings
fails at least one. The generated families are shaped around the mechanism rather than sampled:
split-K fixups whose last segment reads partials through a line an earlier block fetched, grid
barriers larger than the device, look-back chains, tile queues, statistics lines rewritten under
blocks placed later, more spun-on lines than a cache holds, dense load, store and fence mixes on
small caches, a stale spinner released only by a neighbour's miss, and tiles summed while a
prefetched copy goes stale, a waiter's flag is pushed out by a neighbour's sum, writers race the
sum from lower and higher multiprocessors, or two sums trail each other over shared lines. The
three large families put the scale boundary inside the graded set, and in the persistent one
over a thousand stores per launch land in a tile while it is being summed. Every cheat scores 0:
each wrong reading built from the reference, one fixed answer for every launch, one block at a time
in number order, a replay of the frozen hand answers keyed by launch, the delivered stepper that
knows no sums, the correct stepper that steps every line of every sum, the correct engine that
carries streams only while the whole device is quiet, and ten isolation probes against the reward
file, the grader, the sealed model, the collected set and the judge's own imports. Each probe was
also run against a copy of the verifier with its defence removed and scored 1 there, so its 0 is
the defence and not an accident. The judge runs from `/tests` with every root interpreter isolated
(`python3 -I`). Two correct variants written apart from the reference score 1. Passing therefore
means the six files implement the stated machine exactly, fast enough, on launches nobody had seen.
"""

category = "ML"

