expert_time_estimate_hours = 10

relevant_experience = """
Having worked on GPU kernels that synchronize across thread blocks - split-K reductions with a
fixup pass, grid-wide barriers, decoupled look-back scans, persistent kernels that pull tiles from
an atomic queue - or on the simulators and race checkers used to reason about them. Familiarity
with first-level caches that nothing keeps coherent and with the PTX cache operators, with why a
flag one block sets may never become visible to a block spinning on a cached copy, and with
co-residency deadlock, where a kernel that waits on the whole grid hangs because the grid never
fits on the device at once. Comfort with cycle-level and discrete-event simulation, with the
difference between a machine that is idle and one whose idle-looking parts are still changing
state, and with making a skip-ahead exact rather than approximately right.
"""

