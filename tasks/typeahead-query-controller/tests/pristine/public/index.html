<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Type-ahead panel</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 2rem; }
      #status { font-weight: 600; }
      #results { margin-top: .5rem; white-space: pre-wrap; }

    <script type="module" src="/src/main.ts"></script>
