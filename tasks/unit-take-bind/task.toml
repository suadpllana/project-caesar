]

expert_time_estimate_hours = 8

relevant_experience = """
I work on the front half of a language implementation - the reader, the module graph and the
binder that answers what a name means where it stands - and on the editor service that has to
answer the same question about a tree somebody is still typing into. The bugs that cost most in
that seat are binding bugs, because they are invisible on the inputs anyone tests with. A
resolver written as a relaxation loop is correct on every module graph small enough to reason
about by hand, and it stays correct right up to the point where a name can be reached by two
routes of the same length; then it starts answering with whichever route the loop happened to
walk first, and carrying that answer outward into modules that should have seen nothing at all.
What made it hard to find was that the wrong answer is a perfectly plausible one - a real symbol
from a real module at a believable distance - so it does not read as a bug until somebody
notices the same file resolving differently after an unrelated import is added at the bottom of
another file. What I took from it is that the order a binder settles things in is part of what
it means, not an implementation detail, and that ambiguity is the rule that turns that from a
matter of taste into a matter of correctness.
"""

